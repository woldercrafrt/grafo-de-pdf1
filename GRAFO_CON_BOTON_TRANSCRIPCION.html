 de la palabra y a la vez ésta es algunas veces impositiva , por lo que no oye y; lo que dice es sólo una indicción de lo que no dice, le permitirá buscar formas para escud riñar en el subcontexto, en el contexto y así no perder del todo el sentido de lo que dice y de lo escucha. La comunicación en salud , la producción e intercambio de palabras con las que se significa la salud y los mensajes de sa lud , está sujeta a la imposibilidad de sujetar la palabra y con ella la realidad. Sin embargo, a partir de la ilusión de la verdad de las palabras, los trabajadores e instituciones de salud toman decisiones que co nciernen a la vida , la muerte, el nacimiento, la vida cotidiana , el trabajo, la sexualidad , etcétera, de &quot;los otros&quot; frecuentemente invalidando la posibilidad de que la palabra de &quot;los otros&quot;, también es ilusoriamente verdadera (Chapela , 2004).</p><p>Es claro la postura institucional y el ejercicio de poder en este Modelo Médico Hegemónico validado por la misma institución , como lo señala Menéndez, (1979) dicho 186</p></div><div class='page-block'><span class='page-marker'>📄 Página 195 del PDF original (Tesis UACM):</span><p>modelo cumple con &quot;la práctica médica curativo-preventiva, normatizadora, de control y de legitimación; por lo que se da un proceso de organización jerarquizada de la normalización y de control dándose una actitud de atención paternalista fomentando la pasividad de los y las adolescentes y pacientes en general&quot;.</p><p>Así el personal de salud determina la relación dominante y ejerce en los y las adolescentes el clásico discurso &quot;tú , joven no tienes los conocimientos&quot;, sumando el concepto que tienen de la adolescencia que son inmaduros y que no saben lo que quieren, se realiza un comparativo entre las generaciones pasadas y las actuales, las cuales son rebeldes, y no existe disposición y apertura que permita reconocer el conocimiento de los otros, para ofrecer una atención objetiva que resuelva dudas y necesidades de los mismos. Con lo que respecta al discurso institu cio nal éste se encuentra dentro de los tres mecanismos de exclusión del discurso que identifica Foucault (1980), siendo el de exclusión por invalidación , el cual es marginado, no escuchado, no percibido ni existente , dándose el caso del discurso de la mujer, el niño, el ind ígena, los adultos mayores quienes son mirados como incapaces de expresarse coherente , inteligente y significativamente. El trabajador de la salud conti nuamente está excluyendo por este mecanismo la palabra y el discurso del &quot;otro&quot; (paciente) considerado como ignorante , irresponsable e insensible e impone el discurso institucional autoritario sobre el que construye su saber y por ende su discurso.</p><p>El trabajador de la salud frecuentemente se olvida o no comprende el contexto ni el sentido de las palabras que escucha y pierde el control de sus propias palabras al emitirlas fuera de contexto y del sentido que el &quot;otro&quot; le da a las palabras. Se pierde 187</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Trato de Regaño y Descalificación en Consulta</h3>\n<blockquote class=\"quote\">«La actitud del personal médico y de enfermería muchas veces es impositiva, indiferente o de regaño. Los adolescentes señalaron sentirse juzgados con frases como 'son muy jóvenes para aquello'... Una adolescente expresó: 'Me regañó el doctor la otra vez pero según él estuvo bien. Porque dice que si andamos de novios nos va a ir mal'» (p. 183-184).</blockquote>\n\n<h3>2. Demandas Reales de los Jóvenes</h3>\n<blockquote class=\"quote\">«Los adolescentes demandaron de forma unánime: 'Que los médicos sean más amables, que brindaran confianza, que no nos regañen ni nos juzguen y que expliquen sin palabras difíciles'» (p. 182-183).</blockquote>\n<p>El autoritarismo destruye el puente de confianza indispensable para que un joven revele conductas de riesgo de ITS.</p>\n</div>", "links": ["MMH_MENENDEZ", "EXIGENCIA_TUTOR", "ESTIGMA_PENA", "NOM_005"]}, {"id": "BARRERAS_CENTRO_SALUD", "title": "Barreras Institucionales en el C.S. Maximiliano Ruíz", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 169-173", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 169 del PDF original (Tesis UACM):</span><p>Tiempo de espera en el Centro de Salud</p><p>Cuando los y las adolescentes acuden al centro de salud es importante saber su permanencia en el mismo, la gráfica 1O nos muestra el tiempo de espera de los adolescentes y observamos que el 48% han esperado de 31 a 60 minutos para ser atendidos, mientras que el 27% han tardado de una a dos horas, por otro lado tenemos un 20% que fueron atendidos antes de 30 minutos le brindaron atención y tan solo un 5% ha esperado más de dos horas.</p><p>Gráfica 10</p><p>TIEMPO DE ESPERA 60</p><p>so</p><p>...</p><p>--</p><p>40</p><p>-</p><p>---</p><p>30</p><p>...</p><p>20</p><p>10</p><p>f--</p><p>»•</p><p>1----</p><p>f---</p><p>l ,.</p><p>o O A 30 MINUTOS</p><p>31 A 60 MINUTOS</p><p>61 A 120 MINUTOS</p><p>J</p><p>121o MÁS</p><p>Fuente . Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ru íz Castañeda.</p><p>161</p></div><div class='page-block'><span class='page-marker'>📄 Página 170 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes sobre la información de educación sexual y reproductiva</p><p>La percepción de los y las adolescentes sobre la información de educación sexual y reproductiva, otorgada en el centro de salud tenemos que el 32% de jóvenes contestaron que dicha información es entendible, mientras que el 26% dijo no habérsela brindado, aquí es importante saber si la solicitaron o no, en el caso de los adolescentes que no contestaron representa el 22%, y el 12% afirma haberles resuelto dudas y sólo el 5% y 3% respondieron que fue difícil de entender y no resuelve dudas, respectivamente . Ver gráfica 11.</p><p>Gráfica 11</p><p>OPINIÓN DE LOS Y LAS ADOLESCENTES SOBRE LA INFORMACIÓN DE EDUCACIÓN SEXUAL Y REPRODUCTIVA 35 30</p><p>25 20 15 10 5</p><p>o ENTENDIBLE</p><p>DIFICIL DE</p><p>NO RESUELVE</p><p>ENTENDER</p><p>DUDAS</p><p>SÍTE HA RESUELTO</p><p>NO TE LA HAN NO CONTESTÓ BRINDADO</p><p>DUDAS</p><p>Fuente· Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ruíz Castañeda .</p><p>162</p></div><div class='page-block'><span class='page-marker'>📄 Página 171 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes del material de difusión en materia de educación sexual y reproductiva</p><p>Sobre el material de difusión de educación sexual y reproductiva que los y las adolescentes reciben en el centro de salud tenemos que el 25% refiere percibirla como entendible y buena en cada uno de los casos , siguiéndole con el 23% de adolescentes que nunca leen el material, el 7% le parece de interés contra un 5% que manifiesta ser malo, y tan sólo el 2% respond ió no entender dicho material, finalmente el 13% no respondió. Ver gráfica 14.</p><p>Gráfica 12</p><p>OPINIÓN DE LOS ADOLESCENTES SOBRE EL MATERIAL DE DIFUSIÓN DE EDUCACIÓN SEXUAL Y REPRODUCTIVA 30 25 25 %</p><p>25 %</p><p>ENTE NDIBLE</p><p>BUE NA</p><p>20</p><p>15 10 5</p><p>o NO</p><p>DE INTE RES</p><p>ENTENDIBLE</p><p>MALA</p><p>NÚNCA LA</p><p>NO</p><p>LEO</p><p>CONTESTÓ</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ruiz Castañeda .</p><p>163</p></div><div class='page-block'><span class='page-marker'>📄 Página 172 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes del trato del personal de salud</p><p>Para englobar los datos recabados en los cuestionarios se consideraron tres grandes rubros que son : Atención Médica incluyéndose las áreas de Consultorio, Trabajo Social , Enfermería e Inmunizaciones; Servicio de Gabinete abarcando Laboratorio y Rayos X; y Servicio Administrativo compuesto por Archivo , Caja y Admin istración .</p><p>En la siguiente gráfica podemos observar la percepción que tienen los y las adolescentes respecto de los servicios considerados que presta el centro de salud , destacando en primera instancia que la percepción se encuentra entre buena y regular, sin embargo para el análisis detallado se debe tomar en cuenta las personas que no recibieron información y los que no asistieron al servicio, lo cual nos indica que se debe mejorar los dichos servicios. Grafica 13</p><p>OPINIÓN DE LOS Y LAS ADOLESCENTES SOBRE EL TRATO DEL PERSONAL DE SALUD</p><p>BUE NO</p><p>.ATENCIÓ N MÉDICA</p><p>.GABINETE</p><p>. ADM INISTRATIVO</p><p>REGULA R</p><p>M ALO</p><p>NO RECIBIÓ INFORMACIÓN</p><p>NO ASISTIÓ AL SERVICIO</p><p>Fuente: Cuestiona ri o aplicado en el Centro de Salud T-111 Dr. Max imiliano Ruíz Castañeda.</p><p>164</p></div><div class='page-block'><span class='page-marker'>📄 Página 173 del PDF original (Tesis UACM):</span><p>• Formas de brindar información sobre educación sexual y reproductiva del personal de salud.</p><p>La forma de dar información en materia de educación sexual y reproductiva a los y las adolescentes se concentra en material impreso, tenemos que los folletos representan el 41 %, siguiéndole las pláticas con un 25%, mientras que el 12% le corresponde a los volantes, y los trípticos y todas las formas de información se igualan al 8%, por último son las cartillas, exposiciones y carteles los que muestran el 2% en cada uno.</p><p>Gráfica 14</p><p>FORMAS DE BRINDAR INFORMACIÓN SOBRE EDUCACIÓN SEXUAL Y REPRODUCTIVA 45 40 35 30 25 20 15 10 S</p><p>o .._,e;~ q_:S-</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-11 1 Dr. Maxim1liano Ruiz Castañeda.</p><p>165</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Condiciones Físicas del C.S. Maximiliano Ruíz Castañeda</h3>\n<blockquote class=\"quote\">«El 48% de los adolescentes han esperado de 31 a 60 minutos para ser atendidos, mientras que el 27% ha tardado de una a dos horas, y un 5% más de dos horas... Asimismo, el 70% acude exclusivamente por trámites forzosos como certificados médicos y vacunas escolares» (p. 162).</blockquote>\n\n<h3>2. Obstáculos Detectados</h3>\n<ul>\n  <li><strong>Horarios Matutinos Incompatibles:</strong> Los módulos de salud reproductiva operan en horarios escolares, excluyendo a estudiantes.</li>\n  <li><strong>Cero Confidencialidad:</strong> Personal de intendencia, enfermería y otros pacientes entran y salen de los consultorios sin tocar la puerta durante la consulta.</li>\n  <li><strong>Falta de Servicios Amigables:</strong> Carencia de un espacio exclusivo para jóvenes en el centro de salud.</li>\n</ul>\n</div>", "links": ["MMH_MENENDEZ", "DESPACHO_PACIENTES", "AISLAMIENTO_ATENCION"]}, {"id": "EXIGENCIA_TUTOR", "title": "Exigencia Arbitraria de Tutor Adulto", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 209-212", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 209 del PDF original (Tesis UACM):</span><p>Conclusiones</p><p>De acuerdo con los resultados de la investigación realizada con los y las adolescentes y el personal de salud en el centro de salud Dr. Maximiliano Ru íz Castañeda, se concluyó que el personal de salud ejerce poder institucional en los y las adolescentes, lo cual no permite que éstos tomen sus propias decisiones. En primer lugar, algunos médicos no atienden a los y las adolescentes si éstos no van acompañados por un familiar o adulto que se haga responsable de ella o él, argumentando que es por seguridad personal sintiéndose más confiados que otro adulto asuma la responsabilidad del adolescente. Esto viola su derecho de atención de acuerdo con la Norma Oficial Mexicana de los Servicios de Planificación Familiar (NOM-005-SSA2-1993, publicada en su versión actualizada en el Diario Oficial de la Federación el 21 de enero de 2004) que establece que la planificación familiar es un derecho de toda persona , independientemente de su género, edad y estado social o legal. También señala que la consejería en materia de planificación familiar debe dar particular atención a la población adolescente, con absoluto respeto al derecho a decidir sobre su conducta sexual y reproductiva y al consentimiento informado en la prescripción de métodos anticonceptivos (NOM-005SSA2-1993, pág. 4 ). Esto muchas veces limita a los y las adolescentes de no expresar libremente sus dudas y necesidades con respecto a su cuerpo y sexualidad , se sienten intimidados y juzgados por ambas partes; en segundo lugar hay adolescentes que no tienen familia o tutor, algunos pueden encontrarse en situación de ca lle, esto tiene como consecuencia que los adolescentes no se acerquen a los servicios de salud y enfrenten los procesos de enfermedad sin acompañamiento afectando sus niveles de salud . 201</p></div><div class='page-block'><span class='page-marker'>📄 Página 210 del PDF original (Tesis UACM):</span><p>Dejar de prestar a los y las adolescentes información y servicios apropiados y oportunos por temor a legitimar y alentar la actividad sexual no es una opción viable y resulta contraproducente.</p><p>La afectación a su capacidad</p><p>política podemos observarla cuando los y las</p><p>adolescentes asisten a consulta de planificación familiar y en donde la mayoría de las veces no son ellos quienes libremente deciden por el método de anticoncepción, los y las adolescentes expresaron que es el médico (a) quien le &quot;sugiere&quot; el método a usar y no hay una explicación amplia e informada de los efectos en la salud al optar por uno de ellos, violando otro derecho como lo señala la NOM-005-SSA2-1993 de los servicios de planificación familiar en su inciso 4 .1.1: &quot;Los servicios de planificación familiar deberán proporcionar información, orientación , consejería, selección, prescripción, contraindicaciones y aplicación de métodos de control de la fertilidad, identificación y referencia en casos de esterilidad e infertilidad, prevención de infecciones de transmisión sexua l, atención materno-infantil , detección del riesgo preconcepcional, detección oportuna de cá ncer cérvico-uterino y de mama , además del manejo de la perimenopausia y la posmenopausia . La prestación de los servicios deberá de otorgarse de una manera integral con ca lidad y ca lidez a toda la población&quot; (pág. 6). Y esto evidencia de que los y las adolescentes son considerados como objetos por su condición de menores de edad (el 58% son mujeres y el 42 % son hombres) aspecto que viola el derecho a la sa lud cuando las decisiones deben partir del sujeto informado de acuerdo con lo señalado en la observación 14 del Pacto Internacional de Derechos Sociales, Económicos y Culturales.</p><p>202</p></div><div class='page-block'><span class='page-marker'>📄 Página 211 del PDF original (Tesis UACM):</span><p>Respecto de la capacidad erótica no existe posibilidad desde los discursos de la institución a ejercerla de una manera que promueva mejores niveles de salud, el poder del discurso sobre sexo y sexualidad se le transfiere -por parte del metacampo del Estado- de manera exclusiva al personal de salud, que no promueve la aceptación, expresión y ejercicio de manera libre, responsable y plena de su sexualidad, sino parte de un discurso prohibitivo y culpabilizador. Estos discursos son manejados también en la familia y la escuela , agencias de esta reproducción social.</p><p>En otro lado de la moneda existen algunos padres y madres que desean ayudar a sus hijos e hijas establecen una comunicación con tabús en cuestión relativas al sexo. Se sienten incompetentes para enfrentar esa tarea, y por otro lado, los hijos e hijas se muestran a menudo avergonzados para abordar el tema co n sus padres, lo que trae como consecuencia recurrir a otras formas que les den respuestas, no siempre de fuentes confiables , como puede ser la interne!, los amigos, revistas, en la escuela que más de las veces no es la que precisamente se interese por ello. Es imposible apartar a la población infantil y adolescente de las influencias sexuales sin una adecuada u optima educación sexual.</p><p>Al gunos modelos de comportamien to y la influencia de los diferentes medios de comunicación como son la televisión, revistas y los anuncios comerciales bombardean constantemente , pero no se compara con el silencio y las respuestas evasivas de padres y profesores.</p><p>203</p></div><div class='page-block'><span class='page-marker'>📄 Página 212 del PDF original (Tesis UACM):</span><p>Con lo que respecta a la atención médica el cuerpo es visto dentro de la institución como territorio en el cua l se inscribe la hegemonía de mercado y el discurso médico hegemónico construido por percepciones, representaciones , significados y valores propios de la institución médica donde la salud es concebida, practicada y vinculada a la enfermedad en sus tres dimensiones: prevención, curación o rehabilitación .</p><p>Sobre la capacidad sapiens, ésta se ve limitada por el personal de salud al no escuchar los conocimientos , saberes y experiencias de los y las adolescentes cuando se establece la relación médico-paciente, los tratan de ignorantes al hacerles sentir que por su juventud &quot;no saben lo que quieren&quot; y que &quot;a su edad el sexo es malo&quot;, esto nos muestra que el personal impone prejuicios y valores personales en la atención .</p><p>Etiquetan a los y las adolescentes a partir de su condición de clase social , apariencia o edad. La postura que el personal adopta es paternalista siempre manejando el &quot;regaño&quot; porque &quot;tú no lo sabes&quot;, ejercie ndo poder y haciendo uso de los capitales cultural y simbólico, es decir, de los conocimientos, habilidades y autoridad que la educación formal y la propia institución les otorga. El personal no muestra disposición ni apertura de reconocer la palabra del &quot;otro&quot; como &quot;sujeto&quot; que permita ofrecer una atención objetiva , por lo que las palabras de los y las adolescentes no son escuchadas, más aún son inexistentes.</p><p>Respecto a como se concibe la promoción de salud y la forma de estructurar sus prácticas en materia de educación sexual desde la institución por el personal de salud queda clara la visión que se tiene. La operatividad de los programas de promoción de la 204</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Práctica Ilegal de Condicionar la Consulta</h3>\n<blockquote class=\"quote\">«En primer lugar, algunos médicos no atienden a los y las adolescentes si éstos no van acompañados por un familiar o adulto que se haga responsable de ella o él, argumentando que es por seguridad personal, sintiéndose más confiados que otro adulto asuma la responsabilidad del adolescente. Esto viola su derecho de atención de acuerdo con la Norma Oficial Mexicana NOM-005-SSA2-1993» (Conclusiones, p. 201).</blockquote>\n\n<h3>2. Consecuencias Destructivas</h3>\n<ul>\n  <li><strong>Miedo al Castigo Familiar:</strong> Ninguna joven pedirá condones ni tratamiento de ITS si tiene a su madre o padre al lado en el consultorio.</li>\n  <li><strong>Expulsión de los más Vulnerables:</strong> Jóvenes huérfanos, expulsados de sus casas o en situación de calle quedan desamparados.</li>\n  <li><strong>Proliferación de Cadenas de Contagio:</strong> El adolescente no tratado transmite la infección a sus parejas.</li>\n</ul>\n</div>", "links": ["NOM_005", "RELACION_MEDICO_PACIENTE", "AISLAMIENTO_ATENCION", "DERECHOS_SEXUALES"]}, {"id": "NOM_005", "title": "Violación a la Norma Oficial NOM-005-SSA2-1993", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 209-212", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 209 del PDF original (Tesis UACM):</span><p>Conclusiones</p><p>De acuerdo con los resultados de la investigación realizada con los y las adolescentes y el personal de salud en el centro de salud Dr. Maximiliano Ru íz Castañeda, se concluyó que el personal de salud ejerce poder institucional en los y las adolescentes, lo cual no permite que éstos tomen sus propias decisiones. En primer lugar, algunos médicos no atienden a los y las adolescentes si éstos no van acompañados por un familiar o adulto que se haga responsable de ella o él, argumentando que es por seguridad personal sintiéndose más confiados que otro adulto asuma la responsabilidad del adolescente. Esto viola su derecho de atención de acuerdo con la Norma Oficial Mexicana de los Servicios de Planificación Familiar (NOM-005-SSA2-1993, publicada en su versión actualizada en el Diario Oficial de la Federación el 21 de enero de 2004) que establece que la planificación familiar es un derecho de toda persona , independientemente de su género, edad y estado social o legal. También señala que la consejería en materia de planificación familiar debe dar particular atención a la población adolescente, con absoluto respeto al derecho a decidir sobre su conducta sexual y reproductiva y al consentimiento informado en la prescripción de métodos anticonceptivos (NOM-005SSA2-1993, pág. 4 ). Esto muchas veces limita a los y las adolescentes de no expresar libremente sus dudas y necesidades con respecto a su cuerpo y sexualidad , se sienten intimidados y juzgados por ambas partes; en segundo lugar hay adolescentes que no tienen familia o tutor, algunos pueden encontrarse en situación de ca lle, esto tiene como consecuencia que los adolescentes no se acerquen a los servicios de salud y enfrenten los procesos de enfermedad sin acompañamiento afectando sus niveles de salud . 201</p></div><div class='page-block'><span class='page-marker'>📄 Página 210 del PDF original (Tesis UACM):</span><p>Dejar de prestar a los y las adolescentes información y servicios apropiados y oportunos por temor a legitimar y alentar la actividad sexual no es una opción viable y resulta contraproducente.</p><p>La afectación a su capacidad</p><p>política podemos observarla cuando los y las</p><p>adolescentes asisten a consulta de planificación familiar y en donde la mayoría de las veces no son ellos quienes libremente deciden por el método de anticoncepción, los y las adolescentes expresaron que es el médico (a) quien le &quot;sugiere&quot; el método a usar y no hay una explicación amplia e informada de los efectos en la salud al optar por uno de ellos, violando otro derecho como lo señala la NOM-005-SSA2-1993 de los servicios de planificación familiar en su inciso 4 .1.1: &quot;Los servicios de planificación familiar deberán proporcionar información, orientación , consejería, selección, prescripción, contraindicaciones y aplicación de métodos de control de la fertilidad, identificación y referencia en casos de esterilidad e infertilidad, prevención de infecciones de transmisión sexua l, atención materno-infantil , detección del riesgo preconcepcional, detección oportuna de cá ncer cérvico-uterino y de mama , además del manejo de la perimenopausia y la posmenopausia . La prestación de los servicios deberá de otorgarse de una manera integral con ca lidad y ca lidez a toda la población&quot; (pág. 6). Y esto evidencia de que los y las adolescentes son considerados como objetos por su condición de menores de edad (el 58% son mujeres y el 42 % son hombres) aspecto que viola el derecho a la sa lud cuando las decisiones deben partir del sujeto informado de acuerdo con lo señalado en la observación 14 del Pacto Internacional de Derechos Sociales, Económicos y Culturales.</p><p>202</p></div><div class='page-block'><span class='page-marker'>📄 Página 211 del PDF original (Tesis UACM):</span><p>Respecto de la capacidad erótica no existe posibilidad desde los discursos de la institución a ejercerla de una manera que promueva mejores niveles de salud, el poder del discurso sobre sexo y sexualidad se le transfiere -por parte del metacampo del Estado- de manera exclusiva al personal de salud, que no promueve la aceptación, expresión y ejercicio de manera libre, responsable y plena de su sexualidad, sino parte de un discurso prohibitivo y culpabilizador. Estos discursos son manejados también en la familia y la escuela , agencias de esta reproducción social.</p><p>En otro lado de la moneda existen algunos padres y madres que desean ayudar a sus hijos e hijas establecen una comunicación con tabús en cuestión relativas al sexo. Se sienten incompetentes para enfrentar esa tarea, y por otro lado, los hijos e hijas se muestran a menudo avergonzados para abordar el tema co n sus padres, lo que trae como consecuencia recurrir a otras formas que les den respuestas, no siempre de fuentes confiables , como puede ser la interne!, los amigos, revistas, en la escuela que más de las veces no es la que precisamente se interese por ello. Es imposible apartar a la población infantil y adolescente de las influencias sexuales sin una adecuada u optima educación sexual.</p><p>Al gunos modelos de comportamien to y la influencia de los diferentes medios de comunicación como son la televisión, revistas y los anuncios comerciales bombardean constantemente , pero no se compara con el silencio y las respuestas evasivas de padres y profesores.</p><p>203</p></div><div class='page-block'><span class='page-marker'>📄 Página 212 del PDF original (Tesis UACM):</span><p>Con lo que respecta a la atención médica el cuerpo es visto dentro de la institución como territorio en el cua l se inscribe la hegemonía de mercado y el discurso médico hegemónico construido por percepciones, representaciones , significados y valores propios de la institución médica donde la salud es concebida, practicada y vinculada a la enfermedad en sus tres dimensiones: prevención, curación o rehabilitación .</p><p>Sobre la capacidad sapiens, ésta se ve limitada por el personal de salud al no escuchar los conocimientos , saberes y experiencias de los y las adolescentes cuando se establece la relación médico-paciente, los tratan de ignorantes al hacerles sentir que por su juventud &quot;no saben lo que quieren&quot; y que &quot;a su edad el sexo es malo&quot;, esto nos muestra que el personal impone prejuicios y valores personales en la atención .</p><p>Etiquetan a los y las adolescentes a partir de su condición de clase social , apariencia o edad. La postura que el personal adopta es paternalista siempre manejando el &quot;regaño&quot; porque &quot;tú no lo sabes&quot;, ejercie ndo poder y haciendo uso de los capitales cultural y simbólico, es decir, de los conocimientos, habilidades y autoridad que la educación formal y la propia institución les otorga. El personal no muestra disposición ni apertura de reconocer la palabra del &quot;otro&quot; como &quot;sujeto&quot; que permita ofrecer una atención objetiva , por lo que las palabras de los y las adolescentes no son escuchadas, más aún son inexistentes.</p><p>Respecto a como se concibe la promoción de salud y la forma de estructurar sus prácticas en materia de educación sexual desde la institución por el personal de salud queda clara la visión que se tiene. La operatividad de los programas de promoción de la 204</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Sustento Jurídico Federal Violado en la Institución</h3>\n<blockquote class=\"quote\">«La Norma Oficial Mexicana de los Servicios de Planificación Familiar (NOM-005-SSA2-1993, publicada en su versión actualizada en el DOF el 21 de enero de 2004) establece que la planificación familiar es un derecho de toda persona, independientemente de su género, edad y estado social o legal. Señala que la consejería debe dar PARTICULAR ATENCIÓN a la población adolescente con absoluto respeto al derecho a decidir sobre su conducta sexual y al consentimiento informado» (p. 201).</blockquote>\n\n<h3>2. Numeral 4.1.1 de la Norma:</h3>\n<blockquote class=\"quote\">«'Los servicios de planificación familiar deberán proporcionar información, orientación, consejería, selección, prescripción, contraindicaciones y aplicación de métodos de control de la fertilidad... prevención de infecciones de transmisión sexual... La prestación de los servicios deberá de otorgarse de una manera integral con calidad y calidez a toda la población'» (p. 201-202).</blockquote>\n<p>La investigación califica la exigencia de tutor como un acto ilegal y una transgresión de derechos humanos.</p>\n</div>", "links": ["EXIGENCIA_TUTOR", "DERECHOS_SEXUALES", "MMH_MENENDEZ"]}, {"id": "CONDONERIA_FOLLETOS", "title": "Condonería y Reparto Pasivo de Folletos", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 172-176", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 172 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes del trato del personal de salud</p><p>Para englobar los datos recabados en los cuestionarios se consideraron tres grandes rubros que son : Atención Médica incluyéndose las áreas de Consultorio, Trabajo Social , Enfermería e Inmunizaciones; Servicio de Gabinete abarcando Laboratorio y Rayos X; y Servicio Administrativo compuesto por Archivo , Caja y Admin istración .</p><p>En la siguiente gráfica podemos observar la percepción que tienen los y las adolescentes respecto de los servicios considerados que presta el centro de salud , destacando en primera instancia que la percepción se encuentra entre buena y regular, sin embargo para el análisis detallado se debe tomar en cuenta las personas que no recibieron información y los que no asistieron al servicio, lo cual nos indica que se debe mejorar los dichos servicios. Grafica 13</p><p>OPINIÓN DE LOS Y LAS ADOLESCENTES SOBRE EL TRATO DEL PERSONAL DE SALUD</p><p>BUE NO</p><p>.ATENCIÓ N MÉDICA</p><p>.GABINETE</p><p>. ADM INISTRATIVO</p><p>REGULA R</p><p>M ALO</p><p>NO RECIBIÓ INFORMACIÓN</p><p>NO ASISTIÓ AL SERVICIO</p><p>Fuente: Cuestiona ri o aplicado en el Centro de Salud T-111 Dr. Max imiliano Ruíz Castañeda.</p><p>164</p></div><div class='page-block'><span class='page-marker'>📄 Página 173 del PDF original (Tesis UACM):</span><p>• Formas de brindar información sobre educación sexual y reproductiva del personal de salud.</p><p>La forma de dar información en materia de educación sexual y reproductiva a los y las adolescentes se concentra en material impreso, tenemos que los folletos representan el 41 %, siguiéndole las pláticas con un 25%, mientras que el 12% le corresponde a los volantes, y los trípticos y todas las formas de información se igualan al 8%, por último son las cartillas, exposiciones y carteles los que muestran el 2% en cada uno.</p><p>Gráfica 14</p><p>FORMAS DE BRINDAR INFORMACIÓN SOBRE EDUCACIÓN SEXUAL Y REPRODUCTIVA 45 40 35 30 25 20 15 10 S</p><p>o .._,e;~ q_:S-</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-11 1 Dr. Maxim1liano Ruiz Castañeda.</p><p>165</p></div><div class='page-block'><span class='page-marker'>📄 Página 174 del PDF original (Tesis UACM):</span><p>Para finalizar este capítulo en resumen tenemos que de acuerdo a los datos obtenidos a través de la encuesta realizada a los y las adolescentes indican lo siguiente:</p><p>Con lo que se refiere al género son las mujeres de entre 15 a 17 años de edad las que predominan en asistir al</p><p>centro de salud.</p><p>Los y las adolescentes dependen</p><p>económicamente son de sus padres, ya que la mayoría son solteros y estudiantes por lo que la regularidad de asistencia al centro de salud es de una o dos veces al año sólo acuden cuando tienen alguna</p><p>molestia eventual de enfermedad o por algún</p><p>requerimiento especifico de vacunas y certificado médico escolar, mencionaron haber permanecido de 31 a 60 minutos para que los atendieran ; demasiado tiempo para ellos.</p><p>La percepción de los y las adolescentes sobre la información de educación sexual y reproductiva brindada en el centro de salud la mayoría respondió que dicha información es entendible y referente al trato del personal de salud de los diferentes servicios de atención médica , de gabinete y administrativo es entre bueno y regular.</p><p>Y por último, a lo que se refiere con las formas y técnicas de brindar información sobre educación sexual y reproductiva del personal de salud hacia los y las adolescentes, la predominante consta en la entrega de folletos con dicha información impresa .</p><p>166</p></div><div class='page-block'><span class='page-marker'>📄 Página 175 del PDF original (Tesis UACM):</span><p>6. 2. Análisis de resultados cualitativos</p><p>Los resultados presentados en esta parte del capítulo se obtuvieron a partir del trabajo cua litativo realizado en el grupo de reflexión de los y las adolescentes, asimismo de las entrevistas realizadas al personal y a los y las adolescentes abordados en los diferentes servicios del centro de salud . De los cuales surgen los siguientes conceptos y categorías de análisis.</p><p>•</p><p>Sexualidad .</p><p>•</p><p>Educación sexual.</p><p>•</p><p>Asistencia al Centro de Salud .</p><p>•</p><p>Relación que se establece con el personal de salud .</p><p>•</p><p>Limitación de capacidades.</p><p>•</p><p>Derechos sexuales y reproductivos.</p><p>•</p><p>Discriminación .</p><p>•</p><p>Demandas de los y las adolescentes .</p><p>Los y las adolescentes y el persona l de salud decidieron participar de manera anónima, por lo que han sido nombrados con un seudón imo quedando de la siguiente manera:</p><p>No.</p><p>Edad de las adolescentes entrevistadas</p><p>Nombre</p><p>1</p><p>Adolescente de 18 años embarazada</p><p>María</p><p>2</p><p>Adolescente de 17 años madre</p><p>Sofía</p><p>3</p><p>Adolescente de 16 años soltera</p><p>Norma</p><p>4</p><p>Adolescente de 19 años madre</p><p>Aurora</p><p>5</p><p>Adolescente de 15 años soltera</p><p>Ana</p><p>6</p><p>Adolecente de 16 años soltera</p><p>Martha</p><p>7</p><p>Adolescente de 17 años soltera</p><p>Rosa</p><p>167</p></div><div class='page-block'><span class='page-marker'>📄 Página 176 del PDF original (Tesis UACM):</span><p>No.</p><p>1</p><p>Pers onal de salud ent revistados Personal</p><p>de</p><p>salud</p><p>administrativo de archivo</p><p>Clave Sra . Virginia</p><p>clínico</p><p>2</p><p>Personal de salud administrativo de caja</p><p>3</p><p>Personal de salud técnica radióloga y técnica en</p><p>Sr. Alfonso Téc . Rad. Clara</p><p>enfermería</p><p>No.</p><p>Dr. Sergio</p><p>4</p><p>Personal de salud médico</p><p>5</p><p>Personal de salud de trabajo social</p><p>T. S. Verónica</p><p>6</p><p>Personal de salud de enfermería</p><p>Enf. Elena</p><p>Edad de los y las adolesce ntes participantes en el grupo</p><p>Nombre</p><p>de reflexión 1</p><p>Adolescente de 19 años soltero</p><p>Gerardo</p><p>2</p><p>Adolescente de 16 años embarazada</p><p>Carmen</p><p>3</p><p>Adolescente de 16 años soltera</p><p>Ericka</p><p>4</p><p>Adolecente de 19 años soltero</p><p>lrving</p><p>5</p><p>Adolescente de 18 anos soltero</p><p>Rodrigo</p><p>6</p><p>Adolescente de 16 años soltero</p><p>Eduardo</p><p>7</p><p>Adolescente de 18 años casado</p><p>Raúl</p><p>8</p><p>Adolescente de 17 años soltera</p><p>Judith</p><p>9</p><p>Adolescente de 15 años soltera</p><p>Montserrat</p><p>10</p><p>Adolecente de 17 años soltero</p><p>Fernando</p><p>168</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Espejismo de la Folletería Impresa</h3>\n<blockquote class=\"quote\">«El 41% de la información son folletos y trípticos, seguido de pláticas con 25%... sin embargo, el 23% de los adolescentes refiere que nunca lee el material impreso, el 26% afirma que no se lo explicaron y sólo al 12% le resolvió dudas... A estas acciones se les llama 'promoción de la salud', la condonería y entrega de pulseras alusivas, pero no reflejan ningún impacto positivo en el aprendizaje de los adolescentes» (p. 164-165, 182).</blockquote>\n\n<h3>2. Razones de su Fracaso</h3>\n<ul>\n  <li><strong>Lenguaje Técnico Frío:</strong> Esquemas anatómicos que no responden a las dudas afectivas reales de los jóvenes.</li>\n  <li><strong>Sustituto de la Escucha:</strong> El médico entrega el papel y despacha al paciente en tres minutos.</li>\n  <li><strong>Desperdicio de Recursos:</strong> Folletos arrojados a la basura sin generar conciencia ni cambio de conducta.</li>\n</ul>\n</div>", "links": ["PS_INSTITUCIONAL", "CONDON_MITOS", "ESI_EMANCIPATORIA"]}, {"id": "DESPACHO_PACIENTES", "title": "Burocracia de 'Despacho' y Contabilidad", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 191-194", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 191 del PDF original (Tesis UACM):</span><p>No obstante que en la mayoría de los servicios el trato es violento, se encontró que en el archivo clínico el trato es diferente. Los y las adolescentes suelen acudir en pareja un 17% y en otros casos con la madre o el padre en un 50 %, sólo así se animan ir al centro de salud y preguntar abiertamente sobre sexualidad en estos casos al primer lugar que llegan generalmente es al archivo clínico:</p><p>&quot;Bueno es como le digo depende de con quién vengan , si vienen acompañados de la mamá o del papá hay veces que comienza a preguntar la mamá y ya ella le dice pide tú la información y ya nosotros le decimos qué se te ofrece, qué necesitas o de qué es tu trabajo , qué vas hacer y les damos confianza y empezamos a platicar y ya es cuando vienen con la mamá , pero cuando vienen solos o con amigos es lo que le digo vienen a preguntar pero entre dientes cómo hablando y no hablando rumorando o muchas veces uno le dice al otro pregunta tú, y ya nosotros nos acercamos y les decimos qué se te ofrece&quot; (Sra . Virginia).</p><p>Se pudo constatar por medio de la observación no participante y posteriormente mediante las entrevistas que se realizaron al personal de este servicio, que están sensibilizados al atender a los y las adolescentes; no todo el personal de salud tiene una actitud indiferente. Sin embargo, la estructura de la institución funciona como se ha descrito porque se constituye, finalmente , como agencia de poder y control de un metacampo de poder más amplio .</p><p>183</p></div><div class='page-block'><span class='page-marker'>📄 Página 192 del PDF original (Tesis UACM):</span><p>&quot;Ah pero los adolescentes vienen y preguntan sobre la información, algunos vienen directamente y preguntan dónde puedo encontrar información sobre la sexualidad que me piden en la escuela información del uso del condón y ya</p><p>entonces los mandamos allá arriba</p><p>directamente a trabajo social, son pocos los que vienen y digamos que son de los dos, hombres y mujeres los que vienen&quot; (Sr. Alfonso).</p><p>En el caso de la atención médica el personal refiere estar inmerso en sus tareas laborales, reconoce que los adolescentes requieren de una atención dirigida , sin embargo , concluye que el tiempo laboral no les permite brindar una atención con calidad a los y las adolescentes por la excesiva carga de trabajo y por las metas que la institución les pide, en un esquema de eficiencia pragmática lo que se requiere es &quot;despachar&quot; y contabilizar pacientes , un médico señala al respecto:</p><p>&quot;No, yo creo que como somos el primer enfoque la primera relación yo creo que sería muy importante que nosotros le diéramos algo más, más conocimiento , más armas al &quot;jovencito&quot; para que sepa más sobre la sexualidad y ya si a el le interesa saber más o adentrarse a lo que tenga más inquietud y que no sea suficiente lo que le digamos nosotros pues entonces tendría que ir a una temática de grupo&quot; (Médico Sergio}.</p><p>La falta de sensibilidad del personal médico los lleva a una postura paternalista que más allá de proteger o enseñar, más bien el trato es de reprimir y juzgar lo que lleva a regaños y/o a una atención superficial. A partir de este modo de trato los y las 184</p></div><div class='page-block'><span class='page-marker'>📄 Página 193 del PDF original (Tesis UACM):</span><p>adolescentes exigen que en el Centro de Salud haya personal capacitado con interés y compromiso de escucha de necesidades y resolución de dudas.</p><p>El ejercicio institucional trata a los y las adolescentes como sus subordinados, no permitiendo un acercamiento positivo en la atención sobre sexualidad , y aunque los adolescentes lo identifican terminan por aceptarlo.</p><p>Menéndez (1993), señala que esto se debe a los factores económico-políticos que son determinantes en la constitución de las formas de estratificación social dominantes, pero el reconocimiento de esto no debe conducir a considerar como subordinados ni determinados a los procesos ideológicos y culturales que intervienen en el proceso sa !ud/enfermedad/atención.</p><p>Los conceptos de hegemonía/subalternidad , así como otros procedentes de diferentes corrientes teóricas, asumen la existencia de desigualdades estratificadas, pero incluyendo como parte sustantiva de las mismas a los procesos socioculturales que operan favoreci endo la cohesión/integración , opacando las causales que establecen las desigualdades o promoviendo procesos de oposición o de otro tipo de transacciones , que posibilitan el desarrollo autónomo de sectores subalternos.</p><p>185</p></div><div class='page-block'><span class='page-marker'>📄 Página 194 del PDF original (Tesis UACM):</span><p>Limitación de capacidades</p><p>El personal impone prejuicios y valores personales en la atención . Etiquetan a los y las adolescentes a partir de un estereotipo socialmente negativo; por su condición de clase , apariencia o edad.</p><p>&quot;Me regañó el doctor la otra vez pero estuvo bien . Porque, dice que si sabía, que</p><p>me dolían los ovarios y que si sabía dónde estaban los</p><p>ovarios, pero me dijo que tenía una infección urinaria&quot; (Ana).</p><p>El trabajador de la salud cuenta con el recurso de la palabra y a la vez ésta es algunas veces impositiva , por lo que no oye y; lo que dice es sólo una indicción de lo que no dice, le permitirá buscar formas para escud riñar en el subcontexto, en el contexto y así no perder del todo el sentido de lo que dice y de lo escucha. La comunicación en salud , la producción e intercambio de palabras con las que se significa la salud y los mensajes de sa lud , está sujeta a la imposibilidad de sujetar la palabra y con ella la realidad. Sin embargo, a partir de la ilusión de la verdad de las palabras, los trabajadores e instituciones de salud toman decisiones que co nciernen a la vida , la muerte, el nacimiento, la vida cotidiana , el trabajo, la sexualidad , etcétera, de &quot;los otros&quot; frecuentemente invalidando la posibilidad de que la palabra de &quot;los otros&quot;, también es ilusoriamente verdadera (Chapela , 2004).</p><p>Es claro la postura institucional y el ejercicio de poder en este Modelo Médico Hegemónico validado por la misma institución , como lo señala Menéndez, (1979) dicho 186</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Confesión del Personal Médico</h3>\n<blockquote class=\"quote\">«En el caso de la atención médica el personal refiere estar inmerso en sus tareas burocráticas de 'despachar' y contabilizar pacientes. Un médico señala al respecto: 'Nosotros tenemos que despachar y contabilizar pacientes... si al chavo le interesa saber más sobre sexualidad o adentrarse a lo que es pues entonces tendría que ir a una temática de grupo... Nosotros los médicos nos debemos dar cuenta que los tiempos han cambiado pero no nos actualizamos como debe de ser' (Médico Sergio, entrevista p. 184).»</blockquote>\n\n<h3>2. La Lógica Fabril de las Cuotas</h3>\n<p>La Secretaría de Salud evalúa el rendimiento por número de consultas (10 a 15 minutos por paciente), castigando el tiempo necesario para realizar una consejería bioética profunda sobre ITS.</p>\n</div>", "links": ["MMH_MENENDEZ", "BARRERAS_CENTRO_SALUD", "RELACION_MEDICO_PACIENTE"]}, {"id": "PARADIGMAS_CIENCIA", "title": "Tensión de Paradigmas Científicos", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 11-14", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 11 del PDF original (Tesis UACM):</span><p>visión emancipatoria y que impulsa las capacidades humanas en los y las adolescentes y que permite una construcción de proyecto desde su propia experiencia.</p><p>En este sentido, surge el interés de observar y analizar las prácticas de promoción de la salud institucional en materia de sexualidad y parto de una primera pregunta de investigación : ¿Cuáles son las - formas de brindar educación sexual a los y las adolescentes de 15 a 19 años de edad en el Centro de Salud T-111 Maximiliano Ruíz Castañeda?</p><p>El interés sobre el tema de las prácticas de promoción de la salud institucional tiene un referente evidentemente empírico a partir del contacto que tengo con los centros de salud donde laboro, aspecto que me ha permitido un acercam iento cotidiano con el personal de salud y con los y las adolescentes que acuden a solicita r el servicio de educación sexual. El reto académico consistió en lograr una mirada crítica sobre cómo se instituyen las prácticas de promoción de la sa lud respecto a educación sexua l en los servicios de Salud Pública , ¿por qué seña ló que es un reto? porque participo de alguna manera en la reproducción de muchas de esas prácticas que ahora puedo cuestionar y reflexionar a partir de mi formación de la licenciatura en promoción de la salud.</p><p>A partir de esta realidad se plantean los siguientes objetivos generales:</p><p>Identificar el tipo de educación sexual otorgada a los y las adolescentes de 15 a 19 años de edad en el C. S. T-111 Maximiliano Ruiz Castañeda.</p><p>3</p></div><div class='page-block'><span class='page-marker'>📄 Página 12 del PDF original (Tesis UACM):</span><p>Reflexionar sobre las prácticas de promoción de la salud operadas en la institución de salud.</p><p>La metodología planteada en la investigación parte del paradigma cualitativo , la cual da la oportunidad de nombrar &quot;palabras&quot; y mirar &quot;conductas&quot;, teniendo como resultado una descripción transparente y una comprensión de las múltiples experiencias de los y las adolescentes que asisten al centro de salud . Así mismo, se utilizó de la estadística descriptiva para recabar información socio-demográfica de la población sujeto de estudio.</p><p>El contenido del trabajo está conformado por seis capítulos, el primero nos da un panorama general acerca del concepto de adolescencia como construcción social. Se presenta un resumen del campo de estudio desde la perspectiva de la Antropología Social , la Sociología, la Psicología y desde la Médico-biologicista , cerrando este capitulo abordando algunos problemas de enfermedad de los y las adolescentes.</p><p>El segundo capítulo abarca los principales conceptos de educación sexual , así como algunas experiencias en América Latina , la intervención instituciona l mediante los diferentes programas de salud en la atención con los y las adolescentes en México.</p><p>El capítulo tres consta de la visión de promoción de la salud desde diversos enfoques teórico-metodológicos</p><p>seleccionados</p><p>para</p><p>este estudio: socio-histórico,</p><p>médico-</p><p>hegemónico, estilos de vida y de la propuesta emancipatoria. Esta última forma parte de la orientación teórica seguida en el presente trabajo debido al interés de identificar las 4</p></div><div class='page-block'><span class='page-marker'>📄 Página 13 del PDF original (Tesis UACM):</span><p>similitudes y diferencias de los enfoques de la promoción de la salud institucional y emancipatoria desde las perspectivas de un grupo de adolescentes y del personal de salud.</p><p>El cuarto capítulo trata sobre las características de la delegación lztapalapa y se presenta un panorama general de los aspectos sociales, políticos y económicos de la población en estudio, lo cual muestra sus características específicas.</p><p>En el quinto capitulo se describe la metodología y se detalla el tipo de estudio y las técnicas e instrumentos utilizados, así como el universo de trabajo y los criterios de se lección.</p><p>El estudio es descriptivo porque específica situaciones y eventos, describe las prácticas de promoción de la salud que el personal de salud ofrece a los y las adolescentes en el tema de educació n sexual.</p><p>Para recabar datos socio-demográficos de los y las adolescentes, así como la información y la atención que reciben en el centro de salud con respecto al tema de sal ud sexua l y reproductiva , se diseñó un cuestionario, el cual se aplicó a 60 adolescentes de manera aleatoria dentro de la consu lta médica , en enfermería , en el servicio de trabajo social y en la sala de espera del Centro de Salud en donde se realizó la investigación .</p><p>5</p></div><div class='page-block'><span class='page-marker'>📄 Página 14 del PDF original (Tesis UACM):</span><p>Con respecto a la obtención de información cualitativa se realizaron entrevistas semiestructuradas al personal de salud y a los y las adolescentes; se formó un grupo de reflexión con los adolescentes, lo cual aportó una interacción rica de experiencias sobre el trato que han recibido por parte del personal de salud .</p><p>Finalmente, el capítulo seis consta del análisis de resultados cuantitativos y cualitativos , el cual detalla cada punto de los temas indagados, habla sobre la postura del personal de salud , de la manera en la que los y las adolescentes perciben la atención, cómo son limitadas sus capacidades , cuáles son sus necesidades como adolescentes y cuál es la relación que se establece entre médico-paciente.</p><p>La realización de esta investigación permite visibilizar el sentir de un grupo de población conceptualizada como &quot;adolescentes&quot; (el otro). Me parece importante compartir lo que aprendí con ellos; en lo personal despertó un profundo y comprometido interés estudiar el campo de la sexualidad y las prácticas de promoción de la salud en las instituciones. Si bien es cierto que la promoción de la salud es un campo en construcción y que la concepción de la salud se ha extendido desde los planteamientos de la Carta de Ottawa (1986), también es real que el campo de la sa lud sexual y los derechos sexuales de los</p><p>y las adolescentes es todavía un campo marginal. Considero que mediante prácticas de promoción de la salud emancipatoria se pueden revertir los problemas planteados inicialmente al permitir a los sujetos su autoconstrucción y la defensa de sus derechos en la atención de la salud.</p><p>6</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Epígrafe de Edgar Morin</h3>\n<blockquote class=\"quote\">«Nosotros pensamos que existe todavía un vasto sector de la ciencia social en el que no se está más que en las etapas taylorianas de la racionalización del trabajo intelectual y en el que el pleno de la personalidad no puede más que contribuir al rigor científico. El rigor del razonamiento es más importante que el del cálculo. El cuestionamiento es más importante que el cuestionario» (Edgar Morin, epígrafe p. 6).</blockquote>\n\n<h3>2. La Tensión Epistémica Central</h3>\n<ul>\n  <li><strong>Positivismo Biologicista:</strong> Cuantifica casos y bacterias, pero ignora el significado social del afecto.</li>\n  <li><strong>Pensamiento Complejo:</strong> Comprende que las prácticas sexuales adolescentes mezclan riesgos, placeres, desigualdad territorial y mandatos de género.</li>\n</ul>\n</div>", "links": ["POSITIVISMO_BIOMEDICO", "CUALITATIVO_SOCIO", "METODOLOGIA_MIXTA"]}, {"id": "POSITIVISMO_BIOMEDICO", "title": "Paradigma Positivista Biomédico", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 15-18", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 15 del PDF original (Tesis UACM):</span><p>CAPÍTULO 1 La Adolescencia</p><p>En este capítulo se da un panorama general del concepto adolescencia y se presenta un breve apartado visto desde la construcción social; asimismo, se da un resumen de los campos de estudio desde la perspectiva: antropología social, sociología, psicología y médico-biológica. También se abordan algunos problemas de enfermedad que enfrentan los y las adolescentes y su incidencia en nuestro país.</p><p>1. 1. Una aproxi mación al Concepto</p><p>Es importante empezar con un acercamiento de adolescencia, la siguiente definición la retomo de Armida Aberastury ( 1992) quien define : &quot;literalmente adolescencia (latín ad : a, hacia+olescere: forma incoativa de oleré , crecer) significa la condición o el proceso de crecimiento&quot;, aplica el término adolescencia al período de vida comprendido entre la pubertad y la edad adulta , el adolescente atraviesa por desequilibrios e inestabilidad extremas. Lo que configura una entidad, que es perturbadora para el mundo de los adultos, sin embargo , muy útil o benéfico para los y las adolescentes, que en este proceso va a establecer su identidad .</p><p>La adolescencia desde una visión biologicista: &quot;El paradigma biologicista surge como resultado de diversos descubrimientos científicos en esferas de la biología, en un contexto histórico en el cual la Medicina y otras ciencias necesitaban despojarse del oscurantismo de una época asistida por los recursos religiosos, en ocasiones, 7</p></div><div class='page-block'><span class='page-marker'>📄 Página 16 del PDF original (Tesis UACM):</span><p>extremos, anulando todo lo que no fuera de concepción divina&quot; (www.bus.sld .cu, consultada 08 abril 2011) es la etapa de maduración entre la niñez y la condición de adulto, el término denota el periodo desde el inicio de la pubertad hasta la madurez. Aunque esta etapa de transición varía entre las diferentes culturas , en general se define como el periodo de tiempo que los individuos necesitan para considerarse autónomos e independientes socialmente . Para</p><p>muchos la</p><p>adolescencia es</p><p>un</p><p>periodo</p><p>de</p><p>incertidumbre e inclusive de desesperación ; para otros es una etapa de amistades internas, de aflojamiento de ligaduras con los padres, y de sueños acerca del futuro.</p><p>Se dice que la adolescencia es la línea divisoria entre la seguridad de la niñez y el mundo desconocido del adulto. Este período comprende entre el final de la infancia y el principio de la edad adulta. Suele comenzar a los 12 y 14 años en la mujer y en el hombre respectivamente y termina a los 21 . En esta etapa se experimentan cambios que se dan a escala social, sexua l, física y psicológica y termina cuando se llega al pleno estatus sociológico del adulto (Papalia , 2006).</p><p>En cierto sentido, la adolescencia ha venido a ser una etapa de desarrollo humano con naturaleza propia , distinta de las demás, sin embargo, si só lo se define como la terminación de la niñez por un lado y el principio de la edad adulta por otro, se considera que el conce pto de adolescencia estará siempre muy lejos de lo que el propio adolescente experimenta . Con lo que respecta a la adolescencia desde la cultura occidental, expresa la etapa del crecimiento definida especialmente por la búsqueda de la identificación y diferenciación como seres únicos. Los adolescentes necesitan confrontar con los adultos y cuestionar los modelos sociales y culturales establecidos. 8</p></div><div class='page-block'><span class='page-marker'>📄 Página 17 del PDF original (Tesis UACM):</span><p>De acuerdo con Lauro Estrada (1987), la adolescencia es tal vez la etapa que pone más a prueba la flexibilidad del sistema familiar, ya que se presentan con frecuencia situaciones de desacuerdos en actitudes y pensamientos con respecto a la forma de hablar, vestir, comportarse y/o el desempeño académico dejando claramente una rebeldía hacía los adultos, esto se debe, a los grandes cambios y reestructuraciones de los y las adolescentes.</p><p>1. 2. La adolescencia como construcción social</p><p>Se podría decir que el concepto ha tenido transformaciones y sign ificaciones diferenciadas a partir del desarrollo histórico de las civilizaciones , anteriormente la adolescencia transcurría sin que se le considerara algo de particular importancia en el ciclo de vida, &quot;antes de la mitad del siglo XIX , la edad no constituía un factor particularmente importante o revelador de la experiencia social y la mayor parte de la gente solía mostrar tal indiferencia respecto a la edad &quot; (Kett, 1993). La co nstrucción de la adolescencia , como etapa de transición entre la niñez y la adultez, cobró importancia en la modernidad , a finales del siglo XIX. Los conceptos de adolescencia y juventud corresponden a una construcción social , histórica, cultural y relacional , que a través de las diferentes épocas y procesos históricos y sociales han ido adquiriendo denotaciones y delimitaciones diferentes: &quot;la juventud y la vejez no están dadas, sino que se construyen socialmente en la lucha entre jóvenes y viejos&quot; (Bourdieu, 2000).</p><p>A partir del desarrollo conceptual, la historiografía -y la filosofía- nos aportan los antecedentes, principalmente por el trabajo de fuentes documentales accesibles, donde 9</p></div><div class='page-block'><span class='page-marker'>📄 Página 18 del PDF original (Tesis UACM):</span><p>a partir de la tensión siempre presente en el análisis social sobre la constitución de categorías sociales y nociones que den cuenta del proceso en que los sujetos atraviesan por un ciclo vital definido histórica y culturalmente (Sandoval , 2002; Feixa , 1999; Levi y Schmitt, 1996). La adolescencia hoy en día es vista como una etapa de cuestionamientos, en la que los y las adolescentes buscan dejar ser niños para poder integrarse al mundo de los adultos, lo cua l los lleva a serios procesos psicológicos y sociales que los caracterizan como individuos cambiantes, creativos, pero también irritantes y/o conflictivos, lo que conlleva a una difícil o lenta adaptación a nuevas situaciones o demandas sociales.</p><p>Los y las adolescentes generalmente no se perciben como un ser aislado sino que siempre están en constante interacción con los otros, que forman parte de las diferentes instituciones llámese: familia, escuela, iglesia, trabajo, etcétera. Es por eso que su realidad de la vida cotidiana y su mundo es compartido con los otros a pesar de las diferencias que hay de pensamientos y acciones con &quot;otros&quot; (padres , adultos, maestros). Y aunque a veces se cuestionan sobre la realidad , la asumen y aceptan en algunas ocasiones porque simplemente se da por establecida socialmente, las formas de percibir, comprender y explicar el mundo que los rodea tiene que ver con las formas de instalarse en su interior y las agencias de poder se encargan de construir un &quot;tipo&quot; de adolescente que responda a las necesidades del poder.</p><p>Así Bourdieu y Passeron (1995) señalan que el trabajo pedagógico tiene la función de inculcar una serie de principios, valores y normas que se interiorizan en los individuos, pero que además tienen que ser durables, es decir un habitus producido por la 10</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Origen y Límites del Paradigma Biologicista</h3>\n<blockquote class=\"quote\">«El paradigma biologicista surge como resultado de diversos descubrimientos en esferas de la biología, en un contexto histórico en el cual la Medicina y otras ciencias necesitaban despojarse del oscurantismo de una época asistida por recursos religiosos... pero terminó despojando al sujeto de su subjetividad» (p. 7-8).</blockquote>\n\n<h3>2. El Punto Ciego en la Prevención</h3>\n<p>El positivismo cree erróneamente que mostrar estadísticas de mortalidad atemorizará al adolescente y lo forzará a usar condón, ignorando que la sexualidad humana se mueve por el deseo, el amor romántico y las relaciones de poder.</p>\n</div>", "links": ["PARADIGMAS_CIENCIA", "MMH_MENENDEZ", "ITS_EPIDEMIOLOGIA"]}, {"id": "CUALITATIVO_SOCIO", "title": "Paradigma Cualitativo y Socio-Crítico", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 11-14", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 11 del PDF original (Tesis UACM):</span><p>visión emancipatoria y que impulsa las capacidades humanas en los y las adolescentes y que permite una construcción de proyecto desde su propia experiencia.</p><p>En este sentido, surge el interés de observar y analizar las prácticas de promoción de la salud institucional en materia de sexualidad y parto de una primera pregunta de investigación : ¿Cuáles son las - formas de brindar educación sexual a los y las adolescentes de 15 a 19 años de edad en el Centro de Salud T-111 Maximiliano Ruíz Castañeda?</p><p>El interés sobre el tema de las prácticas de promoción de la salud institucional tiene un referente evidentemente empírico a partir del contacto que tengo con los centros de salud donde laboro, aspecto que me ha permitido un acercam iento cotidiano con el personal de salud y con los y las adolescentes que acuden a solicita r el servicio de educación sexual. El reto académico consistió en lograr una mirada crítica sobre cómo se instituyen las prácticas de promoción de la sa lud respecto a educación sexua l en los servicios de Salud Pública , ¿por qué seña ló que es un reto? porque participo de alguna manera en la reproducción de muchas de esas prácticas que ahora puedo cuestionar y reflexionar a partir de mi formación de la licenciatura en promoción de la salud.</p><p>A partir de esta realidad se plantean los siguientes objetivos generales:</p><p>Identificar el tipo de educación sexual otorgada a los y las adolescentes de 15 a 19 años de edad en el C. S. T-111 Maximiliano Ruiz Castañeda.</p><p>3</p></div><div class='page-block'><span class='page-marker'>📄 Página 12 del PDF original (Tesis UACM):</span><p>Reflexionar sobre las prácticas de promoción de la salud operadas en la institución de salud.</p><p>La metodología planteada en la investigación parte del paradigma cualitativo , la cual da la oportunidad de nombrar &quot;palabras&quot; y mirar &quot;conductas&quot;, teniendo como resultado una descripción transparente y una comprensión de las múltiples experiencias de los y las adolescentes que asisten al centro de salud . Así mismo, se utilizó de la estadística descriptiva para recabar información socio-demográfica de la población sujeto de estudio.</p><p>El contenido del trabajo está conformado por seis capítulos, el primero nos da un panorama general acerca del concepto de adolescencia como construcción social. Se presenta un resumen del campo de estudio desde la perspectiva de la Antropología Social , la Sociología, la Psicología y desde la Médico-biologicista , cerrando este capitulo abordando algunos problemas de enfermedad de los y las adolescentes.</p><p>El segundo capítulo abarca los principales conceptos de educación sexual , así como algunas experiencias en América Latina , la intervención instituciona l mediante los diferentes programas de salud en la atención con los y las adolescentes en México.</p><p>El capítulo tres consta de la visión de promoción de la salud desde diversos enfoques teórico-metodológicos</p><p>seleccionados</p><p>para</p><p>este estudio: socio-histórico,</p><p>médico-</p><p>hegemónico, estilos de vida y de la propuesta emancipatoria. Esta última forma parte de la orientación teórica seguida en el presente trabajo debido al interés de identificar las 4</p></div><div class='page-block'><span class='page-marker'>📄 Página 13 del PDF original (Tesis UACM):</span><p>similitudes y diferencias de los enfoques de la promoción de la salud institucional y emancipatoria desde las perspectivas de un grupo de adolescentes y del personal de salud.</p><p>El cuarto capítulo trata sobre las características de la delegación lztapalapa y se presenta un panorama general de los aspectos sociales, políticos y económicos de la población en estudio, lo cual muestra sus características específicas.</p><p>En el quinto capitulo se describe la metodología y se detalla el tipo de estudio y las técnicas e instrumentos utilizados, así como el universo de trabajo y los criterios de se lección.</p><p>El estudio es descriptivo porque específica situaciones y eventos, describe las prácticas de promoción de la salud que el personal de salud ofrece a los y las adolescentes en el tema de educació n sexual.</p><p>Para recabar datos socio-demográficos de los y las adolescentes, así como la información y la atención que reciben en el centro de salud con respecto al tema de sal ud sexua l y reproductiva , se diseñó un cuestionario, el cual se aplicó a 60 adolescentes de manera aleatoria dentro de la consu lta médica , en enfermería , en el servicio de trabajo social y en la sala de espera del Centro de Salud en donde se realizó la investigación .</p><p>5</p></div><div class='page-block'><span class='page-marker'>📄 Página 14 del PDF original (Tesis UACM):</span><p>Con respecto a la obtención de información cualitativa se realizaron entrevistas semiestructuradas al personal de salud y a los y las adolescentes; se formó un grupo de reflexión con los adolescentes, lo cual aportó una interacción rica de experiencias sobre el trato que han recibido por parte del personal de salud .</p><p>Finalmente, el capítulo seis consta del análisis de resultados cuantitativos y cualitativos , el cual detalla cada punto de los temas indagados, habla sobre la postura del personal de salud , de la manera en la que los y las adolescentes perciben la atención, cómo son limitadas sus capacidades , cuáles son sus necesidades como adolescentes y cuál es la relación que se establece entre médico-paciente.</p><p>La realización de esta investigación permite visibilizar el sentir de un grupo de población conceptualizada como &quot;adolescentes&quot; (el otro). Me parece importante compartir lo que aprendí con ellos; en lo personal despertó un profundo y comprometido interés estudiar el campo de la sexualidad y las prácticas de promoción de la salud en las instituciones. Si bien es cierto que la promoción de la salud es un campo en construcción y que la concepción de la salud se ha extendido desde los planteamientos de la Carta de Ottawa (1986), también es real que el campo de la sa lud sexual y los derechos sexuales de los</p><p>y las adolescentes es todavía un campo marginal. Considero que mediante prácticas de promoción de la salud emancipatoria se pueden revertir los problemas planteados inicialmente al permitir a los sujetos su autoconstrucción y la defensa de sus derechos en la atención de la salud.</p><p>6</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Nombrar Palabras y Mirar Conductas</h3>\n<blockquote class=\"quote\">«La metodología planteada en la investigación parte del paradigma cualitativo, la cual da la oportunidad de nombrar 'palabras' y mirar 'conductas', teniendo como resultado una descripción transparente y una comprensión de las múltiples experiencias de los y las adolescentes que asisten al centro de salud» (p. 4).</blockquote>\n\n<h3>2. Herramientas Hermenéuticas</h3>\n<ul>\n  <li><strong>Entrevistas a Fondo:</strong> Rescate del testimonio vivo de adolescentes y profesionales de salud.</li>\n  <li><strong>Observación Participante:</strong> Registro del trato burocrático en salas de espera y consultorios.</li>\n  <li><strong>Talleres de Reflexión:</strong> Espacio dialógico donde emergen los significados colectivos.</li>\n</ul>\n</div>", "links": ["PARADIGMAS_CIENCIA", "METODOLOGIA_MIXTA", "PS_EMANCIPATORIA"]}, {"id": "ANTROPOLOGIA_SOCIOLOGIA", "title": "Aporte de la Antropología y Sociología", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 20-25", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 20 del PDF original (Tesis UACM):</span><p>inequidad de género se articulan de muy diversas maneras para producir un estado de vulnerabilidad social en grandes sectores de nuestra población (Sánchez, 1999).</p><p>Se puede concluir que los y las adolescentes se construye a partir de una serie de referentes históricos, sociales y culturales permeando pensamientos, acciones y ubicándolo en una dimensión biológica , psicológica, simbólica y social. Los valores , las emociones, sus necesidades, sus comportamientos serán confeccionados a partir de arbitrarios culturales impuestos desde la agencia de poder.</p><p>1. 3. La adolescencia como campo de estudio desde diversas disciplinas</p><p>No hay teorías fáciles con que podamos definir la adolescencia , desde las diversas perspectivas teóricas e inclusive en un mismo campo disciplinar se encuentran diversas posiciones y explicaciones considerando que parten desde distintos paradigmas explicativos. A continua ción se presenta de manera breve lo que la adolescencia significa en tres campos de estudio: social, comportamental y biológico.</p><p>1. 3. 1. Antropología social</p><p>De acuerdo con los estudios antropológicos, entre los individuos existen grandes diferencias supeditadas a la cultura en la cual fueron socializados en aspectos tales como métodos de crianza , restricciones y limitaciones impuestas a la juventud, y en general, en las formas de condicionamiento social acompañado de valores y normas sociales. 12</p></div><div class='page-block'><span class='page-marker'>📄 Página 21 del PDF original (Tesis UACM):</span><p>Algunos autores consideran que en el medio rural , la cultura es más homogénea, por lo que pueden esperarse mayores similitudes en la actitud de los adolescentes al ser más limitadas sus oportunidades de elección. Por eso, el conocimiento de su medio y de su pensamiento hace su conducta más fácil de predecir, a diferencia de los jóvenes que habitan las ciudades, donde existen menores semejanzas (Cerruti, 1992).</p><p>Esta diferencia puede explicarse por lo siguiente:</p><p>a) La heterogeneidad de la cultura , que puede ser ocasionada por las múltiples subculturas que se interceptan.</p><p>b) La transmisión de información entre diversas zonas geográficas que hace la cultura más dinámica .</p><p>e) La amp litud y variedad de los antecedentes cu lturales.</p><p>Los y las adolescentes que viven en las sociedades más avanzadas se enfrentan a la llamada urbanización-tecnología y por ende a la centra lización lo que en algunos casos conlleva a oportunidades y acceso de trabajo, escuela , cultura, servicio médico, etcétera , durante su etapa escolar se le dijo que mediante el estud io y la formación obtendrá un medio de vida cómodo, sin embargo, experimentan dificultades por no tener cabida en espacios y tiempos de trabajo remunerado para llegar a ser autosuficientes. Lo anterior desencadena el alto índice de deserción escola r, luego entonces, el desempleo aumenta . 13</p></div><div class='page-block'><span class='page-marker'>📄 Página 22 del PDF original (Tesis UACM):</span><p>1. 3. 2. Sociología</p><p>En las sociedades occidentales complejas, caracterizadas por súbitos cambios tecnológicos y sociales, los y las adolescentes se encuentran frente a múltiples alternativas hacia las cuales orientar sus vidas. Esto reduce las posibilidades de que sus expectativas concuerden con las de sus padres, dado que ambos crecieron en medios con distinta estimulación ambiental , y en ocasiones, con distintos valores .</p><p>Para visualizar de manera objetiva el comportamiento de los y las adolescentes es importante entender cómo se da el proceso de la socialización. Se interioriza mediante la interacción con los diferentes agentes en la sociedad primaria , en donde la familia y la escuela, principalmente , juegan un papel importante, por lo que los y las adolescentes asumen un sentido común, que es construido mediante las ideas e imágenes que tienen en la conciencia , de acuerdo con la esfera de su realidad y de cómo va n asimilándose, pero sobre todo , del sentir que experimentan de una vivencia a otra, por lo que le causa expectativa en un estado natural, y luego entonces, su vida cotidiana es un proceso por el cual hay una serie de acciones y pensamientos que simplemente deben de &quot;asumir&quot;, estén o no de acuerdo con ellos, simplemente por el hecho de se r normativas socialmente.</p><p>El tiempo también constituye la vida cotidiana, ya que en todo momento de la existencia de los y las adolescentes están inmersos los hechos pasados y los mantienen como referencia . De lo anterior, la importancia del papel fundamental que representa la familia y los valores que se le haya internalizado en su niñez. Aquí entran las &quot;conmutaciones&quot; 14</p></div><div class='page-block'><span class='page-marker'>📄 Página 23 del PDF original (Tesis UACM):</span><p>producidas entre el mundo de la vida cotidiana y el mundo de los juegos de los jóvenes. De repente se transportan a otra dimensión, crean un mundo propio con actores y ambientes de ficción donde todo es como lo desean, son sumamente fantasiosos; pero todas estas experiencias son momentáneas. Lo que da paso a diversas situaciones que sobre la marcha van definiendo.</p><p>Las relaciones con el mundo en general, cambian de signo y así, los y las adolescentes empieza n a preguntarse sobre la autoridad de los adultos en general , de los padres y profesores en particular, desarrollan una gran sensibilidad con respecto de lo justo y lo injusto, su mirada se vuelve crítica con cuanto le rodea , en las que cob ra especial importancia la opinión de los amigos, la aceptación del liderazgo, y el soporte del grupo, que se eleva por encima de cua lquier otra relación. Se desarrolla en suma , el concepto de sí mismo , es decir el conocimiento que tiene el joven de los valores, hechos o experiencias referidas al propio yo (Cutillas, 2002).</p><p>En la adolescencia comienza un periodo de búsqueda de identidad, de contradicciones, de confusión y/o ambivalencia un periodo doloroso caracterizado por fricciones familiares y sociales. Ello, aunado la desidealización de las figuras parentales, hunde al adolescente al profundo desamparo, ya que las vinculaciones afectivas con los padres permanecen vigentes sólo hasta la adolescencia , en donde, de acuerdo con Peter Blos (1975), se presenta un segundo periodo de individualización en el que hay un nuevo desarrollo del concepto de sí mismo. Lo anterior lo vemos en nuestro contexto, a los y las adolescentes se les asigna o etiqueta con un rol o personalidad de rebeldes, inmaduros e irresponsables y tanto es la repetición de este mensaje que en el 15</p></div><div class='page-block'><span class='page-marker'>📄 Página 24 del PDF original (Tesis UACM):</span><p>adolescente realmente se lo cree y adopta dicho papel, pero más que nada lo hace también en son de rebeldía , implícitamente grita que es todo lo contrario y desea atención .</p><p>En</p><p>la</p><p>socialización</p><p>secundaria</p><p>de</p><p>acuerdo</p><p>a</p><p>Berger</p><p>y</p><p>Luckman,</p><p>(www .scribd.com/berger-luckman, consultada 04 mayo 2011) es la introducción a otros</p><p>ámbitos nuevos del mundo objetivo de su sociedad, llámese institución escolar, social, de salud, etcétera , por lo que los y las adolescentes previamente ya han internalizado su mundo en la sociedad primaria , y aunque ahora se enfrenta a otra experiencia que de igual forma internalizará pero siempre de acuerdo con sus valores ya existentes. Es cuando los adolescentes se topan con obstáculos, pues se enfrentan a muchos cambios y condiciones desconocidas para ellas y ellos.</p><p>En la socialización secundaria los y las adolescentes experimentan la externalización , y no es más que transmitir lo ya internalizado, demuestra todas sus ideas, pensamientos, acciones, creencias, costumbres, etcétera . Luego , para demostrarse tal cual ante la familia y sociedad , muchas veces son criti cados y juzgados, ya que sus pensamientos e ideales no concuerdan con lo estab lecido socialmente.</p><p>Ante todos los cambios por los que pasan los y las adolescentes, un ámbito sumamente controvertido , son los riesgos sociales y de salud que enfrentan estos jóvenes en su sexua lidad y salud reproductiva , por lo que la opinión de Weeks (1983) es ilustrativa :</p><p>16</p></div><div class='page-block'><span class='page-marker'>📄 Página 25 del PDF original (Tesis UACM):</span><p>&quot;la sexualidad no es una olla de vapor que debemos tapar porque nos puede destruir; tampoco es una fuerza vital que debemos liberar para salvar a nuestras civilizaciones. Más bien debemos cobrar conciencia de que la sexualidad es un resultado de distintas prácticas sociales que dan significado a las actividades humanas, de definiciones sociales y autodefiniciones, de luchas entre quienes tienen el poder para definir y reglamentar contra quienes se resisten. La sexualidad no es un hecho dado, es un producto de negociación, lucha y acción humanas&quot;.</p><p>1. 3. 3. Psicología</p><p>De acuerdo con Dávila (2005), conceptualmente la adolescencia se constituye como campo de estudio dentro de la psicología evolutiva , de manera reciente, pudiendo asignarse incipientemente sólo a finales del siglo XIX y con mayor fuerza a principios del siglo XX , bajo la influencia del psicólogo norteamericano Stan ley Hall ( 1904) la adolescencia es una etapa especialmente dramática y tormentosa en la que se producen innumerables tensiones, con inestabilidad, entusiasmo y pasión , en la que los</p><p>y las adolecentes se encuentran divididos entre tendencias opuestas. Además, la adolescencia supone un corte profundo con la infancia , es como un nuevo nacimiento (tomando esta idea de Rousseau ) en la que el joven adquiere los caracteres humanos más elevados (Delval, 1998).</p><p>Los comportamientos que reflejan los y las adolescentes en el ámbito escolar, van desde problemas de aprendizaje y los trastornos nutricionales (anorexia , obesidad, bulimia) aparentemente simples, hasta otros problemas tales como los emocionales. Se 17</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Sexualidad como Disputa de Poder (Jeffrey Weeks)</h3>\n<blockquote class=\"quote\">«La opinión de Weeks (1983) es ilustrativa: 'La sexualidad no es una olla de vapor que debemos tapar porque nos puede destruir; tampoco es una fuerza vital que debemos liberar para salvar a nuestras civilizaciones. Más bien debemos cobrar conciencia de que la sexualidad es un resultado de distintas prácticas sociales que dan significado a las actividades humanas, de definiciones sociales y autodefiniciones, de luchas entre quienes tienen el poder para definir y reglamentar contra quienes se resisten. La sexualidad no es un hecho dado, es un producto de negociación, lucha y acción humanas'» (p. 16).</blockquote>\n\n<h3>2. Berger y Luckmann</h3>\n<p>Distingue entre la <strong>socialización primaria</strong> (represión y silencio familiar) y la <strong>socialización secundaria</strong> (el choque del adolescente con la escuela y la institución médica).</p>\n</div>", "links": ["CONSTRUCCION_SOCIAL", "GENERO_PODER", "PSICOLOGIA_EVOLUTIVA"]}, {"id": "PSICOLOGIA_EVOLUTIVA", "title": "Psicología Evolutiva: Duelos y Construcción del Yo", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 23-27", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 23 del PDF original (Tesis UACM):</span><p>producidas entre el mundo de la vida cotidiana y el mundo de los juegos de los jóvenes. De repente se transportan a otra dimensión, crean un mundo propio con actores y ambientes de ficción donde todo es como lo desean, son sumamente fantasiosos; pero todas estas experiencias son momentáneas. Lo que da paso a diversas situaciones que sobre la marcha van definiendo.</p><p>Las relaciones con el mundo en general, cambian de signo y así, los y las adolescentes empieza n a preguntarse sobre la autoridad de los adultos en general , de los padres y profesores en particular, desarrollan una gran sensibilidad con respecto de lo justo y lo injusto, su mirada se vuelve crítica con cuanto le rodea , en las que cob ra es
