ot; con el discurso de: &quot;mujercita tú qué sabes, estás segura&quot;, &quot;chamaco y en la escuela cómo vas&quot; o &quot;estás muy joven para esto&quot;, una vez que sienten haberles dado una lección de educación y reflexión sobre la sexualidad y la postura de temor que deberían tener viene la explicación &quot;médica&quot; tratan de aclararle dudas y proporcionar algún método anticonceptivo si éste es solicitado por él o la adolescente, o bien en el mejor de los casos , el médico o médica le sugiere alguno ya que co mo se mencionó anteriormente algunas veces es el personal de salud quien decide por el método.</p><p>Lo anterior también se debe a la educación familiar y de la postura religiosa de los trabajadores de salud que ya introyectado le es difícil reservarlo durante la consulta, y de manera automática aflora en el proceso de atención que muchas veces se ve a la sexualidad como algo pecaminoso por lo tanto prohibido, &quot;acto&quot; que debe reservarse hasta el &quot;matrimonio&quot; y a una &quot;edad razonable&quot;, debido a esto los y las adolescentes se</p><p>207</p></div><div class='page-block'><span class='page-marker'>📄 Página 216 del PDF original (Tesis UACM):</span><p>siente incómodos, juzgados y limitados en sus capacidades como son la sapiens (pensar), la erótica (sentir) y la política (decidir).</p><p>La visión y prácticas del Programa de Atención a la Salud de los Adolescentes deben ser replanteadas en el sentido de su contenido, las prácticas de promoción y educación para la salud . Analizar el planteamiento teórico y metodológico de la promoción de la salud haciendo una conjunción con la institucional y abordar el lado social , cultural , humano, ético, aún cuando se sabe que ello planteamiento se convierte en un peligro para las agencias de poder al cuestionar su hacer y dominio; este dominio es posible ya que las prácticas médicas envuelven de forma directa al cuerpo físico y a la subjetividad de las personas que exponen su cuerpo como territorio a la acción médica , y no permite el ejercicio de capacidades .</p><p>La posibilidad de crear espacios pedagógicos en los campos institucio nales o no en los cua les los</p><p>y las ado lescentes</p><p>pueda n compartir</p><p>experiencias, significados</p><p>y</p><p>conoci mientos individuales y colectivos , implementando estrategias y prácticas innovadoras para inmiscuir a los y las adolescentes a todas las actividades y propuestas para satisfacer sus necesidades para que sean ellos quienes descubran y ejerza n sus derechos sexua les y reproductivos asumiéndose como sujeto de derecho, es decir, dueño de su cue rpo , adquiriendo un significado para su sexualidad y su proyecto de vida en general, de tal manera que los resultados se reflejen cua litativamente y no sólo cuantitativamente que es lo que interesa a la institución.</p><p>208</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Propuesta Transformadora de Ramírez Ibarra (Conclusiones)</h3>\n<blockquote class=\"quote\">«Considero que mediante prácticas de promoción de la salud emancipatoria se pueden revertir los problemas planteados inicialmente al permitir a los sujetos su autoconstrucción y la defensa de sus derechos en la atención de la salud... La realización de esta investigación permite visibilizar el sentir de un grupo de población conceptualizada como 'adolescentes' (el otro)» (p. 6, 202).</blockquote>\n\n<h3>2. Los Cuatro Ejes de Acción Inmediata</h3>\n<ul>\n  <li><strong>1. Talleres Dialógicos Horizontales:</strong> Sustituir la folletería y la charla magistral por talleres de reflexión entre pares.</li>\n  <li><strong>2. Erradicación de la Exigencia de Tutor:</strong> Cumplimiento irrestricto de la NOM-005 para atender a cualquier joven que acuda solo.</li>\n  <li><strong>3. Servicios Amigables con Horarios Vespertinos:</strong> Consultorios exclusivos y confidenciales para estudiantes de Iztapalapa.</li>\n  <li><strong>4. Sensibilización Bioética del Personal de Salud         const groupAngles = {

        });

        const nodeMap = {};

            const baseAngle = groupAngles[n.group] !== undefined ? groupAngles[n.group] : 0;
            const count = groupCounts[n.group] || 1;
            const idxInGroup = groupCurIdx[n.group]++;
            const spread = (idxInGroup - (count - 1) / 2) * 0.28;
            const angle = baseAngle + spread;
            const dist = 180 + (idxInGroup % 2) * 45;

            n.x = width / 2 + Math.cos(angle) * dist;
            n.y = height / 2 + Math.sin(angle) * dist;

        // Physics Simulation Step with Alpha parameter & Energy Damping
        function simulateStep(alpha = 1.0) {
            const count = rawNodes.length;

            // 1. Soft Repulsion between nodes
            for (let i = 0; i < count; i++) {
                const a = rawNodes[i];
                for (let j = i + 1; j < count; j++) {
                    const b = rawNodes[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    if (dist < 230) {
                        const force = ((230 - dist) / 230) * 0.38 * alpha;
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;
                        if (a !== draggedNode) { a.vx -= fx; a.vy -= fy; }
                        if (b !== draggedNode) { b.vx += fx; b.vy += fy; }
                    }
                }
            }

            // 2. Gentle Spring attraction for links
            for (let i = 0; i < links.length; i++) {
                const l = links[i];
                const dx = l.target.x - l.source.x;
                const dy = l.target.y - l.source.y;
                const dist = Math.hypot(dx, dy) || 1;
                const force = (dist - 125) * 0.0035 * alpha;
                const fx = (dx / dist) * force;
                const fy = (dy / dist) * force;
                if (l.source !== draggedNode) { l.source.vx += fx; l.source.vy += fy; }
                if (l.target !== draggedNode) { l.target.vx -= fx; l.target.vy -= fy; }
            }

            // 3. Center gravity, speed clamping, and high friction damping
            for (let i = 0; i < count; i++) {
                const n = rawNodes[i];
                if (n !== draggedNode) {
                    n.vx += (width / 2 - n.x) * 0.0004 * alpha;
                    n.vy += (height / 2 - n.y) * 0.0004 * alpha;

                    // Clamping prevents sudden jerks/explosions
                    const speed = Math.hypot(n.vx, n.vy);
                    const maxSpeed = 2.4 * Math.max(0.3, alpha);
                    if (speed > maxSpeed && speed > 0) {
                        n.vx = (n.vx / speed) * maxSpeed;
                        n.vy = (n.vy / speed) * maxSpeed;
                    }

                    n.x += n.vx;

        // Headless pre-warm relaxation: The graph loads already settled!

                const dx = n.x - x;
                const dy = n.y - y;
                if (Math.sqrt(dx*dx + dy*dy) <= n.radius + 10) return n;
            }
            return null;
        }

        // Mouse Handlers
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        let mouseStartX = 0, mouseStartY = 0;
        let nodeDragMoved = false;

        canvas.addEventListener("mousedown", e => {
            const pos = getPos(e);
            const n = findNodeAt(pos.x, pos.y);
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
            nodeDragMoved = false;
            if (n) {
                draggedNode = n;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
            } else {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener("mousemove", e => {
            if (draggedNode) {
                if (!nodeDragMoved && Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY) > 5) {
                    nodeDragMoved = true;
                }
                const pos = getPos(e);
                draggedNode.x = pos.x;
                draggedNode.y = pos.y;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                simAlpha = Math.max(simAlpha, 0.22);
            } else if (isDragging) {
                panX += (e.clientX - lastMouseX);
                panY += (e.clientY - lastMouseY);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener("mouseup", () => {
            if (draggedNode) {
                if (!nodeDragMoved) {
                    selectNode(draggedNode);
                }
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                draggedNode = null;
            }
            isDragging = false;
        });

        // Touch Handlers
        let touchStartX = 0, touchStartY = 0;
        let touchNodeMoved = false;

        canvas.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                const pos = getPos(e);
                const n = findNodeAt(pos.x, pos.y);
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchNodeMoved = false;
                if (n) {
                    draggedNode = n;
                    draggedNode.vx = 0;
                    draggedNode.vy = 0;
                } else {
                    isTouching = true;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                }
            } else if (e.touches.length === 2) {
                if (draggedNode) {
                    draggedNode.vx = 0;
                    draggedNode.vy = 0;
                    draggedNode = null;
                }
                isTouching = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                startDist = Math.hypot(dx, dy);
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            if (draggedNode && e.touches.length === 1) {
                if (!touchNodeMoved && Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY) > 6) {
                    touchNodeMoved = true;
                }
                const pos = getPos(e);
                draggedNode.x = pos.x;
                draggedNode.y = pos.y;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                simAlpha = Math.max(simAlpha, 0.22);
            } else if (isTouching && e.touches.length === 1) {
                panX += (e.touches[0].clientX - lastTouchX);
                panY += (e.touches[0].clientY - lastTouchY);
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const factor = dist / startDist;
                zoom = Math.min(Math.max(0.3, zoom * factor), 2.5);
                startDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener("touchend", () => {
            if (draggedNode) {
                if (!touchNodeMoved) {
                    selectNode(draggedNode);
                }
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                draggedNode = null;
            }
            isTouching = false;
        });

        function zoomIn() { zoom = Math.min(2.5, zoom * 1.25); }
        function zoomOut() { zoom = Math.max(0.3, zoom * 0.8); }
        function resetView() { zoom = 1.0; panX = 0; panY = 0; }

        function filterCategory(cat, el) {
            activeFilter = cat;
            document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
            el.classList.add("active");
        }

        function toggleGlobalLinks() {
            showAllGlobalLinks = !showAllGlobalLinks;
            const btn = document.getElementById("btnToggleLinks");
            const txt = document.getElementById("linkText");
            if (showAllGlobalLinks) {
                btn.classList.remove("active");
                txt.innerText = "Ocultar Todas las Líneas";
            } else {
                btn.classList.add("active");
                txt.innerText = "Mostrar Todas las Líneas";
            }
        }

        // GLOBAL MODE (APLICA A TODO EL SISTEMA)
        function setGlobalMode(mode) {
            currentMode = mode;
            document.getElementById("btnGlobalTranscrito").classList.toggle("active", mode === 'transcrito');
            document.getElementById("btnGlobalResumen").classList.toggle("active", mode === 'resumen');
            if (selectedNode) {
                renderNodeContent();
            }
        }

        // LOCAL MODE (APLICA AL NODO ACTUAL)
        function setNodeMode(mode) {
            currentMode = mode;
            renderNodeContent();
        }

        function renderNodeContent() {
            if (!selectedNode) return;
            const isTranscrito = (currentMode === 'transcrito');
            
            const btnT = document.getElementById("tabTranscrito");
            const btnR = document.getElementById("tabResumen");
            
            if (isTranscrito) {
                btnT.style.background = "#f59e0b";
                btnT.style.color = "#000";
                btnT.style.boxShadow = "0 4px 12px rgba(245, 158, 11, 0.5)";
                
                btnR.style.background = "#1e293b";
                btnR.style.color = "#94a3b8";
                btnR.style.boxShadow = "none";
                
                document.getElementById("drawerBody").innerHTML = selectedNode.transcrito_html;
            } else {
                btnR.style.background = "#38bdf8";
                btnR.style.color = "#000";
                btnR.style.boxShadow = "0 4px 12px rgba(56, 189, 248, 0.5)";
                
                btnT.style.background = "#1e293b";
                btnT.style.color = "#94a3b8";
                btnT.style.boxShadow = "none";
                
                document.getElementById("drawerBody").innerHTML = selectedNode.resumen_html;
            }
        }

        // Selection & Dense Reading Drawer
        function selectNode(n) {
            selectedNode = n;
            showRelatedOnCanvas = false;

            const drawer = document.getElementById("detailDrawer");
            const badge = document.getElementById("drawerBadge");
            badge.innerText = n.badge || n.group.toUpperCase();
            badge.style.background = n.color;
            badge.style.color = "#fff";

            document.getElementById("drawerTitle").innerText = n.title;
            document.getElementById("drawerPages").innerText = `Extracción del libro: ${n.pages}`;

            renderNodeContent();

            // Prepare related nodes panel (HIDDEN BY DEFAULT)
            const panel = document.getElementById("relatedNodesPanel");
            panel.classList.remove("visible");
            panel.innerHTML = "";

            const connectedNodes = [];
            links.forEach(l => {
                if (l.source === n) connectedNodes.push(l.target);
                else if (l.target === n) connectedNodes.push(l.source);
            });

            document.getElementById("relatedBtnText").innerText = `🔗 Ver Nodos Relacionados (${connectedNodes.length})`;
            document.getElementById("relatedArrow").innerText = "▼";

            connectedNodes.forEach(target => {
                const chip = document.createElement("div");
                chip.className = "rel-node-chip";
                chip.innerHTML = `<span class="rel-node-dot" style="background:${target.color}"></span> ${target.title}`;
                chip.onclick = () => {
                    selectNode(target);
                    panToNode(target);
                };
                panel.appendChild(chip);
            });

            drawer.classList.add("open");
        }

        function toggleRelatedPanel() {
            const panel = document.getElementById("relatedNodesPanel");
            const isVisible = panel.classList.contains("visible");
            if (isVisible) {
                panel.classList.remove("visible");
                document.getElementById("relatedArrow").innerText = "▼";
                showRelatedOnCanvas = false;
            } else {
                panel.classList.add("visible");
                document.getElementById("relatedArrow").innerText = "▲";
                showRelatedOnCanvas = true;
            }
        }

        function closeDrawer() {
            document.getElementById("detailDrawer").classList.remove("open");
            selectedNode = null;
            showRelatedOnCanvas = false;
        }

        function panToNode(n) {
            panX = width/2 - n.x * zoom;
            panY = height/2 - n.y * zoom;
        }

        function changeFontSize(delta) {
            fontSizeBase = Math.min(22, Math.max(12, fontSizeBase + delta));
            document.documentElement.style.setProperty('--font-size-base', fontSizeBase + 'px');
        }

        // Live Search
        document.getElementById("searchInput").addEventListener("input", e => {
            const q = e.target.value.toLowerCase().trim();
            if (!q) return;
            const match = rawNodes.find(n => n.title.toLowerCase().includes(q) || n.transcrito_html.toLowerCase().includes(q) || n.resumen_html.toLowerCase().includes(q));
            if (match) {
                selectNode(match);
                panToNode(match);
            }
        });
    </script>
</body>
</html>
