<li><strong>Ética del Cuidado Compartido:</strong> El uso del condón concebido no como una obligación impuesta, sino como un pacto de cuidado recíproco.</li>\n</ul>\n\n<h3>3. La Violación de la Condición de Sujeto en Consulta</h3>\n<p>En el C.S. Maximiliano Ruíz, el <strong>58% de las adolescentes encuestadas reveló que fue el médico quien decidió e impuso su método anticonceptivo</strong>, despojándolas de su derecho al consentimiento informado.</p>\n</div>", "links": ["SALUD_CHAPELA", "PS_EMANCIPATORIA", "PROYECTO_VIDA", "DERECHOS_SEXUALES"]}, {"id": "PROYECTO_VIDA", "title": "Proyecto de Vida y Soberanía Corporal", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 7-10", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 7 del PDF original (Tesis UACM):</span><p>Agradecimientos</p><p>A mi madre, a Eduardo mi hijo y a Enrique por todo el apoyo,comprensión, amor que me dan siempre y por cultivar e inculcar el don de lucha y superación para la realización de mi tesis y para la vida misma, brindándome su tiempo, dedicación , consejos y acompañamiento e interés por lograr este paso importante en mi vida. ¡Los quiero mucho!</p><p>No olvidaré al grupo de adolescentes que decidió participar en el taller, a las y los entrevistados que me dejaron una huella valiosa al compartir sus experiencias de vida y su significado las cuales ya forman parte de mi vida profesional</p><p>y personal</p><p>como</p><p>un</p><p>aprendizaje</p><p>significativo.</p><p>Asimismo,</p><p>agradezco el valioso apoyo del Director Jurisdiccional de lztapalapa Dr. Francisco Javier Serna Alvarado, al Dr. Enrique Omaña Mendoza del Área de Enseñanza por su escucha y asesoramiento y al personal del Centro de Salud participante en mí trabajo de campo.</p><p>Para la realización de este trabajo de investigación fueron muchas las personas que participaron y a las cuales les expreso mi ag radecimiento, principalmente a la profesora Natividad Almanza Beltrán, mi directora de tesis, que durante las asesorías aportó sus conocimientos y sugerencias ; a mis lectores, los profesores César E. Fuentes Hernández, Juan Manuel Mendoza Rodríguez, Alma Nora Nava Martínez y Javier Gutiérrez Marmolejo, que gracias a sus observaciones y consejos que me transmitieron en la elaboración de esta tesis se llegó a su culminación .</p></div><div class='page-block'><span class='page-marker'>📄 Página 8 del PDF original (Tesis UACM):</span><p>También agradezco a todos mis profesores que me transmitieron sus conocimientos a través de la licenciatura así como a la Universidad Autónoma de la Ciudad de México, Plantel Casa Libertad, por acogerme en su recinto durante la carrera y por el apoyo económico brindado para la impresión de la presente tesis.</p><p>Verano del 2011 .</p></div><div class='page-block'><span class='page-marker'>📄 Página 9 del PDF original (Tesis UACM):</span><p>INTRODUCCIÓN</p><p>La presente investigación se centra en el análisis de las prácticas de promoción de la salud institucional en materia de educación sexual dirigida a los y las adolescentes. El objeto de estudio parte de un interés especial por la etapa de la adolescencia, por ser esencialmente una época de cambios, en la cual se define la personalidad , se construye la independencia y se fortalece la autoafirmación; sin embargo como una etapa en construcción también se inscriben significados que pueden influir de una u otra forma en su salud.</p><p>En el mundo existen alrededor de 1000 millones de adolescentes entre los 10 y 19 años (Vinculando, 20 10); el 85 por ciento de los jóvenes viven en los países con una economía dependiente, esta proporción elevada de adolescentes se puede explicar por dos fenómenos : una disminu ción progresiva de la mortalidad de los menores de ci nco años y una menor tasa de fecundidad.</p><p>Este período se caracteriza por el alto riesgo a que están expuestos los y las adolescentes de asumir conductas que pueden afectar su estado de salud , lo cua l se verá reflejado en sus expectativas de vida a corto o a largo plazo.</p><p>Algunos problemas de enfermedad de los y las adolescentes son: infecciones de transmisión sexual, virus</p><p>de inmunodeficiencia humana (VIH) y Síndrome de</p><p>lnmunodeficiencia Adquirida (SI DA) los cuales tienen una alta incidencia. De acuerdo con las estadísticas del Centro Nacional para la Prevención y el Control del VIH/S IDA 1</p></div><div class='page-block'><span class='page-marker'>📄 Página 10 del PDF original (Tesis UACM):</span><p>(CENSIDA, 2010) hay alrededor de 10 mil nuevas infecciones de VIH en México, aproximadamente 1 caso cada hora. Existen cerca de 225 mil personas VIH, en el caso de los embarazos a temprana edad se estiman 450 mil nacimientos anuales en mujeres menores de 20 años y con respecto a las muertes maternas los casos son de 250 mil al año; éstos se han convertido en serios problemas de salud pública , y el Estado no ha generado estrategias ni ha puesto en marcha acciones que lleven a resolver el problema .</p><p>La Educación Sexual, según Cerruti (1992) debiera comenzar lo antes posible, no en el momento del nacimiento sino en el momento de la concepción del nuevo ser, y continuar, en forma progresiva durante toda la vida . Proceso vital mediante el cual se adquieren y transforman , informal y formalmente , conocimientos , actitudes y valores respecto de la sexualidad en todas sus manifestaciones, que incluyen desde los asociados al erotismo, la identidad y las representaciones sociales de los mismos .</p><p>Si la educación sexual en las instituciones es prescriptiva y prohibitiva y no ha logrado atender y resolver los problemas de salud en los y las adolescentes, entonces es imprescindible abordarla desde la promoción de la salud heterodoxatica que considera a los seres humanos como sujetos éticos capaces de construir conocimiento independientemente de los expertos o de las instituciones y, con base en ese conocimiento, dar significado, valor y sentido a su mundo y práctica (Chapela , 2007).</p><p>La educación sexual consciente , reflexiva, formal e integral es fundamental para cada sujeto de cualquier edad y género vista desde la promoción de la salud que tiene una 2</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Salud como Condición y no como Fin</h3>\n<p>La autora recupera la sociología francesa para articular la prevención con el horizonte de futuro:</p>\n<blockquote class=\"quote\">«Para los y las adolescentes preservar su salud es una condición y no una finalidad de la existencia. Insistiendo en ese punto, Hugues Lagrange escribe: 'sostenemos para los jóvenes una noción de riesgos que mezclan placeres y peligros, asociándolos no a las prácticas tomadas de manera aislada, sino a comportamientos, a conjuntos de actos no aislados'» (p. 29).</blockquote>\n\n<h3>2. El Impacto Devastador de las ITS y el Embarazo No Planeado</h3>\n<ul>\n  <li><strong>366,000 embarazos no deseados anuales en México:</strong> Conducen a la deserción escolar masiva y a la reproducción de la pobreza en Iztapalapa.</li>\n  <li><strong>VPH y Lesiones Precancerígenas:</strong> Amenaza a largo plazo que trunca la vida productiva de las mujeres jóvenes si no hay citología oportuna.</li>\n</ul>\n<blockquote class=\"quote\">«La educación sexual integral impulsa las capacidades humanas en los y las adolescentes y permite una construcción de proyecto desde su propia experiencia» (p. 3).</blockquote>\n</div>", "links": ["SALUD_CHAPELA", "SUJETO_ETICO", "ITS_EPIDEMIOLOGIA", "DERECHOS_SEXUALES"]}, {"id": "ITS_EPIDEMIOLOGIA", "title": "Epidemiología de las ITS en México", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 32-36", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 32 del PDF original (Tesis UACM):</span><p>son los accidentes y las lesiones intencionales, las cuales acumulan poco más de dos terceras partes del total de defunciones en los hombres jóvenes (64.7% ); mientras que entre las mujeres estas causas concentran a un tercio de la muertes (32.9%), seguidas de los tumores malignos ( 10.9 %) y las asociadas con complicaciones de la maternidad (8.5%) (Conapo, 2006).</p><p>Los comportamientos y prácticas sexuales de los y las adolescentes se encuentran relacionados con sus niveles de salud, considerando que gran parte de dichas prácticas son de riesgo. De acuerdo con los resultados preliminares del análisis sobre la conducta sexual en estudiantes de secundaria y bachillerato técnico del Distrito Federal (2008), los varones tienen en promedio su primera relación sexual a los 14.5 años y las mujeres a los 15.5 años; y en algunos casos tal inicio sexual ocurre regularmente sin el uso de algún método de prevención del embarazo, del Virus del Papiloma Humano (VPH ) y del Virus de lnmunodeficiencia Humana (VIH) y otras Enfermedades de Transmisión Sexual (ETS).</p><p>De</p><p>acuerdo</p><p>con</p><p>estudios</p><p>realizados</p><p>desde</p><p>una</p><p>perspectiva</p><p>psicologista,</p><p>el</p><p>comportamiento de los y las adolescentes son prácticas sexuales y relaciones de riesgo repetitivas sin protección , por lo tanto son síntoma de problemas emocionales. Reflejan un estilo de vida al límite; los adolescentes que asumen estos riegos tienden a asumirlos en otras facetas de la vida (Martínez, 2008). El riesgo queda de manifiesto en las tasas desproporcionadamente elevadas en las ITS y los embarazos no deseados. No obstante, que se debe ser cu id adoso en esta postura ya que los problemas de enfermedad no se determinan a partir de problemas emocionales de los sujetos, 24</p></div><div class='page-block'><span class='page-marker'>📄 Página 33 del PDF original (Tesis UACM):</span><p>involucran aspectos sociales y culturales los cuales explican las prácticas sexuales de los y las adolescentes .</p><p>Cabe aclarar que en el presente trabajo se muestran los principales problemas de enfermedad que enfrentan los y las adolescentes de acuerdo con el enfoque del tema : educación sexual, esto no significa que el resto de las problemáticas y causas de muerte del adolescente no sean importantes.</p><p>Infecciones de transmisión sexual</p><p>Las Infecciones de Transmisión Sexual (ITS) son aquellas afecciones que se adquieren fundamentalmente a través del contacto sexual, an tes llamadas enfermedades venéreas , haciendo alusión a Venu s, la diosa del amor.</p><p>Numerosos microorganismos pueden transmitirse durante las relaciones sexua les sin la utilización del preservativo masculino y femenino, éstos pueden ser: bacterias, hongos, virus y parásitos. Tradi cionalmente, las enfermedades de transmi sión sexual (ITS) se ca racterizaban por la aparición de una lesión en la zona de los órganos sexuales después de una relación sexual.</p><p>En muchos países del mundo las Infecciones de Tran smisión Sexual (ITS) amenazan con desaparecer a millones de personas en un corto período de tiempo de no tomarse las medidas necesarias por las entidades encargadas. En las dos últimas décadas se observa un aumento del número de personas con la enfermedad, tanto en los países 25</p></div><div class='page-block'><span class='page-marker'>📄 Página 34 del PDF original (Tesis UACM):</span><p>industrializados como en vías de desarrollo, estimándose que a nivel mundial aproximadamente 685 mil personas se contagian con una de estas enfermedades cada día y que cada año ocurren alrededor de 250 millones de casos nuevos de estas enfermedades (Vinculando, 201 O).</p><p>Actualmente se acepta la existencia de una estrecha relación entre las distintas Infecciones de Transmisión Sexual y el</p><p>Síndrome de lnmunodeficiencia Adquirida</p><p>(SIDA), el SIDA es una enfermedad infecciosa causada por un virus denominado Virus de la lnmunodeficiencia Humana (VIH) éste tiene la particularidad de atacar a los linfocitos que son directores de nuestro sistema de defensa . Inicialmente el permanece en estado latente, es decir, &quot;dormido&quot; dentro de linfocitos. En algunos casos , al cabo de un tiempo , a menudo años por causas no bien determinadas, el virus se activa , es decir, &quot;despierta&quot; y comienza a destruir los linfocitos, de esta forma el virus debilita progresivamente el sistema inmune. Cuanto más conocimientos se tenga sobre estas infecciones y cuanto más oportuno y eficaz sea su control, mayor será la posibilidad de cortar la cadena de transmisión , en estos momentos existen 30 tipos de ITS, de las que 26 atacan principalmente a las mujeres y 4 a ambos sexos (Vinculando , 2010).</p><p>La utilización de anticonceptivos y la prevención de las infecciones de transmisión sexual {ITS) varían de acuerdo con la información disponible, según la edad de la iniciación sexual. Es más probable la utilización de preservativos y anticonceptivos en los y las adolescentes cuanto más tardía es la iniciación sexual. Se ha constatado que la educación sobre esas cuestiones modifica los comportamientos sexuales y parece</p><p>26</p></div><div class='page-block'><span class='page-marker'>📄 Página 35 del PDF original (Tesis UACM):</span><p>ser más eficaz si se imparte antes de la primera relación sexual, es decir, en la adolescencia o preadolescencia (&quot; La educación sexual en México&quot;, 2008).</p><p>VIH/SIDA</p><p>El Virus de lnmunodeficiencia Humana (VIH) es el causante del SIDA, y consti tuye la más reciente enfermedad de transmisión sexual y se ha transformado en un grave problema de enfermedad a nivel mundial, dada la rapidez de su propagación y la fatal evolutividad del cuadro clínico , para el que no existe cura en el momento actual. En el mundo, casi la cuarta parte de las personas con virus tienen menos de 25 años y más de 7 mil jóvenes entre 10 y 24 años se contagian diariamente de VIH (&quot;La educación sexual en México&quot;, 2008).</p><p>El mecanismo de transmisión más frecuente es el contacto sexual con personas enfermas por el virus y en grado menor, el uso compartido de agujas y jeringas de inyección, así como las transfusiones de sang re o sus productos contaminados por el virus. La transmisión del VIH de la madre contagiada al feto y neonato, se realiza en el 50% de los casos (PASA, 2001 ).</p><p>Es importante diferenciar los conceptos de persona infectada por VIH y enfermo de SIDA. De las personas que han sido infectadas con VIH , aproximadamente el 30% desarrolla la enfermedad, el SIDA, en un plazo variable de algunos años, presentando el cortejo si ntomático y la evolutividad característica. Los restantes son portadores</p><p>27</p></div><div class='page-block'><span class='page-marker'>📄 Página 36 del PDF original (Tesis UACM):</span><p>asintomáticos del germen, intervienen en la cadena epidemiológica y pueden ser detectados a través de las pruebas serológicas (Cerruti, 1992).</p><p>En México , la epidemia del SIDA es principalmente por transmisión sexual, toda vez que este tipo de transmisión ha sido la causante de casi 90% de los casos. La epidemia se encuentra fundam entalmente en el grupo de Hombres que tiene sexo con Hombres (HSH) -clasificación que ha impuesto la Secretaría de Salud para hacer referencia a las prácticas homoeróticas-, con poco más de 50% del total de casos acumulados; pero con una tendencia ascendente, en los últimos años, en los casos de tipo heterosexual (PASA, 2001 ).</p><p>La Organización Mundial de la Salud (OMS, 2006) estimó que en México ocurren anualmente siete millones de casos nuevos de Infecciones de Transmisión Sexual (ITS) curables: tricomonas (3.39 millones de infecciones), clamidia (92 millones), gonorrea (1.36 millones) y sífilis (0.24 millones).</p><p>La tasa de cambio de pareja sexual es más elevada durante la adolescencia y comienzos de la veintena . Esto no sólo es cie rto en el caso de parejas casuales , sino también tratándose de relaciones que se consideran regulares y monógamas. Aunque sucesivos emparejamientos monógamos pueden ser de corta duración , su carácter &quot;estable&quot;, desde el punto de vista de muchos y muchas adolescentes que viven esas relaciones, aleja subjetivamente el peligro de contraer ETS. Esto hace que tengan relaciones sexuales sin protección con parejas múltiples, lo que significa que el riesgo</p><p>28</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Magnitud Epidemiológica Alarmante (Capítulo 1.4)</h3>\n<blockquote class=\"quote\">«En muchos países del mundo las Infecciones de Transmisión Sexual (ITS) amenazan la salud y la vida... aproximadamente 685 mil personas se contagian con una de estas enfermedades cada día en el planeta. En México se presentan anualmente SIETE MILLONES de casos nuevos de Infecciones de Transmisión Sexual (ITS), impactando con gran fuerza en la juventud» (p. 25, 27).</blockquote>\n\n<h3>2. Factores de la Crisis en Jóvenes Mexicanos</h3>\n<ul>\n  <li><strong>Edad Temprana de Inicio Sexual:</strong> 14.5 años en varones y 15.5 años en mujeres en el Distrito Federal (2008), habitualmente sin preservativo.</li>\n  <li><strong>Más de 30 Patógenos:</strong> Virus (VIH, VPH, Herpes 2), bacterias (Treponema pallidum, Neisseria gonorrhoeae, Chlamydia), hongos y protozoarios.</li>\n  <li><strong>La Trampa de la 'Monogamia Aparente':</strong> La creencia errónea de que un noviazgo formal protege de infecciones previas asintomáticas.</li>\n</ul>\n\n<h3>3. El Aborto y la Maternidad en Cifras</h3>\n<blockquote class=\"quote\">«En México se estiman 20 millones de partos al año, de los cuales alrededor de 500 mil corresponden a mujeres de entre 15 y 19 años... Los abortos se presentan 14 veces más en embarazadas adolescentes que en mayores de 20 años» (p. 30).</blockquote>\n</div>", "links": ["ITS_VPH", "ITS_VIH", "ITS_BACTERIANAS", "VULNERABILIDAD_BIO", "CONDON_MITOS"]}, {"id": "ITS_VPH", "title": "Virus del Papiloma Humano (VPH) y Cáncer", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 32-34", "transcrito_html": "<div class='pa or inicial.</li>\n  <li><strong>Desconocimiento Generalizado:</strong> Los cuestionarios demostraron que los adolescentes ubican el SIDA, pero desconocen por completo qué es el VPH y el Papanicolaou.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "VULNERABILIDAD_BIO", "AISLAMIENTO_ATENCION"]}, {"id": "ITS_VIH", "title": "VIH y SIDA: Epidemia y Estigma", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 33-36", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 33 del PDF original (Tesis UACM):</span><p>involucran aspectos sociales y culturales los cuales explican las prácticas sexuales de los y las adolescentes .</p><p>Cabe aclarar que en el presente trabajo se muestran los principales problemas de enfermedad que enfrentan los y las adolescentes de acuerdo con el enfoque del tema : educación sexual, esto no significa que el resto de las problemáticas y causas de muerte del adolescente no sean importantes.</p><p>Infecciones de transmisión sexual</p><p>Las Infecciones de Transmisión Sexual (ITS) son aquellas afecciones que se adquieren fundamentalmente a través del contacto sexual, an tes llamadas enfermedades venéreas , haciendo alusión a Venu s, la diosa del amor.</p><p>Numerosos microorganismos pueden transmitirse durante las relaciones sexua les sin la utilización del preservativo masculino y femenino, éstos pueden ser: bacterias, hongos, virus y parásitos. Tradi cionalmente, las enfermedades de transmi sión sexual (ITS) se ca racterizaban por la aparición de una lesión en la zona de los órganos sexuales después de una relación sexual.</p><p>En muchos países del mundo las Infecciones de Tran smisión Sexual (ITS) amenazan con desaparecer a millones de personas en un corto período de tiempo de no tomarse las medidas necesarias por las entidades encargadas. En las dos últimas décadas se observa un aumento del número de personas con la enfermedad, tanto en los países 25</p></div><div class='page-block'><span class='page-marker'>📄 Página 34 del PDF original (Tesis UACM):</span><p>industrializados como en vías de desarrollo, estimándose que a nivel mundial aproximadamente 685 mil personas se contagian con una de estas enfermedades cada día y que cada año ocurren alrededor de 250 millones de casos nuevos de estas enfermedades (Vinculando, 201 O).</p><p>Actualmente se acepta la existencia de una estrecha relación entre las distintas Infecciones de Transmisión Sexual y el</p><p>Síndrome de lnmunodeficiencia Adquirida</p><p>(SIDA), el SIDA es una enfermedad infecciosa causada por un virus denominado Virus de la lnmunodeficiencia Humana (VIH) éste tiene la particularidad de atacar a los linfocitos que son directores de nuestro sistema de defensa . Inicialmente el permanece en estado latente, es decir, &quot;dormido&quot; dentro de linfocitos. En algunos casos , al cabo de un tiempo , a menudo años por causas no bien determinadas, el virus se activa , es decir, &quot;despierta&quot; y comienza a destruir los linfocitos, de esta forma el virus debilita progresivamente el sistema inmune. Cuanto más conocimientos se tenga sobre estas infecciones y cuanto más oportuno y eficaz sea su control, mayor será la posibilidad de cortar la cadena de transmisión , en estos momentos existen 30 tipos de ITS, de las que 26 atacan principalmente a las mujeres y 4 a ambos sexos (Vinculando , 2010).</p><p>La utilización de anticonceptivos y la prevención de las infecciones de transmisión sexual {ITS) varían de acuerdo con la información disponible, según la edad de la iniciación sexual. Es más probable la utilización de preservativos y anticonceptivos en los y las adolescentes cuanto más tardía es la iniciación sexual. Se ha constatado que la educación sobre esas cuestiones modifica los comportamientos sexuales y parece</p><p>26</p></div><div class='page-block'><span class='page-marker'>📄 Página 35 del PDF original (Tesis UACM):</span><p>ser más eficaz si se imparte antes de la primera relación sexual, es decir, en la adolescencia o preadolescencia (&quot; La educación sexual en México&quot;, 2008).</p><p>VIH/SIDA</p><p>El Virus de lnmunodeficiencia Humana (VIH) es el causante del SIDA, y consti tuye la más reciente enfermedad de transmisión sexual y se ha transformado en un grave problema de enfermedad a nivel mundial, dada la rapidez de su propagación y la fatal evolutividad del cuadro clínico , para el que no existe cura en el momento actual. En el mundo, casi la cuarta parte de las personas con virus tienen menos de 25 años y más de 7 mil jóvenes entre 10 y 24 años se contagian diariamente de VIH (&quot;La educación sexual en México&quot;, 2008).</p><p>El mecanismo de transmisión más frecuente es el contacto sexual con personas enfermas por el virus y en grado menor, el uso compartido de agujas y jeringas de inyección, así como las transfusiones de sang re o sus productos contaminados por el virus. La transmisión del VIH de la madre contagiada al feto y neonato, se realiza en el 50% de los casos (PASA, 2001 ).</p><p>Es importante diferenciar los conceptos de persona infectada por VIH y enfermo de SIDA. De las personas que han sido infectadas con VIH , aproximadamente el 30% desarrolla la enfermedad, el SIDA, en un plazo variable de algunos años, presentando el cortejo si ntomático y la evolutividad característica. Los restantes son portadores</p><p>27</p></div><div class='page-block'><span class='page-marker'>📄 Página 36 del PDF original (Tesis UACM):</span><p>asintomáticos del germen, intervienen en la cadena epidemiológica y pueden ser detectados a través de las pruebas serológicas (Cerruti, 1992).</p><p>En México , la epidemia del SIDA es principalmente por transmisión sexual, toda vez que este tipo de transmisión ha sido la causante de casi 90% de los casos. La epidemia se encuentra fundam entalmente en el grupo de Hombres que tiene sexo con Hombres (HSH) -clasificación que ha impuesto la Secretaría de Salud para hacer referencia a las prácticas homoeróticas-, con poco más de 50% del total de casos acumulados; pero con una tendencia ascendente, en los últimos años, en los casos de tipo heterosexual (PASA, 2001 ).</p><p>La Organización Mundial de la Salud (OMS, 2006) estimó que en México ocurren anualmente siete millones de casos nuevos de Infecciones de Transmisión Sexual (ITS) curables: tricomonas (3.39 millones de infecciones), clamidia (92 millones), gonorrea (1.36 millones) y sífilis (0.24 millones).</p><p>La tasa de cambio de pareja sexual es más elevada durante la adolescencia y comienzos de la veintena . Esto no sólo es cie rto en el caso de parejas casuales , sino también tratándose de relaciones que se consideran regulares y monógamas. Aunque sucesivos emparejamientos monógamos pueden ser de corta duración , su carácter &quot;estable&quot;, desde el punto de vista de muchos y muchas adolescentes que viven esas relaciones, aleja subjetivamente el peligro de contraer ETS. Esto hace que tengan relaciones sexuales sin protección con parejas múltiples, lo que significa que el riesgo</p><p>28</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Vía de Transmisión Dominante</h3>\n<blockquote class=\"quote\">«En México, la epidemia del SIDA es principalmente por transmisión sexual, toda vez que representa el 90% de los casos... El SIDA es una enfermedad infecciosa causada por un virus denominado Virus de Inmunodeficiencia Humana (VIH)... dada la rapidez de su propagación y la fatal evolución en caso de no tratarse, es indispensable cortar la cadena de transmisión mediante el diagnóstico temprano» (p. 25-26).</blockquote>\n\n<h3>2. Barreras Psicosociales</h3>\n<ul>\n  <li><strong>Sensación de Invulnerabilidad:</strong> 'Eso sólo le pasa a gente promiscua o drogadicta'.</li>\n  <li><strong>Estigma Mortal:</strong> El miedo al rechazo familiar impide que los jóvenes soliciten pruebas rápidas serológicas.</li>\n  <li><strong>Burocracia Intimidatoria:</strong> En el Centro de Salud T-III no hay módulos confidenciales cálidos para pruebas de VIH dirigidas a jóvenes.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "ESTIGMA_PENA", "AISLAMIENTO_ATENCION"]}, {"id": "ITS_BACTERIANAS", "title": "ITS Bacterianas: Sífilis, Gonorrea y Clamidia", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 32-35", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 32 del PDF original (Tesis UACM):</span><p>son los accidentes y las lesiones intencionales, las cuales acumulan poco más de dos terceras partes del total de defunciones en los hombres jóvenes (64.7% ); mientras que entre las mujeres estas causas concentran a un tercio de la muertes (32.9%), seguidas de los tumores malignos ( 10.9 %) y las asociadas con complicaciones de la maternidad (8.5%) (Conapo, 2006).</p><p>Los comportamientos y prácticas sexuales de los y las adolescentes se encuentran relacionados con sus niveles de salud, considerando que gran parte de dichas prácticas son de riesgo. De acuerdo con los resultados preliminares del análisis sobre la conducta sexual en estudiantes de secundaria y bachillerato técnico del Distrito Federal (2008), los varones tienen en promedio su primera relación sexual a los 14.5 años y las mujeres a los 15.5 años; y en algunos casos tal inicio sexual ocurre regularmente sin el uso de algún método de prevención del embarazo, del Virus del Papiloma Humano (VPH ) y del Virus de lnmunodeficiencia Humana (VIH) y otras Enfermedades de Transmisión Sexual (ETS).</p><p>De</p><p>acuerdo</p><p>con</p><p>estudios</p><p>realizados</p><p>desde</p><p>una</p><p>perspectiva</p><p>psicologista,</p><p>el</p><p>comportamiento de los y las adolescentes son prácticas sexuales y relaciones de riesgo repetitivas sin protección , por lo tanto son síntoma de problemas emocionales. Reflejan un estilo de vida al límite; los adolescentes que asumen estos riegos tienden a asumirlos en otras facetas de la vida (Martínez, 2008). El riesgo queda de manifiesto en las tasas desproporcionadamente elevadas en las ITS y los embarazos no deseados. No obstante, que se debe ser cu id adoso en esta postura ya que los problemas de enfermedad no se determinan a partir de problemas emocionales de los sujetos, 24</p></div><div class='page-block'><span class='page-marker'>📄 Página 33 del PDF original (Tesis UACM):</span><p>involucran aspectos sociales y culturales los cuales explican las prácticas sexuales de los y las adolescentes .</p><p>Cabe aclarar que en el presente trabajo se muestran los principales problemas de enfermedad que enfrentan los y las adolescentes de acuerdo con el enfoque del tema : educación sexual, esto no significa que el resto de las problemáticas y causas de muerte del adolescente no sean importantes.</p><p>Infecciones de transmisión sexual</p><p>Las Infecciones de Transmisión Sexual (ITS) son aquellas afecciones que se adquieren fundamentalmente a través del contacto sexual, an tes llamadas enfermedades venéreas , haciendo alusión a Venu s, la diosa del amor.</p><p>Numerosos microorganismos pueden transmitirse durante las relaciones sexua les sin la utilización del preservativo masculino y femenino, éstos pueden ser: bacterias, hongos, virus y parásitos. Tradi cionalmente, las enfermedades de transmi sión sexual (ITS) se ca racterizaban por la aparición de una lesión en la zona de los órganos sexuales después de una relación sexual.</p><p>En muchos países del mundo las Infecciones de Tran smisión Sexual (ITS) amenazan con desaparecer a millones de personas en un corto período de tiempo de no tomarse las medidas necesarias por las entidades encargadas. En las dos últimas décadas se observa un aumento del número de personas con la enfermedad, tanto en los países 25</p></div><div class='page-block'><span class='page-marker'>📄 Página 34 del PDF original (Tesis UACM):</span><p>industrializados como en vías de desarrollo, estimándose que a nivel mundial aproximadamente 685 mil personas se contagian  creer al joven que sanó mientras la bacteria invade órganos vitales.</li>\n  <li><strong>Automedicación:</strong> Por vergüenza de mostrar sus genitales al médico, recurren a remedios caseros o antibióticos mal recetados.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "AISLAMIENTO_ATENCION", "MMH_MENENDEZ"]}, {"id": "VULNERABILIDAD_BIO", "title": "Vulnerabilidad Biopsicosocial en la Adolescencia", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 31-34", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 31 del PDF original (Tesis UACM):</span><p>Como puede observarse, las diversas formas de estudiar el constructo de la adolescencia hace que se ponga énfasis en determinados elementos de acuerdo con el campo disciplinar, sin embargo, también se encuentran puntos de coincidencia al definir el concepto como un estado de búsqueda, de cuestionamiento de lo establecido, de un desafío a los esquemas de autoridad ; es una etapa en donde los esquemas de reproducción social se impregnan en los sujetos, en este caso en las y los adolescentes.</p><p>1. 4. Algunos problemas de enfermedad de los y las adolescentes</p><p>Los problemas de enfermedad de la adolescencia y juventud tienden a ser muy diferentes de los que se presentan a edades más tempranas y están condicionados por una ca rga psicosocial elevada y un bajo tenor de trastornos orgánicos. Este hecho influye de manera trascendental en la disponibilidad de información para analizar las condiciones de salud del grupo, ya que a la falta de datos de incidencia de enfermedades, se agrega la escasez del registro de problemas psicosociales.</p><p>En los adolescentes se presentan las mayores diferencias de la mortalidad entre hombres y mujeres, lo que lleva a un análisis de la situación de salud y la asignación de prioridad y atención en los abordajes de políticas públicas de acuerdo con el contexto social de este grupo.</p><p>En México, las causas de defunción en esta etapa de la vida se vinculan estrechamente con las conductas y situaciones de riesgo . De hecho, las principales causas de muerte 23</p></div><div class='page-block'><span class='page-marker'>📄 Página 32 del PDF original (Tesis UACM):</span><p>son los accidentes y las lesiones intencionales, las cuales acumulan poco más de dos terceras partes del total de defunciones en los hombres jóvenes (64.7% ); mientras que entre las mujeres estas causas concentran a un tercio de la muertes (32.9%), seguidas de los tumores malignos ( 10.9 %) y las asociadas con complicaciones de la maternidad (8.5%) (Conapo, 2006).</p><p>Los comportamientos y prácticas sexuales de los y las adolescentes se encuentran relacionados con sus niveles de salud, considerando que gran parte de dichas prácticas son de riesgo. De acuerdo con los resultados preliminares del análisis sobre la conducta sexual en estudiantes de secundaria y bachillerato técnico del Distrito Federal (2008), los varones tienen en promedio su primera relación sexual a los 14.5 años y las mujeres a los 15.5 años; y en algunos casos tal inicio sexual ocurre regularmente sin el uso de algún método de prevención del embarazo, del Virus del Papiloma Humano (VPH ) y del Virus de lnmunodeficiencia Humana (VIH) y otras Enfermedades de Transmisión Sexual (ETS).</p><p>De</p><p>acuerdo</p><p>con</p><p>estudios</p><p>realizados</p><p>desde</p><p>una</p><p>perspectiva</p><p>psicologista,</p><p>el</p><p>comportamiento de los y las adolescentes son prácticas sexuales y relaciones de riesgo repetitivas sin protección , por lo tanto son síntoma de problemas emocionales. Reflejan un estilo de vida al límite; los adolescentes que asumen estos riegos tienden a asumirlos en otras facetas de la vida (Martínez, 2008). El riesgo queda de manifiesto en las tasas desproporcionadamente elevadas en las ITS y los embarazos no deseados. No obstante, que se debe ser cu id adoso en esta postura ya que los problemas de enfermedad no se determinan a partir de problemas emocionales de los sujetos, 24</p></div><div class='page-block'><span class='page-marker'>📄 Página 33 del PDF original (Tesis UACM):</span><p>involucran aspectos sociales y culturales los cuales explican las prácticas sexuales de los y las adolescentes .</p><p>Cabe aclarar que en el presente trabajo se muestran los principales problemas de enfermedad que enfrentan los y las adolescentes de acuerdo con el enfoque del tema : educación sexual, esto no significa que el resto de las problemáticas y causas de muerte del adolescente no sean importantes.</p><p>Infecciones de transmisión sexual</p><p>Las Infecciones de Transmisión Sexual (ITS) son aquellas afecciones que se adquieren fundamentalmente a través del contacto sexual, an tes llamadas enfermedades venéreas , haciendo alusión a Venu s, la diosa del amor.</p><p>Numerosos microorganismos pueden transmitirse durante las relaciones sexua les sin la utilización del preservativo masculino y femenino, éstos pueden ser: bacterias, hongos, virus y parásitos. Tradi cionalmente, las enfermedades de transmi sión sexual (ITS) se ca racterizaban por la aparición de una lesión en la zona de los órganos sexuales después de una relación sexual.</p><p>En muchos países del mundo las Infecciones de Tran smisión Sexual (ITS) amenazan con desaparecer a millones de personas en un corto período de tiempo de no tomarse las medidas necesarias por las entidades encargadas. En las dos últimas décadas se observa un aumento del número de personas con la enfermedad, tanto en los países 25</p></div><div class='page-block'><span class='page-marker'>📄 Página 34 del PDF original (Tesis UACM):</span><p>industrializados como en vías de desarrollo, estimándose que a nivel mundial aproximadamente 685 mil personas se contagian con una de estas enfermedades cada día y que cada año ocurren alrededor de 250 millones de casos nuevos de estas enfermedades (Vinculando, 201 O).</p><p>Actualmente se acepta la existencia de una estrecha relación entre las distintas Infecciones de Transmisión Sexual y el</p><p>Síndrome de lnmunodeficiencia Adquirida</p><p>(SIDA), el SIDA es una enfermedad infecciosa causada por un virus denominado Virus de la lnmunodeficiencia Humana (VIH) éste tiene la particularidad de atacar a los linfocitos que son directores de nuestro sistema de defensa . Inicialmente el permanece en estado latente, es decir, &quot;dormido&quot; dentro de linfocitos. En algunos casos , al cabo de un tiempo , a menudo años por causas no bien determinadas, el virus se activa , es decir, &quot;despierta&quot; y comienza a destruir los linfocitos, de esta forma el virus debilita progresivamente el sistema inmune. Cuanto más conocimientos se tenga sobre estas infecciones y cuanto más oportuno y eficaz sea su control, mayor será la posibilidad de cortar la cadena de transmisión , en estos momentos existen 30 tipos de ITS, de las que 26 atacan principalmente a las mujeres y 4 a ambos sexos (Vinculando , 2010).</p><p>La utilización de anticonceptivos y la prevención de las infecciones de transmisión sexual {ITS) varían de acuerdo con la información disponible, según la edad de la iniciación sexual. Es más probable la utilización de preservativos y anticonceptivos en los y las adolescentes cuanto más tardía es la iniciación sexual. Se ha constatado que la educación sobre esas cuestiones modifica los comportamientos sexuales y parece</p><p>26</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Confluencia Biopsicosocial del Riesgo</h3>\n<blockquote class=\"quote\">«Las tasas desproporcionadamente elevadas en las ITS y los embarazos no deseados no se determinan únicamente a partir de problemas emocionales individuales, sino que involucran aspectos biológicos, sociales y culturales indisociables» (p. 24).</blockquote>\n\n<h3>2. Tres Ejes de Vulnerabilidad</h3>\n<ul>\n  <li><strong>Biológico:</strong> Mucosa genital en desarrollo, mayor absorción tisular y susceptibilidad a microtraumas.</li>\n  <li><strong>Psicológico:</strong> Labilidad emocional, búsqueda de identidad y presión del grupo de pares (Aberastury, 1992).</li>\n  <li><strong>Económico y Territorial:</strong> El 71% de los adolescentes encuestados depende totalmente del dinero de sus padres en Iztapalapa, lo que coarta su acceso a insumos de salud privados.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "TERRITORIO_IZTAPALAPA", "GENERO_PODER", "PSICOLOGIA_EVOLUTIVA"]}, {"id": "CONDON_MITOS", "title": "Mitos y Resistencia al Uso del Condón", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 184-187", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 184 del PDF original (Tesis UACM):</span><p>se reduce, como en otras instituciones, al uso de medidas de protección para el embarazo o infecciones de transmisión sexual, nuevamente, la sexualidad se reduce a la reproducción o a la prevención de la enfermedad . El siguiente comentario es de una adolescente de 15 años entrevistada al salir de consulta médica respecto a si en la escuela le han hablado del tema:</p><p>&quot;No porque es malo hablar de eso, en mi escuela dicen eso, la maestra de formación cívica nos dice que tenemos que usar protección, nos dice que no es ni malo ni bueno pero que si es bueno que nos den información. Y nos dice que nos tenemos que cuidar y todo eso&quot; (Ana).</p><p>La anterior es una respuesta tajante de una adolescente y es el argumento oficial de la mayoría de las escuelas en México. En el ámbito escolar la Educación Sexual es un término usado para describir la educación acerca del sexo , la sexualidad, el aparato reproductor femenino y masculino, la orientación sexual, las relaciones sexuales, la planificación</p><p>familiar</p><p>y</p><p>el</p><p>uso</p><p>de</p><p>anticonceptivos,</p><p>la</p><p>reproducción</p><p>y más</p><p>específicamente la reproducción humana . Los derechos sexuales y otros aspectos de la sexualidad humana y el objetivo de alcanzar una satisfactoria salud sexual quedan fuera de la visión de los programas educativos.</p><p>Los y las adolescentes demandan otra visión de educación sexual en el contexto escolar, así lo señaló una madre adolescente que se da cuenta de la importancia que tiene la educación sexual en la escuela:</p><p>176</p></div><div class='page-block'><span class='page-marker'>📄 Página 185 del PDF original (Tesis UACM):</span><p>&quot;En la escuela ya deben ser más abiertos con los niños, muchas veces te limitan en ciertos temas, pero es muy importante que los niños conozcan sobre su sexualidad &quot; (Aurora).</p><p>Con lo que respecta a la visión del personal de salud respecto de la educación sexual se observó que no dista mucho de lo que en teoría se piensa, es decir, encontramos que el personal médico, de enfermería , trabajo social, técnico y administrativo que cuenta con los conocimientos o está encargado de brindar el servicio de asesoría , consejería , educación para la salud , etcétera , muestran una postura valorativa sobre el tema y para ocultar la falta de compromiso para con los adolescentes argumentan que son ellos los que no cuentan con la información suficiente y que tienen muchas dudas; el personal dice no contar con el material , tiempo y los espacios necesarios para brindar una buena atención , y por otro lado que los jóvenes no saben a dónde y con quién acudir.</p><p>La educación sexual en el ce ntro de salud se conce ntra en la entrega de material gráfico, condoneria , campaña s de higi ene, control médico, pláticas informativas, todo con un enfoque de prescribir y co ntrolar comportamientos y práctica s sexuales de los sujetos. Estos datos pueden co rroborarse con los resultados de la información obtenida en los cuestionarios aplicados a los y las adolescentes (ver gráfica No. 14 en pág. 165). Los datos demuestran que no hay un acercamiento directo, abierto y significativo con los y las adolescentes en el que puedan expresar sus dudas, necesidades y experiencias.</p><p>177</p></div><div class='page-block'><span class='page-marker'>📄 Página 186 del PDF original (Tesis UACM):</span><p>Lo anterior muestra la clásica visión Médica-hegemónica, la cual prescribe y enseña a los ignorantes, (Menéndez,</p><p>1994) señala &quot;los factores económico-políticos son</p><p>determinantes en la constitución de las formas de estratificación social dominantes, pero el reconocimiento de esto no debe conduci r a considerar como subordinados ni determinados a los procesos ideológicos y culturales que intervienen en el proceso salud/enfermedad/atención&quot;.</p><p>Los resultados de la investigación y de los grupos de reflexión indican que el personal en el Centro de Salud brinda educación sexual de manera limitada y sólo es abordada desde la entrega de material impreso y alguna otra forma de dar la información como es la entrega de pulseras alusivas y condones , a estas acciones se les llama &quot;promoción de la salud&quot;, son consideradas como actividad de difusión siendo esta labor exclusiva de Trabajo Social , sin embargo, los y las adolescentes señalan que son actividades que no reflejan un impacto positivo en su aprendizaje sobre su sexualidad.</p><p>Asistencia al Centro de Salud</p><p>Cuando analizamos la asistencia y permanencia de los jóvenes en el centro de salud identificamos que el motivo de solicitud del servicio tiene como constante la consulta prenatal y puerperio, terminando posteriormente en consulta del o de la niña , hay casos en que los adolescentes se acercan al centro de salud para solicitar información y/o métodos de planificación familiar, sin embargo, muchas veces los hacen esperar demasiado tiempo , si es que alcanzan ficha para consulta . Los y las adolescentes señalan que esperan la atención de 30 a 60 minutos (ver gráfica No. 10 en pág . 161), 178</p></div><div class='page-block'><span class='page-marker'>📄 Página 187 del PDF original (Tesis UACM):</span><p>esto representa mucho tiempo de espera para los adolescentes, ya que su margen de tiempo es apretado por las diferentes actividades que tienen y señalaron que es desesperante la tardanza mencionaron que deberían agilizar el proceso de atención. El siguiente testimonio refleja la inconformidad:</p><p>&quot;Bueno aquí no, pero allá (en el IMSS) es diferente cuando vas a planificación familiar no es como aquí que tienes que venir temprano a sacar ficha y luego esperar hasta que te toque pasar al consultorio, allá sólo entregas tu carne! a la hora que llegas y te atienden , es desde la mañana y creo que hasta las seis o cuatro&quot; (Aurora).</p><p>La otra parte es que no son atendidos con respeto al negarles el libre albedrío para decidir por el método de anticoncepción.</p><p>La asistencia al centro de salud obedece a su condición de clase y su estatu s laboral porque no cuentan con servicios médicos como el Instituto Mexicano del Seguro Social (IMSS) o con el Instituto de Seguridad y Servicios Socia les de los Trabajadores del Estado (ISSSTE) y mencionan que si n recursos económicos no tienen otra opción en algunos caso se han afiliado al Programa de Atención Médica y Medicamentos Gratuitos correspondiente al Gobierno del Distrito Federal, y lo al Seguro Popular Programa Federal, para poder tener atención las madres y sus hijos. Mencionan no estar conformes o satisfechas con el servicio por lo cual se ven obligadas a acudir al médico privado.</p><p>179</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Resistencias Identificadas en los Talleres de Reflexión</h3>\n<blockquote class=\"quote\">«Ambos equipos de adolescentes coincidieron en tener información sobre sexualidad y valores, cuidarse de las enfermedades... sin embargo, los mitos sobre el condón siguen vigentes: que resta sensibilidad o placer, que se rompe fácil, o que proponerlo denota desconfianza o infidelidad hacia la pareja... si el varón se niega al condón, la mujer suele ceder para no perder la relación afectiva» (p. 176, 195).</blockquote>\n\n<h3>2. Mitos Patriarcales Clave en Iztapalapa</h3>\n<ul>\n  <li><em>«Le quita la pasión al momento»:</em> Creencia de que planificar el cuidado rompe el romanticismo.</li>\n  <li><em>«Si una mujer trae condones en la bolsa es porque es fácil»:</em> Sanción moral machista hacia la mujer precavida.</li>\n  <li><em>«Si le pido condón a mi novio va a pensar que ando con otro»:</em> Chantaje emocional que anula la protección.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "GENERO_PODER", "CONDONERIA_FOLLETOS", "ESI_EMANCIPATORIA"]}, {"id": "ESTIGMA_PENA", "title": "Estigma Social, Culpa y Vergüenza", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 189-192", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 189 del PDF original (Tesis UACM):</span><p>El siguiente testimonio ejemplifica las reflexiones sobre el control que los &quot;otros&quot; ejercen sobre la salud de los y las adolescentes, señalan que asisten a consulta porque son llevados por los padres y cuando se ven y sienten realmente enfermos.</p><p>&quot;Vengo nada más cuando me mandan, sólo cuando estoy enferma &quot; (Rosa).</p><p>&quot;Este no apenas empecé a venir porque sí venía pero de chiquita porque dejé de venir por la escuela y ahorita pues ya no me da tiempo y ahorita como estoy de vacaciones decidí venir para que me vieran los dientes&quot; (Martha).</p><p>De acuerdo con lo anterior podemos decir que no son estos actores los que construyen su concepción de la salud y que el acercamiento a los espacios institucionalizados obedece a las decisiones y presiones de los otros.</p><p>Relación que se establece con el personal de salud</p><p>&quot;Que los médicos sean más amables, que brindaran confianza, que sean más amables para preguntar las dudas&quot; (Raúl).</p><p>Es lo expresado por diversos informantes cuando describen las relaciones que establecen con el personal de salud, la observación no participante nos arroja las mismas refle xiones; la mayoría de las actitudes del personal de salud es distante, 181</p></div><div class='page-block'><span class='page-marker'>📄 Página 190 del PDF original (Tesis UACM):</span><p>impositiva, indiferente, de regaño, los adolescentes entrevistados señalaron sentirse juzgados y discriminados y evocan una frase del personal médico &quot;son muy jóvenes para pensar en sexo o para tomar decisiones correctas&quot;, y las preguntas que surgen son: ¿cuáles son esas decisiones correctas? o ¿cuál es la edad indicada para esto o para aquello?. Y qué significado tiene la palabra sexo ¿es sinónimo de sexualidad y por tanto los y las adolescentes debieran ser seres asexuados?</p><p>&quot;Que los doctores o los trabajadores sepan , el chiste es que nos sepa explicar porque luego hay mucha gente que va y habla y nada más hace lo que tiene que decir, pero en realidad no preguntan, no saben de las inquietudes de uno&quot; (Norma).</p><p>Por lo tanto, el trato es violento hacia los actores, la información es limitada y reduccionista , así lo refleja la información obtenida en los diversos instrumentos utilizados, expresaron sentir un trato indiferente y déspota en consultorios y en el servicio de Trabajo Social, principalmente, los y las adolescentes expresan no sentirse tomados en cuenta al tratarlos con indiferencia , este trato logra cohibir aún más a los y las adolescentes y que en un momento dado la actitud los hace sentir incómodos y frustrados al salir del centro de salud sin una atención y resolución de dudas.</p><p>&quot;Bueno al principio cuando vine aquí en trabajo social no, como que se ponían muy payasas las trabajadoras sociales, pero ya después cuando iba a sacar lo del seguro popular ya ahí si ya tuve el seguro popular&quot; (María). 182</p></div><div class='page-block'><span class='page-marker'>📄 Página 191 del PDF original (Tesis UACM):</span><p>No obstante que en la mayoría de los servicios el trato es violento, se encontró que en el archivo clínico el trato es diferente. Los y las adolescentes suelen acudir en pareja un 17% y en otros casos con la madre o el padre en un 50 %, sólo así se animan ir al centro de salud y preguntar abiertamente sobre sexualidad en estos casos al primer lugar que llegan generalmente es al archivo clínico:</p><p>&quot;Bueno es como le digo depende de con quién vengan , si vienen acompañados de la mamá o del papá hay veces que comienza a preguntar la mamá y ya ella le dice pide tú la información y ya nosotros le decimos qué se te ofrece, qué necesitas o de qué es tu trabajo , qué vas hacer y les damos confianza y empezamos a platicar y ya es cuando vienen con la mamá , pero cuando vienen solos o con amigos es lo que le digo vienen a preguntar pero entre dientes cómo hablando y no hablando rumorando o muchas veces uno le dice al otro pregunta tú, y ya nosotros nos acercamos y les decimos qué se te ofrece&quot; (Sra . Virginia).</p><p>Se pudo constatar por medio de la observación no participante y posteriormente mediante las entrevistas que se realizaron al personal de este servicio, que están sensibilizados al atender a los y las adolescentes; no todo el personal de salud tiene una actitud indiferente. Sin embargo, la estructura de la institución funciona como se ha descrito porque se constituye, finalmente , como agencia de poder y control de un metacampo de poder más amplio .</p><p>183</p></div><div class='page-block'><span class='page-marker'>📄 Página 192 del PDF original (Tesis UACM):</span><p>&quot;Ah pero los adolescentes vienen y preguntan sobre la información, algunos vienen directamente y preguntan dónde puedo encontrar información sobre la sexualidad que me piden en la escuela información del uso del condón y ya</p><p>entonces los mandamos allá arriba</p><p>directamente a trabajo social, son pocos los que vienen y digamos que son de los dos, hombres y mujeres los que vienen&quot; (Sr. Alfonso).</p><p>En el caso de la atención médica el personal refiere estar inmerso en sus tareas laborales, reconoce que los adolescentes requieren de una atención dirigida , sin embargo , concluye que el tiempo laboral no les permite brindar una atención con calidad a los y las adolescentes por la excesiva carga de trabajo y por las metas que la institución les pide, en un esquema de eficiencia pragmática lo que se requiere es &quot;despachar&quot; y contabilizar pacientes , un médico señala al respecto:</p><p>&quot;No, yo creo que como somos el primer enfoque la primera relación yo creo que sería muy importante que nosotros le diéramos algo más, más conocimiento , más armas al &quot;jovencito&quot; para que sepa más sobre la sexualidad y ya si a el le interesa saber más o adentrarse a lo que tenga más inquietud y que no sea suficiente lo que le digamos nosotros pues entonces tendría que ir a una temática de grupo&quot; (Médico Sergio}.</p><p>La falta de sensibilidad del personal médico los lleva a una postura paternalista que más allá de proteger o enseñar, más bien el trato es de reprimir y juzgar lo que lleva a regaños y/o a una atención superficial. A partir de este modo de trato los y las 184</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Control Panóptico en la Colonia</h3>\n<blockquote class=\"quote\">«Apenas empecé a venir porque antes me daba pena... en la colonia creen que si vas al centro de salud es porque vienes embarazada o con alguna enfermedad de transmisión sexual, así que prefieres aguantarte antes de que te vean entrar» (Adolescente entrevistada, p. 182).</blockquote>\n\n<h3>2. Factores del Silencio</h3>\n<ul>\n  <li><strong>Vigilancia Vecinal:</strong> En Iztapalapa, ingresar al consultorio de planificación es objeto de chismes y rumores vecinales.</li>\n  <li><strong>Vergüenza en Mostradores:</strong> Farmacias y ventanillas hospitalarias donde se atiende con miradas de reproche a los jóvenes.</li>\n  <li><strong>Retraso Diagnóstico:</strong> Ocultar lesiones por meses hasta que el dolor o la inflamación se vuelven insoportables.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "AISLAMIENTO_ATENCION", "TABU_FAMILIAR", "RELACION_MEDICO_PACIENTE"]}, {"id": "AISLAMIENTO_ATENCION", "title": "Aislamiento y Retraso en la Atención Médica", "group": "its", "badge": "Problema de las ITS", "color": "#9d0208", "pages": "Págs. 166-172", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 166 del PDF original (Tesis UACM):</span><p>Adolescentes que solicitan información de educación sexual en el Centro de Salud</p><p>Respecto al acercam iento de los y las adolescentes al centro de salud para solicitar información en materia de educación sexual los resultados muestran un 73% de adolescentes que no piden información contra un 27% que sí lo hacen . Ver gráfica 7.</p><p>Gráfica 7</p><p>ADOLESCENTES QUE SOLICITAN</p><p>73%</p><p>- -·-</p><p>UK f-----</p><p>t-----</p><p>O NO</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ru iz Castañeda.</p><p>158</p></div><div class='page-block'><span class='page-marker'>📄 Página 167 del PDF original (Tesis UACM):</span><p>Adolescentes que hacen uso de los servicios</p><p>La siguiente gráfica muestra que el 70% de los y las adolescentes encuestados no tiene un control médico en el centro de salud , mientras que un 30% sí lo tiene.</p><p>Lo anterior indica que la mayoría de los adolescentes acude por alguna molestia eventual de enfermedad o requerimiento de algún servicio específico, de acuerdo con la información recabada en los consultorios indicaron vacunas, certificado médico y escolar.</p><p>Gráfica 8</p><p>ADOLESCENTES QUE HACEN USO DE LOS SERVICIOS o 70 %</p><p>• 30 %</p><p>O NO</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-11 1Dr. Maximiliano Ruíz Castañeda.</p><p>159</p></div><div class='page-block'><span class='page-marker'>📄 Página 168 del PDF original (Tesis UACM):</span><p>Quiénes acompañan a los y las adolescentes al Centro de Salud</p><p>Con lo que respecta al acompañamiento de los y las adolescentes al acudir al centro de salud observamos que son los padres , con un 49%, siguiéndole la pareja con el 17%, el 15% señaló que lo acompaña otra persona, acudir solos (as) el 17% y el 1% se hizo acompañar de amigos. Ver gráfica 9.</p><p>Gráfica 9</p><p>ACOMPAÑANTES DE LOS ADOLESCENTES 60</p><p>so</p><p>40</p><p>30</p><p>20</p><p>10</p><p>o PADRES</p><p>PAREJ A</p><p>AM IGOS(AS)</p><p>SO LO (A)</p><p>OTRO</p><p>Fuente : Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ru íz Castañeda .</p><p>160</p></div><div class='page-block'><span class='page-marker'>📄 Página 169 del PDF original (Tesis UACM):</span><p>Tiempo de espera en el Centro de Salud</p><p>Cuando los y las adolescentes acuden al centro de salud es importante saber su permanencia en el mismo, la gráfica 1O nos muestra el tiempo de espera de los adolescentes y observamos que el 48% han esperado de 31 a 60 minutos para ser atendidos, mientras que el 27% han tardado de una a dos horas, por otro lado tenemos un 20% que fueron atendidos antes de 30 minutos le brindaron atención y tan solo un 5% ha esperado más de dos horas.</p><p>Gráfica 10</p><p>TIEMPO DE ESPERA 60</p><p>so</p><p>...</p><p>--</p><p>40</p><p>-</p><p>---</p><p>30</p><p>...</p><p>20</p><p>10</p><p>f--</p><p>»•</p><p>1----</p><p>f---</p><p>l ,.</p><p>o O A 30 MINUTOS</p><p>31 A 60 MINUTOS</p><p>61 A 120 MINUTOS</p><p>J</p><p>121o MÁS</p><p>Fuente . Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ru íz Castañeda.</p><p>161</p></div><div class='page-block'><span class='page-marker'>📄 Página 170 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes sobre la información de educación sexual y reproductiva</p><p>La percepción de los y las adolescentes sobre la información de educación sexual y reproductiva, otorgada en el centro de salud tenemos que el 32% de jóvenes contestaron que dicha información es entendible, mientras que el 26% dijo no habérsela brindado, aquí es importante saber si la solicitaron o no, en el caso de los adolescentes que no contestaron representa el 22%, y el 12% afirma haberles resuelto dudas y sólo el 5% y 3% respondieron que fue difícil de entender y no resuelve dudas, respectivamente . Ver gráfica 11.</p><p>Gráfica 11</p><p>OPINIÓN DE LOS Y LAS ADOLESCENTES SOBRE LA INFORMACIÓN DE EDUCACIÓN SEXUAL Y REPRODUCTIVA 35 30</p><p>25 20 15 10 5</p><p>o ENTENDIBLE</p><p>DIFICIL DE</p><p>NO RESUELVE</p><p>ENTENDER</p><p>DUDAS</p><p>SÍTE HA RESUELTO</p><p>NO TE LA HAN NO CONTESTÓ BRINDADO</p><p>DUDAS</p><p>Fuente· Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ruíz Castañeda .</p><p>162</p></div><div class='page-block'><span class='page-marker'>📄 Página 171 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes del material de difusión en materia de educación sexual y reproductiva</p><p>Sobre el material de difusión de educación sexual y reproductiva que los y las adolescentes reciben en el centro de salud tenemos que el 25% refiere percibirla como entendible y buena en cada uno de los casos , siguiéndole con el 23% de adolescentes que nunca leen el material, el 7% le parece de interés contra un 5% que manifiesta ser malo, y tan sólo el 2% respond ió no entender dicho material, finalmente el 13% no respondió. Ver gráfica 14.</p><p>Gráfica 12</p><p>OPINIÓN DE LOS ADOLESCENTES SOBRE EL MATERIAL DE DIFUSIÓN DE EDUCACIÓN SEXUAL Y REPRODUCTIVA 30 25 25 %</p><p>25 %</p><p>ENTE NDIBLE</p><p>BUE NA</p><p>20</p><p>15 10 5</p><p>o NO</p><p>DE INTE RES</p><p>ENTENDIBLE</p><p>MALA</p><p>NÚNCA LA</p><p>NO</p><p>LEO</p><p>CONTESTÓ</p><p>Fuente: Cuestionario aplicado en el Centro de Salud T-111 Dr. Maximiliano Ruiz Castañeda .</p><p>163</p></div><div class='page-block'><span class='page-marker'>📄 Página 172 del PDF original (Tesis UACM):</span><p>Opinión de los y las adolescentes del trato del personal de salud</p><p>Para englobar los datos recabados en los cuestionarios se consideraron tres grandes rubros que son : Atención Médica incluyéndose las áreas de Consultorio, Trabajo Social , Enfermería e Inmunizaciones; Servicio de Gabinete abarcando Laboratorio y Rayos X; y Servicio Administrativo compuesto por Archivo , Caja y Admin istración .</p><p>En la siguiente gráfica podemos observar la percepción que tienen los y las adolescentes respecto de los servicios considerados que presta el centro de salud , destacando en primera instancia que la percepción se encuentra entre buena y regular, sin embargo para el análisis detallado se debe tomar en cuenta las personas que no recibieron información y los que no asistieron al servicio, lo cual nos indica que se debe mejorar los dichos servicios. Grafica 13</p><p>OPINIÓN DE LOS Y LAS ADOLESCENTES SOBRE EL TRATO DEL PERSONAL DE SALUD</p><p>BUE NO</p><p>.ATENCIÓ N MÉDICA</p><p>.GABINETE</p><p>. ADM INISTRATIVO</p><p>REGULA R</p><p>M ALO</p><p>NO RECIBIÓ INFORMACIÓN</p><p>NO ASISTIÓ AL SERVICIO</p><p>Fuente: Cuestiona ri o aplicado en el Centro de Salud T-111 Dr. Max imiliano Ruíz Castañeda.</p><p>164</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Estadísticas Contundentes de la Encuesta (N=60, Capítulo 6)</h3>\n<blockquote class=\"quote\">«Al indagar sobre si solicitan información en materia de educación sexual, los resultados muestran un 73% de adolescentes que NO piden información contra un escaso 27% que sí lo hace... Además, el 70% no cuenta con ningún control médico regular en el centro» (p. 158-160).</blockquote>\n\n<h3>2. Desamparo Institucional en Cifras</h3>\n<ul>\n  <li><strong>73%</strong> de adolescentes jamás pregunta sobre sexualidad ni ITS al médico.</li>\n  <li><strong>70%</strong> carece de expediente o control médico regular (sólo acuden por vacunas o certificados escolares).</li>\n  <li><strong>49%</strong> acude forzosamente acompañado de sus padres por exigencia médica, cancelando la privacidad.</li>\n  <li><strong>48%</strong> espera entre 31 y 60 minutos, y un <strong>27% espera de 1 a 2 horas</strong> para ser atendido.</li>\n</ul>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "ESTIGMA_PENA", "BARRERAS_CENTRO_SALUD", "EXIGENCIA_TUTOR"]}, {"id": "MMH_MENENDEZ", "title": "Modelo Médico Hegemónico (Eduardo Menéndez)", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 90-95", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 90 del PDF original (Tesis UACM):</span><p>Así encontramos que hay dos categorías fundamentales de esta perspectiva de promoción de la sa lud; la inequidad y la desigualdad social y dado que la S-E no son resultados de una contingencia (Mendoza, 2009) sino se encuentra determinada a partir de dichas desigualdades, la cual se produce y reproduce a partir de sus condiciones materiales de existencia, de las contradicciones mismas de la sociedad que son de orden estructural , por ello la S-E desde la mirada socio-histórica no puede verse a partir de factores biológicos porque sería reducir la explicación de un hecho que se presenta como proceso.</p><p>3. 2. Médico hegemónico</p><p>El Modelo Médico Hegemónico (MMH) se define como el conjunto de prácticas , saberes y teorías generadas por el desarrollo de la medicina científica, el cual desde fines del siglo XVIII logró dejar como subalternos al conjunto de prácticas , saberes e ideologías que dominaban en los conjuntos sociales, hasta lograr identificarse como la única forma de atender la enfermedad, legitimada tanto por criterios científicos como por el Estado.</p><p>Lo anterior deriva del análisis que Eduardo L. Menéndez (1979) hace del MMH , señalando que dicho modelo se constituye y se instituye en los países capitalistas centrales, coetáneamente con el proceso de obtención de hegemonía por parte de la burguesía , y cuando la relación de clases fundamentales en dichas sociedades se establece a través de las relaciones burguesía/proletariado.</p><p>82</p></div><div class='page-block'><span class='page-marker'>📄 Página 91 del PDF original (Tesis UACM):</span><p>El MMH se constituye en función del conjunto de las clases sociales urbanas y no sólo de los sectores burgueses y pequeños burgueses. Más aún , en un nivel manifiesto dicho modelo aparece asociado en su desarrollo a la lucha y abatimiento de toda una serie de padecimientos que pueden ser vinculados con las condiciones de vida de las clases</p><p>subalternas.</p><p>La</p><p>desnutrición ,</p><p>el</p><p>alcoholismo,</p><p>las</p><p>enfermedades</p><p>infectocontagiosas y en particular la tuberculosis incidían diferencialmente en el conjunto de las clases sociales, de tal manera que sus consecuencias más graves se daban en los trabajadores urbanos. Las condiciones de vida del proletariado emergen como aquellas donde se dan más frecuente y lentamente los padecimientos que supuestamente la práctica médica debía erradicar.</p><p>Pero el MMH , se instituye durante el periodo en que las clases subalternas urbanas, incluidos los trabajadores industriales, mejoran comparativamente su nivel de vida y comienzan a obtener determinados &quot;beneficios sociales&quot; como producto de sus luchas y de las necesidades productivas y legitimadoras de la clase dominante. Así, las mejoras en las condiciones de salubridad no se dan abstractamente, sino que implican el control global sobre los focos transmisibles, ya que esto es casi lo único que asegura la protección de las clases dirigentes.</p><p>Los caracteres dominantes de dicho modelo son su biologismo , ahistoricidad , asocialidad , pragmatismo, individualidad, participacionismo subordinado, etcétera, que justamente determinan un tipo de práctica técnica y social donde los factores etiológicos y curativos son depositados en la persona , o a lo sumo en un ambiente &quot;natural&quot;, donde</p><p>83</p></div><div class='page-block'><span class='page-marker'>📄 Página 92 del PDF original (Tesis UACM):</span><p>los procesos colectivos determinantes de la enfermedad, y donde el sujeto y/o los conjuntos sociales son considerados siempre como &quot;pacientes&quot; (Menéndez, 1979).</p><p>La práctica médica que surge de este modelo es una práctica reparativa, que reduce su nivel de análisis a la suma de individuos, y que no puede referir radicalmente sus políticas de salud a los factores económico-políticos e ideológicos determinantes de la enfermedad, pues ello supondría de hecho afectar al proceso dominante. La dimensión biológica, y cuando fuese necesario la dimensión psicológica , aparecen como los niveles a través de los cuales se plantean tanto la causalidad como la solución de los padecimientos.</p><p>El MMH implica el desarrollo de una práctica médica que puede ser pensada como una medicina del trabajador enfermo y no de la enfermedad sobredeterminada por el proceso laboral. La práctica médica convierte el problema específico en un problema abstracto, donde lo determinante es lo genérico, y no la situación específica del trabajador en un determinado proceso productivo.</p><p>Por otra parte, la práctica médica radica su mirada en una aparente especificidad, la de la enfermedad &quot;en sí&quot;, que de hecho elimina la red de relaciones sociales, productiva e ideológicas que afectan la salud global del trabajador, pero también la de su familia , y por ende repercute de manera social.</p><p>Potencialmente y en toda sociedad el MMH cumple cuatro funciones básicas : a) curativo-preventiva ; b) normatizadora ; e) de control y d) de legitimación. La primera 84</p></div><div class='page-block'><span class='page-marker'>📄 Página 93 del PDF original (Tesis UACM):</span><p>función, la curativa-preventiva es la que aparece generalmente como la única, o por lo menos como la reconocida como más importante y relevante. Y en cierta medida así lo es; en el nivel manifiesto y aparente la curación y secundariamente la prevención aparece como las funciones más frecuentes, como aquellas con las cuales se identifica la práctica médica . Más aún, todas las otras funciones necesitan manifestarse a través de esta función; sólo pueden ser asumidas en la medida que sus objetivos serán por lo menos formalmente curativo preventivos.</p><p>Las otras funciones, sobre todo lo que respecta a la normatizadora y de control son parte implícita del trabajo médico: éste necesita normalizar para actuar; requiere controlar para ser eficaz. Lo que Menéndez señala, debemos recordar, que el mero hecho de prevenir un padecimiento supone la posibilidad de normalizar y de controlar. El término &quot;vigilancia epidemiológica &quot; expresa en toda su transparencia este proceso, que en todos los casos supone además una organización jerarquizada de la normalización y de control , así como una participación pasiva de los &quot;pacientes&quot;.</p><p>El MMH, supone aún en sus principales avances objetivos, la posibilidad de controlar y normalizar, y desde esta perspectiva contribuir a la reproducción ideológica de determinadas relaciones dominantes (Menéndez, 1979).</p><p>En el siglo XIX el modelo principal de la salud y la enfermedad ha sido el biomédico. Éste explica la enfermedad en términos de parámetros físicos, y la biología molecular es su disciplina científica básica. Sostiene que las situaciones psicosociales no son responsabilidad de los médicos. La idea de que la enfermedad era causada por un 85</p></div><div class='page-block'><span class='page-marker'>📄 Página 94 del PDF original (Tesis UACM):</span><p>patógeno específico estimuló el desarrollo de las drogas sintéticas y la tecnología médica , e hizo pensar de manera muy optimista , que muchas enfermedades podrían ser curadas , lo que ha llevado al punto de vista de que una enfermedad se encuentra en un agente específico ha dado al campo médico una perspectiva que se concentra en la enfermedad , y no en la salud (Oblitas, 1987).</p><p>Hasta bien entrado el siglo XX , la salud se definía como la ausencia de enfermedad. Es decir, desde este modelo médico se le entiende como algo que hay que conservar o curar agresiones puntuales, como pueden ser accidentes, infecciones, etcétera. (Labrador, Muñoz y Cruzado, 1990). Eduardo Menéndez ha descrito que la medicina se apropia , más bien expropia la salud en términos de beneficio, para unos pocos dominantes más que para el bienestar de los muchos dominados, legitimando el control de aquellos sobre éstos; en el caso del SIDA esta situación se hace patente al principio de</p><p>la</p><p>enfermedad esta</p><p>fue</p><p>estigmatizada</p><p>poniendo etiquetas y una</p><p>barrera</p><p>discriminatoria a las personas con la enfermedad vista en diferentes campos como son : familiar, social, laboral y médico.</p><p>En este modelo tenemos específicamente el campo de las instituciones públicas o privadas de salud regidas por el sector salud, donde la interacción es propiamente médico-paciente y se caracteriza por las relaciones de poder encabezada por el que tiene el conocimiento que asume el grupo interdisciplinario de salud ; en donde casi siempre el &quot;paciente&quot; es un objeto (y no sujeto) pasivo que debe obedecer al pie de la letra las indicaciones del médico, no se le da la apertura a preguntas, dudas y mucho menos expresiones sentidas. Aristóteles decía que todos los conocimientos se podían 86</p></div><div class='page-block'><span class='page-marker'>📄 Página 95 del PDF original (Tesis UACM):</span><p>resumir en dos saberes, según su utilización: el saber de servicio y el saber de poder, la medicina no escapa a este concepto habiendo engendrado tantos servidores de la humanidad como cómplices del poder, según se haya colocado al lado de los dominados o de los dominantes.</p><p>Hasta hoy, el campo de la salud ha sido del dominio de médicos y personal entrenado básicamente para la curación y la prevención de las enfermedades. En este campo la planificación está presente desde en actos médicos específicos de curación individual, hasta en el abordaje de problemas de salud pública global, como las enfermedades transmisibles. Cualquiera que sea la práctica médica validada como tal se encuentra que el objeto de transformación será la enfermedad y no la salud. (Chapela , 1998).</p><p>La visión higiénico-preventista en promoción de la salud parte del marco estructural descrito desde un modelo hegemónico desde el paradigma positivista . Lo anterior efectuado por la sociedad y los tres órdenes de gobierno , para conformar un sistema de salud universal , equitativo, solida rio , plural, eficiente, de alta ca lidad , anticipatorio, descentralizado, participativo y vinculado al desarrollo.</p><p>El Modelo Operativo de Promoción de la Salud de la Secretaría de Salud (MOPS, 20012006) tiene como objetivo atender de manera efectiva las necesidades poblacionales y los retos que presenta el sistema de salud . La disciplina va más allá del evento y se centra en las ca usas epidemiológicas multifactoriales . Al identificar el perfil de riesgos de cada individuo se puede manejar mejor sus condiciones personales. También propone fortalecer aptitudes y habilidades y crear una verdadera cultura en salud que 87</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Definición Clásica de Eduardo Menéndez</h3>\n<blockquote class=\"quote\">«El Modelo Médico Hegemónico (MMH) se define como el conjunto de prácticas, saberes y teorías generadas por el desarrollo de lo que se conoce como medicina científica, el cual desde fines del siglo XVIII ha ido logrando dejar como subalternos al conjunto de prácticas, saberes e ideologías que dominaban en los conjuntos sociales... caracterizado por el biologicismo, la concepción ahistórica, el individualismo, la eficacia pragmática y la relación asimétrica y de dominación médico-paciente... donde el objeto de transformación será la enfermedad y no la salud» (p. 82-84).</blockquote>\n\n<h3>2. Las Cuatro Funciones Estructurales del MMH</h3>\n<ul>\n  <li><strong>Curativa-Preventiva Aparente:</strong> La única legitimada socialmente, pero subordinada al fármaco.</li>\n  <li><strong>Normatizadora:</strong> Establece qué conductas sexuales son 'decentes' o 'desviadas'.</li>\n  <li><strong>Control Social:</strong> Vigilancia epidemiológica jerarquizada sobre cuerpos subordinados.</li>\n  <li><strong>Reproducción Ideológica:</strong> Mantiene la superioridad del experto sobre el saber popular.</li>\n</ul>\n</div>", "links": ["RELACION_MEDICO_PACIENTE", "BARRERAS_CENTRO_SALUD", "DESPACHO_PACIENTES", "EXIGENCIA_TUTOR"]}, {"id": "RELACION_MEDICO_PACIENTE", "title": "Relación Médico-Paciente Vertical y Juicio Moral", "group": "medicina", "badge": "Entorno Médico", "color": "#0077b6", "pages": "Págs. 191-195", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 191 del PDF original (Tesis UACM):</span><p>No obstante que en la mayoría de los servicios el trato es violento, se encontró que en el archivo clínico el trato es diferente. Los y las adolescentes suelen acudir en pareja un 17% y en otros casos con la madre o el padre en un 50 %, sólo así se animan ir al centro de salud y preguntar abiertamente sobre sexualidad en estos casos al primer lugar que llegan generalmente es al archivo clínico:</p><p>&quot;Bueno es como le digo depende de con quién vengan , si vienen acompañados de la mamá o del papá hay veces que comienza a preguntar la mamá y ya ella le dice pide tú la información y ya nosotros le decimos qué se te ofrece, qué necesitas o de qué es tu trabajo , qué vas hacer y les damos confianza y empezamos a platicar y ya es cuando vienen con la mamá , pero cuando vienen solos o con amigos es lo que le digo vienen a preguntar pero entre dientes cómo hablando y no hablando rumorando o muchas veces uno le dice al otro pregunta tú, y ya nosotros nos acercamos y les decimos qué se te ofrece&quot; (Sra . Virginia).</p><p>Se pudo constatar por medio de la observación no participante y posteriormente mediante las entrevistas que se realizaron al personal de este servicio, que están sensibilizados al atender a los y las adolescentes; no todo el personal de salud tiene una actitud indiferente. Sin embargo, la estructura de la institución funciona como se ha descrito porque se constituye, finalmente , como agencia de poder y control de un metacampo de poder más amplio .</p><p>183</p></div><div class='page-block'><span class='page-marker'>📄 Página 192 del PDF original (Tesis UACM):</span><p>&quot;Ah pero los adolescentes vienen y preguntan sobre la información, algunos vienen directamente y preguntan dónde puedo encontrar información sobre la sexualidad que me piden en la escuela información del uso del condón y ya</p><p>entonces los mandamos allá arriba</p><p>directamente a trabajo social, son pocos los que vienen y digamos que son de los dos, hombres y mujeres los que vienen&quot; (Sr. Alfonso).</p><p>En el caso de la atención médica el personal refiere estar inmerso en sus tareas laborales, reconoce que los adolescentes requieren de una atención dirigida , sin embargo , concluye que el tiempo laboral no les permite brindar una atención con calidad a los y las adolescentes por la excesiva carga de trabajo y por las metas que la institución les pide, en un esquema de eficiencia pragmática lo que se requiere es &quot;despachar&quot; y contabilizar pacientes , un médico señala al respecto:</p><p>&quot;No, yo creo que como somos el primer enfoque la primera relación yo creo que sería muy importante que nosotros le diéramos algo más, más conocimiento , más armas al &quot;jovencito&quot; para que sepa más sobre la sexualidad y ya si a el le interesa saber más o adentrarse a lo que tenga más inquietud y que no sea suficiente lo que le digamos nosotros pues entonces tendría que ir a una temática de grupo&quot; (Médico Sergio}.</p><p>La falta de sensibilidad del personal médico los lleva a una postura paternalista que más allá de proteger o enseñar, más bien el trato es de reprimir y juzgar lo que lleva a regaños y/o a una atención superficial. A partir de este modo de trato los y las 184</p></div><div class='page-block'><span class='page-marker'>📄 Página 193 del PDF original (Tesis UACM):</span><p>adolescentes exigen que en el Centro de Salud haya personal capacitado con interés y compromiso de escucha de necesidades y resolución de dudas.</p><p>El ejercicio institucional trata a los y las adolescentes como sus subordinados, no permitiendo un acercamiento positivo en la atención sobre sexualidad , y aunque los adolescentes lo identifican terminan por aceptarlo.</p><p>Menéndez (1993), señala que esto se debe a los factores económico-políticos que son determinantes en la constitución de las formas de estratificación social dominantes, pero el reconocimiento de esto no debe conducir a considerar como subordinados ni determinados a los procesos ideológicos y culturales que intervienen en el proceso sa !ud/enfermedad/atención.</p><p>Los conceptos de hegemonía/subalternidad , así como otros procedentes de diferentes corrientes teóricas, asumen la existencia de desigualdades estratificadas, pero incluyendo como parte sustantiva de las mismas a los procesos socioculturales que operan favoreci endo la cohesión/integración , opacando las causales que establecen las desigualdades o promoviendo procesos de oposición o de otro tipo de transacciones , que posibilitan el desarrollo autónomo de sectores subalternos.</p><p>185</p></div><div class='page-block'><span class='page-marker'>📄 Página 194 del PDF original (Tesis UACM):</span><p>Limitación de capacidades</p><p>El personal impone prejuicios y valores personales en la atención . Etiquetan a los y las adolescentes a partir de un estereotipo socialmente negativo; por su condición de clase , apariencia o edad.</p><p>&quot;Me regañó el doctor la otra vez pero estuvo bien . Porque, dice que si sabía, que</p><p>me dolían los ovarios y que si sabía dónde estaban los</p><p>ovarios, pero me dijo que tenía una infección urinaria&quot; (Ana).</p><p>El trabajador de la salud cuenta con el recurso
