pecial importancia la opinión de los amigos, la aceptación del liderazgo, y el soporte del grupo, que se eleva por encima de cua lquier otra relación. Se desarrolla en suma , el concepto de sí mismo , es decir el conocimiento que tiene el joven de los valores, hechos o experiencias referidas al propio yo (Cutillas, 2002).</p><p>En la adolescencia comienza un periodo de búsqueda de identidad, de contradicciones, de confusión y/o ambivalencia un periodo doloroso caracterizado por fricciones familiares y sociales. Ello, aunado la desidealización de las figuras parentales, hunde al adolescente al profundo desamparo, ya que las vinculaciones afectivas con los padres permanecen vigentes sólo hasta la adolescencia , en donde, de acuerdo con Peter Blos (1975), se presenta un segundo periodo de individualización en el que hay un nuevo desarrollo del concepto de sí mismo. Lo anterior lo vemos en nuestro contexto, a los y las adolescentes se les asigna o etiqueta con un rol o personalidad de rebeldes, inmaduros e irresponsables y tanto es la repetición de este mensaje que en el 15</p></div><div class='page-block'><span class='page-marker'>📄 Página 24 del PDF original (Tesis UACM):</span><p>adolescente realmente se lo cree y adopta dicho papel, pero más que nada lo hace también en son de rebeldía , implícitamente grita que es todo lo contrario y desea atención .</p><p>En</p><p>la</p><p>socialización</p><p>secundaria</p><p>de</p><p>acuerdo</p><p>a</p><p>Berger</p><p>y</p><p>Luckman,</p><p>(www .scribd.com/berger-luckman, consultada 04 mayo 2011) es la introducción a otros</p><p>ámbitos nuevos del mundo objetivo de su sociedad, llámese institución escolar, social, de salud, etcétera , por lo que los y las adolescentes previamente ya han internalizado su mundo en la sociedad primaria , y aunque ahora se enfrenta a otra experiencia que de igual forma internalizará pero siempre de acuerdo con sus valores ya existentes. Es cuando los adolescentes se topan con obstáculos, pues se enfrentan a muchos cambios y condiciones desconocidas para ellas y ellos.</p><p>En la socialización secundaria los y las adolescentes experimentan la externalización , y no es más que transmitir lo ya internalizado, demuestra todas sus ideas, pensamientos, acciones, creencias, costumbres, etcétera . Luego , para demostrarse tal cual ante la familia y sociedad , muchas veces son criti cados y juzgados, ya que sus pensamientos e ideales no concuerdan con lo estab lecido socialmente.</p><p>Ante todos los cambios por los que pasan los y las adolescentes, un ámbito sumamente controvertido , son los riesgos sociales y de salud que enfrentan estos jóvenes en su sexua lidad y salud reproductiva , por lo que la opinión de Weeks (1983) es ilustrativa :</p><p>16</p></div><div class='page-block'><span class='page-marker'>📄 Página 25 del PDF original (Tesis UACM):</span><p>&quot;la sexualidad no es una olla de vapor que debemos tapar porque nos puede destruir; tampoco es una fuerza vital que debemos liberar para salvar a nuestras civilizaciones. Más bien debemos cobrar conciencia de que la sexualidad es un resultado de distintas prácticas sociales que dan significado a las actividades humanas, de definiciones sociales y autodefiniciones, de luchas entre quienes tienen el poder para definir y reglamentar contra quienes se resisten. La sexualidad no es un hecho dado, es un producto de negociación, lucha y acción humanas&quot;.</p><p>1. 3. 3. Psicología</p><p>De acuerdo con Dávila (2005), conceptualmente la adolescencia se constituye como campo de estudio dentro de la psicología evolutiva , de manera reciente, pudiendo asignarse incipientemente sólo a finales del siglo XIX y con mayor fuerza a principios del siglo XX , bajo la influencia del psicólogo norteamericano Stan ley Hall ( 1904) la adolescencia es una etapa especialmente dramática y tormentosa en la que se producen innumerables tensiones, con inestabilidad, entusiasmo y pasión , en la que los</p><p>y las adolecentes se encuentran divididos entre tendencias opuestas. Además, la adolescencia supone un corte profundo con la infancia , es como un nuevo nacimiento (tomando esta idea de Rousseau ) en la que el joven adquiere los caracteres humanos más elevados (Delval, 1998).</p><p>Los comportamientos que reflejan los y las adolescentes en el ámbito escolar, van desde problemas de aprendizaje y los trastornos nutricionales (anorexia , obesidad, bulimia) aparentemente simples, hasta otros problemas tales como los emocionales. Se 17</p></div><div class='page-block'><span class='page-marker'>📄 Página 26 del PDF original (Tesis UACM):</span><p>considera que 4 de cada 10 en algún momento se sienten tristes y llegan a llorar y han deseado alejarse de todo y de todos, esto se puede considerar una leve depresión, en algunos de los casos llega a agravarse e incluso deriva en conductas suicidas. pueden aparecer fobias y ataques de pánico.</p><p>También existen problemas conductuales; los y las adolescentes y sus familias suelen quejarse cada uno de la conducta del otro. Aberastury ( 1992), dice: &quot;el pensamiento del adolescente está determinado por un proceso de triple duelo, duelo por la pérdida del cuerpo infantil, duelo con la pérdida del rol y de la identidad infantil que lo obliga a enunciar a la dependencia y una aceptación de respuestas que muchas veces desconoce y el duelo por la pérdida de los padres infantiles&quot;.</p><p>Retomando el sentir en la adolescencia, los y las adolescentes pad ecen frecuentes y bruscas oscilaciones del ánimo como consecuencia de la pérdida de la identidad infantil; existe en el adolescente el deseo y el deber de la independ encia pero a la vez el desconocimiento de cómo dejar de depender y cómo superar los duelos. En ocasiones, la persistencia de síntomas alarmantes puede hacer pensar en un trastorno depresivo importante. En general , se trata de crisis melancólicas destinadas a remitir espontáneamente. Sin embargo, los padres preocupados o desesperados por dichas crisis optan por buscar ayuda profesional y el adolescente se ve inmerso en terapia ya sea psicológica o psiquiátrica, decisión que la mayor de las veces no es muy bien aceptada por los y las adolescentes.</p><p>18</p></div><div class='page-block'><span class='page-marker'>📄 Página 27 del PDF original (Tesis UACM):</span><p>En lo cotidiano y en el contexto social como escolar, los y las adolescentes buscan, con o sin conocimiento de causa , una actividad ideal para ellos, el deporte es una excelente ocasión para socializar y también pa ra evadirse del medio familiar y sobre todo , librarse de las supervisión de los padres, liberar energías y descargar su carácter agresivo o cambiante ; por ello la práctica de algún deporte es importante para el desarrollo progresivo, armónico y completo de los mismos, ya que la actividad e interacción con los otros adolescentes y adu ltos influye en la estructuración de su pe rsonalidad y por ende en su proceso madurativo.</p><p>Los estudios recientes han demostrado que los problemas emocionales de los y las adolescentes no suelen ser reconocidos ni siquiera por sus familiares o amigos.</p><p>1. 3. 4. Médico -biológica</p><p>Desde el punto de vista médico la adolescencia puede ser abordada como la etapa de maduración entre la niñez y la condición de adulto. En este sentido , el término denota el periodo desde el inicio de la pubertad hasta la madurez, y suele empezar en torno a la edad de catorce años en los varones y de doce años en las mujeres. Aunque esta etapa de transición varía entre las diferentes culturas, en general se define como el periodo de tiempo que los individuos necesitan para considerarse autónomos e independientes socialmente.</p><p>El comienzo de la pubertad está asociado en algunos casos con cambios muy notorios en la estatura y en los rasgos físicos . En este momento, la actividad de la hipófisis 19</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Identidad en Conflicto (Aberastury y Blos)</h3>\n<blockquote class=\"quote\">«Armida Aberastury (1992) aplica el término adolescencia al período en que el joven atraviesa por desequilibrios e inestabilidades extremas para establecer su identidad... Peter Blos (1975) señala que se presenta un segundo periodo de individuación en el que hay un nuevo desarrollo del concepto de sí mismo a través del desamparo generado por la desidealización de los padres» (p. 7, 15).</blockquote>\n\n<h3>2. Los Tres Duelos Fundamentales</h3>\n<ol>\n  <li>Duelo por el cuerpo infantil perdido.</li>\n  <li>Duelo por el rol y la identidad de niño protegido.</li>\n  <li>Duelo por la omnipotencia de las figuras parentales.</li>\n</ol>\n<p>El regaño médico intensifica la rebeldía del joven, alejándolo del autocuidado y empujándolo a prácticas de riesgo desafiantes.</p>\n</div>", "links": ["VULNERABILIDAD_BIO", "CONSTRUCCION_SOCIAL", "ANTROPOLOGIA_SOCIOLOGIA"]}, {"id": "METODOLOGIA_MIXTA", "title": "Metodología Mixta del Estudio en C.S. T-III", "group": "ciencia", "badge": "Entorno de la Ciencia", "color": "#7b2cbf", "pages": "Págs. 130-136", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 130 del PDF original (Tesis UACM):</span><p>•</p><p>¿Qué tipo de prácticas de promoción de la salud en materia de Educación Sexual se llevan a cabo en el Centro de Salud T-111 Dr. Maximiliano Ruíz Castañeda?</p><p>•</p><p>¿Cómo perciben los adolescentes la educación sexual institucional otorgada por el personal de salud del C. S. T-111 Maximiliano Ruiz Castañeda?</p><p>5. 2. Hipótesis</p><p>Las prácticas de promoción de la salud en los Centros de Salud promueven una educación sexual culpabilizadora , recriminante y violenta, aspectos que limitan las capacidades humanas de los y las adolescentes, principalmente; la sapiens (pensar), la erótica (sentir) y la política (decidir).</p><p>5. 3. Tipo de estudio</p><p>En esta investigación el tipo de estudio es descriptivo transversal. Se decidió hacer uso de la metodología cualitativa, ya que es un proceso en el cual se plantea el cómo recoger datos descriptivos, lo que me da la valiosa oportunidad de nombrar &quot;palabras&quot; y mirar &quot;conductas&quot;.</p><p>Una parte de esta investigación se conforma de metodología cuantitativa debido a que se hace uso de la estadística descriptiva para recabar información socio-demográfica. No obstante cabe aclarar que la mayor predominancia de enfoque es el de la 122</p></div><div class='page-block'><span class='page-marker'>📄 Página 131 del PDF original (Tesis UACM):</span><p>metodología cualitativa, por el tipo de estudio, ya que el objetivo que se plantea en dicha investigación es como bien lo define Álvarez-Gayou (2004 ), una &quot;descripción densa&quot;, una &quot;comprensión experiencia &quot; y &quot;múltiples realidades&quot;.</p><p>5. 4. Técnicas e instrumentos para la recolección de información y universo de trabajo</p><p>a) Investigación documental La recopilación teórica se basó en fuentes documentales tanto bibliográficas como hemerográficas, así mismo se realizó investigación documental, consulta de archivos y algunos expedientes médicos.</p><p>b) Investigación de campo Observación no participante: Se utilizó como instrumento la guía de observación, para mirar específicamente al grupo de adolescentes cuando acuden al servicio y cómo son atendidos por el personal de salud , cómo es la interacción, qué es lo que dicen en sus discursos explícita</p><p>e</p><p>implícitamente cuando</p><p>son</p><p>abordados, cuál es</p><p>su</p><p>comportamiento , actitudes, posturas, gestos, es decir, lo corporeizado. Lo obtenido se registró de manera sistemática .</p><p>Durante el proceso señalado observé de manera cuidadosa , para no ser notada con el propósito de que mi presencia no influyera en las formas de atención, por parte del personal de salud, a los y las adolescentes. El objetivo era identificar comportamientos cotidianos de todos los sujetos de la investigación en su ambiente natural sin la 123</p></div><div class='page-block'><span class='page-marker'>📄 Página 132 del PDF original (Tesis UACM):</span><p>presencia de variables extrañas. En un principio , esto me permitió tomar nota de las actitudes y posturas corporales que los adolescentes tienen cuando se acercan al centro de salud .</p><p>Después de los primeros cuatro días consecutivos en el centro de salud, el personal empezó a notar mi presencia , por lo que procedieron a indagar el motivo de mi presencia y en automático cambiaron su forma de actuar dando un trato mejor a los pacientes, no tardaron mucho en darse cuenta y confirmar que mi presencia era con motivo de un trabajo de investigación escolar, lo que entendieron como algo favorable para su lugar de trabajo y desde luego que harían todo lo posible por mostrar algo positivo del centro de salud .</p><p>Encuesta : Esta técnica se utilizó como instrumento el cuestionario con el fin de recabar</p><p>datos socio-demog ráficos de los y las adolescentes así como información de los conocimientos obtenidos en el centro de salud con respecto a la salud sexual y reproductiva.</p><p>Entrevistas semi-estructuradas : Están basadas en una guía de entrevistas como</p><p>instrumento aplicado directamente a los y las adolescentes, de tal manera que permite que ellos respondan a su manera y con su propia perspectiva de las cosas. En todo momento del proceso se adopta una postura abierta y pendiente de todos los minimos y máximos detalles de informa ción verbal y corporal (registrados en el diario de campo) que pueden ser relevantes y que den entrada a puntos clave en las conversaciones; sin</p><p>124</p></div><div class='page-block'><span class='page-marker'>📄 Página 133 del PDF original (Tesis UACM):</span><p>dejar de lado la parte objetiva mostrándose en todo momento sensible y flexible en el proceso.</p><p>Grupos de reflexión: Son también llamados grupos de enfoque. Consiste en la formación de un grupo de adolescentes que interactúan conversando en torno a su concepto de educación sexual y compartiendo experiencias de trato que han recibido por parte del personal de salud cuando acuden al centro de salud T-111 Dr. Maximiliano Ruiz Castañeda , ya sea a consulta médica , de planificación familiar y/o a solicitar métodos anticonceptivos (de manera informal) e información de salud sexual.</p><p>5. 5. Universo de trabajo</p><p>Un grupo de adolescentes (mujeres y hombres) de acuerdo con una muestra probabilística que oscilan entre los 15 y 19 años de edad y personal médico, de enfermería , trabajo social y administrativos del Centro de Salud T-111 Dr. Ma ximiano Ruíz Castañeda .</p><p>5. 6. Muestra</p><p>De acuerdo con los criterios de selección, no todos los sujetos tenían la misma posibilidad de ser seleccionados para los objetivos del estudio, por esto el tipo de muestra es no probabilístico, lo cual implica que los criterios de selección pueden parecer arbitrarios y un tanto informales (Sampieri , 2002). En este sentido se optó por la muestra de sujetos voluntarios . En la investigación cualitativa no interesa la cantidad 125</p></div><div class='page-block'><span class='page-marker'>📄 Página 134 del PDF original (Tesis UACM):</span><p>de los sujetos sino los datos cualitativos que los mismos pueden aportar para el estudio, así los voluntarios fueron 60 adolescentes entre 15 y 19 años que habían solicitado los servicios relacionados con educación sexual en el Centro de Salud T-111 Dr. Maximiliano Ruíz Castañeda durante enero a octubre de 2010 .</p><p>La elección de una muestra dirigida obedece a las condiciones de la investigación, se determinó este tipo de muestra por las dificultades que generó la entrada como investigadora a los centros de salud y la resistencia que genera en las autoridades a cargo de las instituciones para conocer la opinión de los usuarios respecto de los servicios de salud . La determinación del número de sujetos entrevistados se realizó a partir de la metodología de saturación discursiva , lo cual implica un agotamiento en la obtención de datos, en donde se rescatan significaciones extremas de la población entrevistada , así desde los discursos de los sujetos se analizan los elementos más importantes para dar respuesta a los objetivos de la investigación.</p><p>5. 7. Criterios de selección</p><p>Los criterios de selección fueron que los y las adolescentes tuvieran entre 15 y 19 años que vivieran en Santa Martha Acatitla , colonia del área de influencia del centro de salud que fueran personas que habían asistido por primera vez o de manera subsecuente a servicios de educación sexual los cuales podían ser; asesoría , consejería , planificación familiar o control de embarazo durante enero a octubre de 2010 . Se sabe que el muestreo no probabilístico no impide que los resultados obtenidos en la unidad de observación seleccionada (Centro de Salud T-111 Dr. Maximiliano Ruíz Castañeda) 126</p></div><div class='page-block'><span class='page-marker'>📄 Página 135 del PDF original (Tesis UACM):</span><p>puedan generalizarse a todos los centros de salud del país. Sin embargo, intenta evidenciar una práctica en salud que tiene elementos estructurales y que por lo tanto puede mostrar los elementos más relevantes para el análisis de los resultados .</p><p>5. 8. Procedimiento (Descripción del trabajo con el grupo de reflexión)</p><p>Marco metodológico de los talleres</p><p>La presente investigación cualitativa parte del objetivo de identificar y analizar el modelo médico-hegemónico de la ed ucación sexual y las prácticas de promoción de la salud efectuada en la atención a los y las adolescentes ente 15 y 19 años de edad que viven en el pueblo de Santa Martha Acatitla colonia del área de influencia del Centro de Salud</p><p>T-111 Dr. Maximiliano Ruíz Castañeda .</p><p>Así los resultados de la investigación permiten identificar las prácticas del personal de salud en torno a la educación sexual y reproductiva de los y las adolescentes para conocer sí ejercen o no sus ca pa cidades humanas a partir de la forma en que se concibe la promoción de la salud sexual en las instituciones de salud . La ruta metodológica para dar respuesta a las preguntas de investigación parte de la observación no participante como instrumento para mirar es pecíficamente a los y las adolescentes cuando estos acuden al Centro de Salud y saber cómo y cuál es su interacción con el personal de salud .</p><p>127</p></div><div class='page-block'><span class='page-marker'>📄 Página 136 del PDF original (Tesis UACM):</span><p>La conformación de un grupo de reflexión consiste en la formación de un grupo de adolescentes que interactúan conversando, reflexionando en torno a su concepto de educación sexual; compartiendo experie ncias respecto al trato que han recibido por parte del personal de salud; las formas en que se decide sobre el método de anticoncepción; la percepción sobre los servicios de salud y su visión respecto a las prácticas educativas de sexualidad y salud reproductiva .</p><p>Se diseñaron y aplicaron seis talleres para obtener información y dar respuesta a las preguntas de investigación planteadas en el presente trabajo . Los propósitos de todos los talleres se enfocaron a indagar sobre la forma que el personal de salud brinda educación sexua l a los y las adolescentes y como ésta afecta el ejercicio de sus capacidades humanas. Se llevaron a cabo dinámicas que favorecieron la sensibilización y participación de los y las adolescentes.</p><p>Las herramientas didácticas son los instrumentos prácticos que facilitan el aprendizaje y ayudan a que se logren los objetivos propuestos fomentando la reflexión, en el grupo mismo y en la comprensión de los contenidos, mediante un proceso educativo de adolescente a adolescente en un espacio pedagógico que favorece la curiosidad, creatividad, resolución y decisión de incluir y ampliar su contexto individual y colectivo. En torno a los temas abordados se efectuaron plenarias en conjunto, discusiones grupales,</p><p>medios audiovisuales , mesas de discusión, intercambio de saberes,</p><p>realización de lecturas, medios por los cuales los y las adolescentes construyen conocimiento que resignifiquen a partir de lo deconstruido.</p><p>128</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Triangulación Metodológica (Capítulo 5)</h3>\n<blockquote class=\"quote\">«El estudio es descriptivo porque especifica situaciones y eventos, describe las prácticas de promoción que el personal de salud ofrece a los adolescentes... Para recabar datos socio-demográficos se diseñó un cuestionario aplicado a 60 adolescentes dentro de la consulta médica, enfermería, trabajo social y sala de espera... complementado con entrevistas semiestructuradas y un grupo de reflexión que aportó una interacción rica de experiencias» (p. 5).</blockquote>\n\n<h3>2. Fases de la Investigación</h3>\n<ul>\n  <li><strong>Fase Cuantitativa:</strong> Muestra representativa de 60 adolescentes (39% mujeres de 15-17 años, 28% de 18-19, 20% hombres de 18-19 y 13% de 15-17).</li>\n  <li><strong>Fase Cualitativa:</strong> Entrevistas a médicos generales, enfermeras y trabajadoras sociales del centro.</li>\n  <li><strong>Fase Participativa:</strong> 4 sesiones de taller dialógico donde se validó la propuesta emancipatoria.</li>\n</ul>\n</div>", "links": ["PARADIGMAS_CIENCIA", "CUALITATIVO_SOCIO", "ESI_EMANCIPATORIA"]}, {"id": "CONSTRUCCION_SOCIAL", "title": "La Adolescencia como Construcción Social", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 20-24", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 20 del PDF original (Tesis UACM):</span><p>inequidad de género se articulan de muy diversas maneras para producir un estado de vulnerabilidad social en grandes sectores de nuestra población (Sánchez, 1999).</p><p>Se puede concluir que los y las adolescentes se construye a partir de una serie de referentes históricos, sociales y culturales permeando pensamientos, acciones y ubicándolo en una dimensión biológica , psicológica, simbólica y social. Los valores , las emociones, sus necesidades, sus comportamientos serán confeccionados a partir de arbitrarios culturales impuestos desde la agencia de poder.</p><p>1. 3. La adolescencia como campo de estudio desde diversas disciplinas</p><p>No hay teorías fáciles con que podamos definir la adolescencia , desde las diversas perspectivas teóricas e inclusive en un mismo campo disciplinar se encuentran diversas posiciones y explicaciones considerando que parten desde distintos paradigmas explicativos. A continua ción se presenta de manera breve lo que la adolescencia significa en tres campos de estudio: social, comportamental y biológico.</p><p>1. 3. 1. Antropología social</p><p>De acuerdo con los estudios antropológicos, entre los individuos existen grandes diferencias supeditadas a la cultura en la cual fueron socializados en aspectos tales como métodos de crianza , restricciones y limitaciones impuestas a la juventud, y en general, en las formas de condicionamiento social acompañado de valores y normas sociales. 12</p></div><div class='page-block'><span class='page-marker'>📄 Página 21 del PDF original (Tesis UACM):</span><p>Algunos autores consideran que en el medio rural , la cultura es más homogénea, por lo que pueden esperarse mayores similitudes en la actitud de los adolescentes al ser más limitadas sus oportunidades de elección. Por eso, el conocimiento de su medio y de su pensamiento hace su conducta más fácil de predecir, a diferencia de los jóvenes que habitan las ciudades, donde existen menores semejanzas (Cerruti, 1992).</p><p>Esta diferencia puede explicarse por lo siguiente:</p><p>a) La heterogeneidad de la cultura , que puede ser ocasionada por las múltiples subculturas que se interceptan.</p><p>b) La transmisión de información entre diversas zonas geográficas que hace la cultura más dinámica .</p><p>e) La amp litud y variedad de los antecedentes cu lturales.</p><p>Los y las adolescentes que viven en las sociedades más avanzadas se enfrentan a la llamada urbanización-tecnología y por ende a la centra lización lo que en algunos casos conlleva a oportunidades y acceso de trabajo, escuela , cultura, servicio médico, etcétera , durante su etapa escolar se le dijo que mediante el estud io y la formación obtendrá un medio de vida cómodo, sin embargo, experimentan dificultades por no tener cabida en espacios y tiempos de trabajo remunerado para llegar a ser autosuficientes. Lo anterior desencadena el alto índice de deserción escola r, luego entonces, el desempleo aumenta . 13</p></div><div class='page-block'><span class='page-marker'>📄 Página 22 del PDF original (Tesis UACM):</span><p>1. 3. 2. Sociología</p><p>En las sociedades occidentales complejas, caracterizadas por súbitos cambios tecnológicos y sociales, los y las adolescentes se encuentran frente a múltiples alternativas hacia las cuales orientar sus vidas. Esto reduce las posibilidades de que sus expectativas concuerden con las de sus padres, dado que ambos crecieron en medios con distinta estimulación ambiental , y en ocasiones, con distintos valores .</p><p>Para visualizar de manera objetiva el comportamiento de los y las adolescentes es importante entender cómo se da el proceso de la socialización. Se interioriza mediante la interacción con los diferentes agentes en la sociedad primaria , en donde la familia y la escuela, principalmente , juegan un papel importante, por lo que los y las adolescentes asumen un sentido común, que es construido mediante las ideas e imágenes que tienen en la conciencia , de acuerdo con la esfera de su realidad y de cómo va n asimilándose, pero sobre todo , del sentir que experimentan de una vivencia a otra, por lo que le causa expectativa en un estado natural, y luego entonces, su vida cotidiana es un proceso por el cual hay una serie de acciones y pensamientos que simplemente deben de &quot;asumir&quot;, estén o no de acuerdo con ellos, simplemente por el hecho de se r normativas socialmente.</p><p>El tiempo también constituye la vida cotidiana, ya que en todo momento de la existencia de los y las adolescentes están inmersos los hechos pasados y los mantienen como referencia . De lo anterior, la importancia del papel fundamental que representa la familia y los valores que se le haya internalizado en su niñez. Aquí entran las &quot;conmutaciones&quot; 14</p></div><div class='page-block'><span class='page-marker'>📄 Página 23 del PDF original (Tesis UACM):</span><p>producidas entre el mundo de la vida cotidiana y el mundo de los juegos de los jóvenes. De repente se transportan a otra dimensión, crean un mundo propio con actores y ambientes de ficción donde todo es como lo desean, son sumamente fantasiosos; pero todas estas experiencias son momentáneas. Lo que da paso a diversas situaciones que sobre la marcha van definiendo.</p><p>Las relaciones con el mundo en general, cambian de signo y así, los y las adolescentes empieza n a preguntarse sobre la autoridad de los adultos en general , de los padres y profesores en particular, desarrollan una gran sensibilidad con respecto de lo justo y lo injusto, su mirada se vuelve crítica con cuanto le rodea , en las que cob ra especial importancia la opinión de los amigos, la aceptación del liderazgo, y el soporte del grupo, que se eleva por encima de cua lquier otra relación. Se desarrolla en suma , el concepto de sí mismo , es decir el conocimiento que tiene el joven de los valores, hechos o experiencias referidas al propio yo (Cutillas, 2002).</p><p>En la adolescencia comienza un periodo de búsqueda de identidad, de contradicciones, de confusión y/o ambivalencia un periodo doloroso caracterizado por fricciones familiares y sociales. Ello, aunado la desidealización de las figuras parentales, hunde al adolescente al profundo desamparo, ya que las vinculaciones afectivas con los padres permanecen vigentes sólo hasta la adolescencia , en donde, de acuerdo con Peter Blos (1975), se presenta un segundo periodo de individualización en el que hay un nuevo desarrollo del concepto de sí mismo. Lo anterior lo vemos en nuestro contexto, a los y las adolescentes se les asigna o etiqueta con un rol o personalidad de rebeldes, inmaduros e irresponsables y tanto es la repetición de este mensaje que en el 15</p></div><div class='page-block'><span class='page-marker'>📄 Página 24 del PDF original (Tesis UACM):</span><p>adolescente realmente se lo cree y adopta dicho papel, pero más que nada lo hace también en son de rebeldía , implícitamente grita que es todo lo contrario y desea atención .</p><p>En</p><p>la</p><p>socialización</p><p>secundaria</p><p>de</p><p>acuerdo</p><p>a</p><p>Berger</p><p>y</p><p>Luckman,</p><p>(www .scribd.com/berger-luckman, consultada 04 mayo 2011) es la introducción a otros</p><p>ámbitos nuevos del mundo objetivo de su sociedad, llámese institución escolar, social, de salud, etcétera , por lo que los y las adolescentes previamente ya han internalizado su mundo en la sociedad primaria , y aunque ahora se enfrenta a otra experiencia que de igual forma internalizará pero siempre de acuerdo con sus valores ya existentes. Es cuando los adolescentes se topan con obstáculos, pues se enfrentan a muchos cambios y condiciones desconocidas para ellas y ellos.</p><p>En la socialización secundaria los y las adolescentes experimentan la externalización , y no es más que transmitir lo ya internalizado, demuestra todas sus ideas, pensamientos, acciones, creencias, costumbres, etcétera . Luego , para demostrarse tal cual ante la familia y sociedad , muchas veces son criti cados y juzgados, ya que sus pensamientos e ideales no concuerdan con lo estab lecido socialmente.</p><p>Ante todos los cambios por los que pasan los y las adolescentes, un ámbito sumamente controvertido , son los riesgos sociales y de salud que enfrentan estos jóvenes en su sexua lidad y salud reproductiva , por lo que la opinión de Weeks (1983) es ilustrativa :</p><p>16</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Desnaturalización de la Adolescencia (Capítulo 1.2)</h3>\n<blockquote class=\"quote\">«La adolescencia es una construcción social... no todos los grupos humanos han vivido la adolescencia de la misma forma; está determinada por la inserción laboral, la clase y la cultura. A los adolescentes se les asigna o etiqueta con un rol de rebeldes e inmaduros... tanto es la repetición de este mensaje que el adolescente lo adopta» (p. 12, 15).</blockquote>\n\n<h3>2. La Realidad Popular en Iztapalapa</h3>\n<p>En sectores urbanos marginados, la supuesta 'moratoria social' para solo estudiar se rompe tempranamente por el trabajo informal, el embarazo precoz o el apoyo al sostenimiento del hogar.</p>\n</div>", "links": ["TERRITORIO_IZTAPALAPA", "ANTROPOLOGIA_SOCIOLOGIA", "GENERO_PODER"]}, {"id": "TERRITORIO_IZTAPALAPA", "title": "Territorio, Demografía y Marginación en Iztapalapa", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 110-116", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 110 del PDF original (Tesis UACM):</span><p>CAPÍTULO 4 Antecedentes históricos del área de estudio</p><p>En este capítulo se presenta una breve reseña de la delegación lztapalapa la cual resalta los campantes sociales, políticos y económicos de su población , dicha información se obtuvo del Archivo Histórico de lztapalapa que se encuentra en la Plaza Cuitláhuac en el centro de dicha delegación.</p><p>4. 1. Delegación de lztapalapa</p><p>Actualmente la Delegación lztapalapa está ubicada al oriente del Distrito Federal, presenta una posición geográfica importante, ya que es el punto de entrada y salida hacia el oriente y sureste del país, además de ser limítrofe con el Estado de México, lo que genera una interrelación de servicios, equipamiento, transporte y actividad económica cotidiana con los municipios de Nezahualcóyotl , Los Reyes-La Paz y Chalco Solidaridad , los que representan una población cercana a los tres millones de habitantes.</p><p>Con respecto al Distrito Federal, la colindancia al poniente con delegaciones netamente urbanas como son lztacalco, Benito Juárez y Coyoacán , permiten una continuidad de servicios, equipamiento y una red vial fluida , no así con las delegaciones de Tláhuac y Xochimilco en la que si bien los servicios están interrelacionados, la estructura vial es escasa y deficiente.</p><p>102</p></div><div class='page-block'><span class='page-marker'>📄 Página 111 del PDF original (Tesis UACM):</span><p>Los servicios de carácter regional comercial más importante de la delegación es la central de abastos.</p><p>Con lo que respecta a las instituciones de educación media superior y superior son las siguientes:</p><p>Preparatoria &#x27;lztapalapa 1&#x27; del Instituto de Educación Media Superior del D.F. Preparatoria &#x27;Benito Juárez&#x27; del Instituto de Educación Media Superior del D.F. Colegio de Ciencias y Humanidades Plantel Oriente (CCH-0 ) de la Universidad Nacional Autónoma de México (UNAM). Centro de Estudios Científicos y Tecnológicos 7 &quot;Cuauhtémoc&quot; (CECyT &quot;Voca&quot; 7) del Instituto Politécnico Nacional (IPN). Colegio de Bachilleres Plantel No.6 &quot;Vicente Guerrero&quot;. Colegio de Bachilleres Plantel No.? &quot;lztapalapa&quot; . Centro de Estudios Tecnológicos Industrial y de Servi cios No. 53 (CETIS ). Centro de Estudios Tecnológicos Industrial y de Servicios No. 50 (CETIS). Fa cultad de Estudios Superiores Zaragoza (FES-Z) de la Universidad Nacional Autónoma de México (UNAM). Universidad Autónoma de la Ciudad de México (UACM ) Casa Libertad y San Lorenzo. Tezonco. Universidad Autónoma Metropolitana-lztapalapa (UAM-1 ).</p><p>Los pobladores de dicha delegación generan un gran núm ero de viajes diarios a la misma y un importante flujo de población flotante, que se apoya en cuanto a vialidad en importantes avenidas que la comunican , éstas son : Anillo Periférico arco oriente, 103</p></div><div class='page-block'><span class='page-marker'>📄 Página 112 del PDF original (Tesis UACM):</span><p>Circuito Interior, Calzada Ermita lztapalapa y Calzada Ignacio Zaragoza, además de contar con 11 ejes viales y 2 líneas del metro.</p><p>Administrativamente, la delegación de lztapalapa se encuentra dividida en</p><p>9</p><p>coordinaciones territoriales, que a su vez se subdividen en unidades territoriales. Dado el tamaño tanto en</p><p>superficie como en población de lztapalapa, se divide</p><p>administrativamente en nueve coordinaciones territoriales de seguridad pública, que se subdividen a su vez en unidades territoriales, como puede apreciarse en el siguiente mapa. División administrativa por coordinación y unidad territorial</p><p>Fuente: www.iztapalapa.gob.mx</p><p>104</p></div><div class='page-block'><span class='page-marker'>📄 Página 113 del PDF original (Tesis UACM):</span><p>4. 2. Composición de la población</p><p>La base de la pirámide poblacional de lztapalapa presenta diferencias con respecto del Distrito Federal , ya que lztapalapa tiene una mayor cantidad de hombres entre los O y 29 años y de mujeres entre los O y los 34 años; lo que representa una población en general más joven en lztapalapa que en el Distrito Federal. Esta delegación en su conjunto tiene una población de un millón 820 mil habitantes, aspecto que se conside rará en la estructura de los programas de salud, en donde gran parte de los mismos van dirigidos a la población joven.</p><p>Considerando el porcentaje de población con 24 años o menos encontramos que es al oriente de la delegación donde se concentra el mayor porcentaje: entre 50% y 60%, es decir uno de cada dos habitantes de la delegación tiene 24 años o menos. Datos que se representan en la siguiente pirámide poblacional:</p><p>lOS</p></div><div class='page-block'><span class='page-marker'>📄 Página 114 del PDF original (Tesis UACM):</span><p>Pirámide Poblacional lztapalapa, 2008</p><p>85YMAS 80-34 AÑOS Th-79 AÑOS 70-74 AÑOS 65-69AÑOS</p><p>Mujeres</p><p>Hombres</p><p>n=953241 51.30%</p><p>n=904758 48.69%</p><p>60-S4AÑOS</p><p>32167</p><p>S&gt;fl:lAÑOS</p><p>42869 54341 63946</p><p>50-54 AÑOS 4~9AÑOS</p><p>40-«AÑOS 3~39AÑOS</p><p>30-:WAÑOS</p><p>85145</p><p>2~29AÑOS</p><p>86868</p><p>20-24AÑOS</p><p>85196</p><p>85772</p><p>&#x27;6-1lAÑOS ll-14 AÑOS ~9AÑOS</p><p>1-4AÑOS &lt;1</p><p>HABITANTES</p><p>N= 1,857999</p><p>FUENTE: CO NAPO , 2008</p><p>106</p></div><div class='page-block'><span class='page-marker'>📄 Página 115 del PDF original (Tesis UACM):</span><p>El crecimiento demográfico de la Delegación representa una muy alta proporción del incremento total de población del Distrito Federal.</p><p>En la década</p><p>1970-1980,</p><p>correspondió al 54.3% del crecimiento del D.F. En la década 1980-1990, la Delegación tuvo un crecimiento de 341 ,088 habitantes, superior en 1.6 veces al crecimiento total del Distrito Federal, indicando que lztapalapa fue asiento de numerosas familias que abandonaron las delegaciones centrales y destino de familias procedentes de otras entidades federativas (INEGI , 2008).</p><p>4. 3. Aspectos Sociales</p><p>4. 3. 1. Proceso de urbanización El crecimiento de la población de lztapalapa ha traído graves consecuencias para todos sus habitantes desde casi tres décadas ininterrumpidas. En este periodo han surgido muchas organizaciones populares que reclaman la dotación de servicios urbanos en zonas de reciente ocupación; y desde fines de los años setenta , lztapalapa es sede de varios grupos populares independientes (Unión de Colonos de San Miguel Teotongo , colonias Ricardo Flores Magón y Emiliano Zapata , Asociación Democrática de Colonos de lztlahuacán , Ampliación Santiago Acahualtepec , San José Aculco , Comuna de Santo Domingo, Guayamilpas y Unión Popular de Colonos. Parte del campamento 2 de octubre se ubica también en esta delegación. La mayoría de las organizaciones autónomas enlistadas está integrada a la regional de la Coordinadora Nacional del Movimiento Urbano Popular (Conamup) en su zonal oriente (Centro de Estudios Demográficos, 1987).</p><p>107</p></div><div class='page-block'><span class='page-marker'>📄 Página 116 del PDF original (Tesis UACM):</span><p>La crisis se agudizó tras el terremoto del 19 de septiembre de 1985, cuando el Departamento del Distrito Federal decidió reubicar a los damnificados en unidades habitacionales de la periferia . Entonces la Ciudad de México y en especial la delegación lztapalapa se urbanizaron en gran medida por la migración ya sea de personas provenientes de provincia, de estados como Oaxaca y el Estado de México. A partir de entonces, lztapalapa ha sufrido desabasto de agua , problemas de transporte , una carente calidad en los servicios educativos y una depauperación visible .</p><p>La población inmigrante se ha asentado en su mayoría al sur oriente de la Delegación, es decir, en las faldas de la Sierra de Santa Catarina , ocupando terrenos sin vocación para usos urbanos.</p><p>4. 3. 2. Seguridad pública y violencia</p><p>En México el problema de la inseguridad ha adquirido especia l releva ncia y se agrava por el deterioro cada vez más agudo del nivel de vida de la población y el incremento de los niveles de hacinamiento urbanos. Otra circunstancia es el dese mpleo, producto de las constantes crisis económicas que ha sufrido nuestro país. El aumento de la delincuencia y la criminalidad va en gran medida en función de las condiciones económicas que sufre el país, al grado de que cuando hay un decremento en el Producto Interno Bruto (PIB) hay un aumento en la delincuencia aproximadamente en la misma proporción y viceversa . Como lo sucedido en 1995, donde el PIB cae cerca de 6% y la criminalidad sube en un 13%. Cuando en las décadas anteriores a 1980, hubo</p><p>108</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Diagnóstico Sociodemográfico (Capítulos 4 y 6)</h3>\n<blockquote class=\"quote\">«La delegación Iztapalapa es la más poblada del Distrito Federal... caracterizada por contrastes socioeconómicos profundos, zonas de alta marginación, carencia histórica de servicios como agua potable y saturación en los centros de salud» (p. 102-116).</blockquote>\n\n<h3>2. Radiografía de la Muestra Encuestada (N=60)</h3>\n<ul>\n  <li><strong>71% depende económicamente de sus familias</strong> (sólo 15% es autosuficiente).</li>\n  <li><strong>82% vive en casa de sus progenitores</strong> en cuartos compartidos sin privacidad.</li>\n  <li><strong>62% son estudiantes</strong>, 10% empleados, 10% estudia y trabaja, 10% desempleados.</li>\n</ul>\n<p>Las condiciones de precariedad material limitan radicalmente los márgenes de autonomía sexual de los adolescentes.</p>\n</div>", "links": ["CONSTRUCCION_SOCIAL", "VULNERABILIDAD_BIO", "BARRERAS_CENTRO_SALUD"]}, {"id": "GENERO_PODER", "title": "Desigualdad de Género y Asimetría Sexual", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 202-206", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 202 del PDF original (Tesis UACM):</span><p>y las adolescentes creen que el personal de salud les hace &quot;un favor&quot; al atenderlos bien o medianamente bien ; no se perciben como sujetos de derecho, y no visualizan que su derecho a la salud establecido en la Constitución Política de los Estados Unidos Mexicanos en su Articulo 4to. que a la letra dice: &#x27;Toda persona tiene derecho a la protección de la salud ...&quot; por lo que dicho derecho está siendo bloqueado o limitado; no cuestionan al respecto y no ejercen su derecho a una atención médica y educación sexual con calidad .</p><p>Aunado a lo anterior y durante el trabajo con el grupo de reflexión con respecto a la atención que se otorga en el centro de salud , los y las adolescentes mencionaron que el personal de salud no los atiende con respeto e interés, dicen sentirse discriminados durante el proceso de atención sobre todo cuando se trata de las adolescentes embarazadas, ante dicho caso solicitan una información objetiva y un chico adolescente señala :</p><p>&quot;Confianza en una información laica, apegada al Estado, para poder quitar conflictos sobre ideologías religiosas o culturales&quot; (Gerardo).</p><p>Los y las adolescentes señalaron que han violado su derecho a una buena atención en el centro de salud , por el simple hecho de ser varones, recalcaron que se les da un mejor trato a las mujeres sea cua l sea el motivo de la asistencia médica , los adolescentes identifican que muchas veces es por la manera de vestir y de peinar, pero sobre todo existe la postura machista de que por naturaleza hay cie rtas cosas sobre la sexua lidad que ya saben . 194</p></div><div class='page-block'><span class='page-marker'>📄 Página 203 del PDF original (Tesis UACM):</span><p>Cabe resaltar que en propia voz de los y las adolescentes durante lo procesos de reflexión del grupo expresaron que cuando la pareja decide tener relaciones sexuales y ella queda embaraza ésta debe ser atendida y tratada como una mujer adulta y darle la importancia que se mere ce, aunque ante el ojo de los demás y de ella misma sea una adolescente, para ellos y ellas el hecho de iniciar su vida sexua l es el haber dado un paso importante en su vida, que automáticamente los convierte en adultos, este pensamiento, al parecer generalizado en nuestra sociedad se ha introyectado a los grupos más vulnerables de nuestra sociedad como son los menores de edad y a los adultos mayores, repitiendo esta ideología de generación en generación.</p><p>Los y las adolescentes hicieron algunas propuestas con respecto a la atención que merece todo adolescente sea hombre o mujer y si ella está o no emba razada el trato debe ser sin distinción alguna .</p><p>&quot;Que se nos trate como adultos, con respeto y tolerancia que se nos de bien la información que solicitamos&quot; (Carmen).</p><p>&quot;Quisiera que me dieran confianza, ser tratada como una persona responsable&quot; (Ericka ).</p><p>Con lo que respecta al trato que desean les dé el personal de salud mencionaron: respeto, confianza , igualdad, tolerancia , trato digno e inclusive uno de ellos mencionó información laica sobre los derechos que nos otorga el Estado, esto nos dice que los chicos perciben prejuicios y valores que el personal de salud antepone en la atención 195</p></div><div class='page-block'><span class='page-marker'>📄 Página 204 del PDF original (Tesis UACM):</span><p>dada, como por ejemplo &quot;que a su edad el sexo es malo&quot; &quot;que no saben lo que quieren&quot; y algunos otro tabús manejados por la sociedad, y por lo tanto no se brinda la atención de manera objetiva, profesional y ética.</p><p>&quot;A mí me gustaría que en el centro de salud respeten los derechos de los jóvenes respecto a pedir información y no sean discriminados por lo mismo (mujeres embarazadas)&quot; (Carmen).</p><p>&quot;Pues saber más sobre el material anticonceptivo y las enfermedades que puedo adquirir o transmitir. Y que me respeten y me traten como tal, aun siendo joven&quot; (lrving).</p><p>Es urgente que la institución de salud modifique la postura de atender a los adolescentes en materia de educación sexual para que se reconozcan como sujetos de derecho y no se les estereotipe negativamente por ser adolescentes &quot;incapaces&quot; de tomar decisiones, inmaduros y también llamados ignorantes, así lo comentó una adolescente quien al acudir a consulta de planificación familiar el médico más que recomendarle o sugerirle un método anticonceptivo, después de una explicación del uso de cada uno de acuerdo a la normatividad , terminó por insistirle qué método debía usar, no dejando que ella tomara la decisión como es su derecho. Lo anterior nos muestra una violación al derecho humano, por ende al derecho universal , ya que los y las adolescentes son sometidos a la conciencia (s) de los &quot;otros&quot; quitándoles por completo su derecho de libertad a decidir por su salud reproductiva .</p><p>196</p></div><div class='page-block'><span class='page-marker'>📄 Página 205 del PDF original (Tesis UACM):</span><p>Esta posición va en contra del Código de Ética de los médicos, son ellos quienes deben de actuar para el beneficio de los usuarios del centro de salud, en este caso de los y las adolescentes. Es importante no postergar el interés de trabajar del personal de salud haciendo a un lado la atención superficial que se les da a los y las adolescentes, es tiempo de ser parte del derecho a la salud y a la salud sexual y reproductiva con eficiencia y calidad.</p><p>Discriminación</p><p>Con lo que respecta</p><p>al tema de discriminación los y las adolescentes han</p><p>experimentado inclusive discriminación de género refiriéndose que se sienten más rechazados que las mujeres, mencionan haber experimentado en alguna ocasión rechazo por su manera de vestir y de peinarse. El personal de salud maneja el co ncepto de adolescente varón es sinónimo a ser rebelde y no tener interés por su salud y cuerpo . De esta manera el personal de sa lud etiqueta a los adolescentes y genera estereotipos negativos que clasifican y categorizan a los individuos (Cook, 2010) en este sentido se restringe porque hay una preconcepción respecto de los y las adolescentes.</p><p>De acuerdo a lo anterior, los adolescentes recalcan que son los adultos quienes fomentan dicha actitud por lo que los y las adolescentes reproducen ese patrón ya sea familiar, institucional y finalmente social, ejerciendo con la misma crueldad que viven ellos al relacionarse con amigos, hermanos y pareja pudiendo lastimarse entre si, en la búsqueda de identidad y de ser aceptados en los círculos inmersos. 197</p></div><div class='page-block'><span class='page-marker'>📄 Página 206 del PDF original (Tesis UACM):</span><p>Necesidades de los y las adolescentes</p><p>&quot;En los centros de salud me gustaría que el trato sea mejor, que en verdad le den la importancia que se merece la gente, que nos proporcionen información y que haya material que requiera la gente y que sea má s rápido el servicio&quot; (Montserrat).</p><p>&quot;Deben poner mas atención en los jóvenes y deben instalar un módulo especializado&quot; (Rodrigo).</p><p>Los y las adolescentes hacen mención en el grupo de reflexión de que el personal de salud, en su mayoría , es gente adulta lo que les hace pensar que puede ser un obstáculo para la comunicación por lo que perciben poca información , e hicieron mucho hincapié de que el centro de salud debe contar con más personal joven , capacitado y/o especializado que pueda dar una atención con calidad .</p><p>&quot;Me gustaría que la gente que proporciona la información no sea tan cerrada en este tema, ya que me ha tocado que cuando voy a pedir información la gente nada más me dan un folleto y condones pero no me explican nada&quot; (Fernando).</p><p>Los y las adolescentes tienen el deseo de interactuar con otros adolescentes y jóvenes en materia de educación sexua l, ya que el comunicarse de igual a igual se da un acompañamiento que les da confianza y seguridad , dándose un actuar práctico y 198</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Doble Moral Patriarcal en la Juventud</h3>\n<blockquote class=\"quote\">«Los roles de género tradicionales colocan a las adolescentes en una posición de extrema vulnerabilidad... Si una mujer propone el uso del condón, su pareja masculina suele ofenderse, acusándola de infidelidad o catalogándola despectivamente como 'fácil'; mientras que al varón se le tolera y alienta el inicio precoz y la multiplicidad de parejas sin protección» (p. 195).</blockquote>\n\n<h3>2. Consecuencia Sanitaria Directa</h3>\n<p>La asimetría de poder hace que las mujeres jóvenes sean las víctimas predominantes del VPH y el VIH en relaciones de pareja aparentemente estables, ante el chantaje masculino: <em>'si me quisieras no me pedirías condón'</em>.</p>\n</div>", "links": ["ITS_EPIDEMIOLOGIA", "CONDON_MITOS", "DERECHOS_SEXUALES"]}, {"id": "TABU_FAMILIAR", "title": "Tabúes Familiares y Represión Doméstica", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 184-187", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 184 del PDF original (Tesis UACM):</span><p>se reduce, como en otras instituciones, al uso de medidas de protección para el embarazo o infecciones de transmisión sexual, nuevamente, la sexualidad se reduce a la reproducción o a la prevención de la enfermedad . El siguiente comentario es de una adolescente de 15 años entrevistada al salir de consulta médica respecto a si en la escuela le han hablado del tema:</p><p>&quot;No porque es malo hablar de eso, en mi escuela dicen eso, la maestra de formación cívica nos dice que tenemos que usar protección, nos dice que no es ni malo ni bueno pero que si es bueno que nos den información. Y nos dice que nos tenemos que cuidar y todo eso&quot; (Ana).</p><p>La anterior es una respuesta tajante de una adolescente y es el argumento oficial de la mayoría de las escuelas en México. En el ámbito escolar la Educación Sexual es un término usado para describir la educación acerca del sexo , la sexualidad, el aparato reproductor femenino y masculino, la orientación sexual, las relaciones sexuales, la planificación</p><p>familiar</p><p>y</p><p>el</p><p>uso</p><p>de</p><p>anticonceptivos,</p><p>la</p><p>reproducción</p><p>y más</p><p>específicamente la reproducción humana . Los derechos sexuales y otros aspectos de la sexualidad humana y el objetivo de alcanzar una satisfactoria salud sexual quedan fuera de la visión de los programas educativos.</p><p>Los y las adolescentes demandan otra visión de educación sexual en el contexto escolar, así lo señaló una madre adolescente que se da cuenta de la importancia que tiene la educación sexual en la escuela:</p><p>176</p></div><div class='page-block'><span class='page-marker'>📄 Página 185 del PDF original (Tesis UACM):</span><p>&quot;En la escuela ya deben ser más abiertos con los niños, muchas veces te limitan en ciertos temas, pero es muy importante que los niños conozcan sobre su sexualidad &quot; (Aurora).</p><p>Con lo que respecta a la visión del personal de salud respecto de la educación sexual se observó que no dista mucho de lo que en teoría se piensa, es decir, encontramos que el personal médico, de enfermería , trabajo social, técnico y administrativo que cuenta con los conocimientos o está encargado de brindar el servicio de asesoría , consejería , educación para la salud , etcétera , muestran una postura valorativa sobre el tema y para ocultar la falta de compromiso para con los adolescentes argumentan que son ellos los que no cuentan con la información suficiente y que tienen muchas dudas; el personal dice no contar con el material , tiempo y los espacios necesarios para brindar una buena atención , y por otro lado que los jóvenes no saben a dónde y con quién acudir.</p><p>La educación sexual en el ce ntro de salud se conce ntra en la entrega de material gráfico, condoneria , campaña s de higi ene, control médico, pláticas informativas, todo con un enfoque de prescribir y co ntrolar comportamientos y práctica s sexuales de los sujetos. Estos datos pueden co rroborarse con los resultados de la información obtenida en los cuestionarios aplicados a los y las adolescentes (ver gráfica No. 14 en pág. 165). Los datos demuestran que no hay un acercamiento directo, abierto y significativo con los y las adolescentes en el que puedan expresar sus dudas, necesidades y experiencias.</p><p>177</p></div><div class='page-block'><span class='page-marker'>📄 Página 186 del PDF original (Tesis UACM):</span><p>Lo anterior muestra la clásica visión Médica-hegemónica, la cual prescribe y enseña a los ignorantes, (Menéndez,</p><p>1994) señala &quot;los factores económico-políticos son</p><p>determinantes en la constitución de las formas de estratificación social dominantes, pero el reconocimiento de esto no debe conduci r a considerar como subordinados ni determinados a los procesos ideológicos y culturales que intervienen en el proceso salud/enfermedad/atención&quot;.</p><p>Los resultados de la investigación y de los grupos de reflexión indican que el personal en el Centro de Salud brinda educación sexual de manera limitada y sólo es abordada desde la entrega de material impreso y alguna otra forma de dar la información como es la entrega de pulseras alusivas y condones , a estas acciones se les llama &quot;promoción de la salud&quot;, son consideradas como actividad de difusión siendo esta labor exclusiva de Trabajo Social , sin embargo, los y las adolescentes señalan que son actividades que no reflejan un impacto positivo en su aprendizaje sobre su sexualidad.</p><p>Asistencia al Centro de Salud</p><p>Cuando analizamos la asistencia y permanencia de los jóvenes en el centro de salud identificamos que el motivo de solicitud del servicio tiene como constante la consulta prenatal y puerperio, terminando posteriormente en consulta del o de la niña , hay casos en que los adolescentes se acercan al centro de salud para solicitar información y/o métodos de planificación familiar, sin embargo, muchas veces los hacen esperar demasiado tiempo , si es que alcanzan ficha para consulta . Los y las adolescentes señalan que esperan la atención de 30 a 60 minutos (ver gráfica No. 10 en pág . 161), 178</p></div><div class='page-block'><span class='page-marker'>📄 Página 187 del PDF original (Tesis UACM):</span><p>esto representa mucho tiempo de espera para los adolescentes, ya que su margen de tiempo es apretado por las diferentes actividades que tienen y señalaron que es desesperante la tardanza mencionaron que deberían agilizar el proceso de atención. El siguiente testimonio refleja la inconformidad:</p><p>&quot;Bueno aquí no, pero allá (en el IMSS) es diferente cuando vas a planificación familiar no es como aquí que tienes que venir temprano a sacar ficha y luego esperar hasta que te toque pasar al consultorio, allá sólo entregas tu carne! a la hora que llegas y te atienden , es desde la mañana y creo que hasta las seis o cuatro&quot; (Aurora).</p><p>La otra parte es que no son atendidos con respeto al negarles el libre albedrío para decidir por el método de anticoncepción.</p><p>La asistencia al centro de salud obedece a su condición de clase y su estatu s laboral porque no cuentan con servicios médicos como el Instituto Mexicano del Seguro Social (IMSS) o con el Instituto de Seguridad y Servicios Socia les de los Trabajadores del Estado (ISSSTE) y mencionan que si n recursos económicos no tienen otra opción en algunos caso se han afiliado al Programa de Atención Médica y Medicamentos Gratuitos correspondiente al Gobierno del Distrito Federal, y lo al Seguro Popular Programa Federal, para poder tener atención las madres y sus hijos. Mencionan no estar conformes o satisfechas con el servicio por lo cual se ven obligadas a acudir al médico privado.</p><p>179</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Silencio Doméstico como Factor de Riesgo</h3>\n<blockquote class=\"quote\">«Sus padres no hablan sobre el tema de la sexualidad que sigue siendo un tabú, tanto madres como padres sienten pena de hablar de sexo de qué es y cómo se cuida. Esta reproducción cultural de la represión ha llevado a los adolescentes a iniciar su actividad sexual prematuramente sin conocimientos previos y sin elementos preventivos» (p. 177).</blockquote>\n\n<h3>2. La Paradoja de la Prohibición</h3>\n<p>Los padres prohíben hablar de sexo creyendo que así evitan el inicio erótico de sus hijos; el resultado empírico es el inicio en la clandestinidad, sin condones y con pánico a acudir al médico ante una ITS.</p>\n</div>", "links": ["ESTIGMA_PENA", "CONSTRUCCION_SOCIAL", "ESI_EMANCIPATORIA"]}, {"id": "DERECHOS_SEXUALES", "title": "Derechos Sexuales y Reproductivos de las Juventudes", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 194-198", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 194 del PDF original (Tesis UACM):</span><p>Limitación de capacidades</p><p>El personal impone prejuicios y valores personales en la atención . Etiquetan a los y las adolescentes a partir de un estereotipo socialmente negativo; por su condición de clase , apariencia o edad.</p><p>&quot;Me regañó el doctor la otra vez pero estuvo bien . Porque, dice que si sabía, que</p><p>me dolían los ovarios y que si sabía dónde estaban los</p><p>ovarios, pero me dijo que tenía una infección urinaria&quot; (Ana).</p><p>El trabajador de la salud cuenta con el recurso de la palabra y a la vez ésta es algunas veces impositiva , por lo que no oye y; lo que dice es sólo una indicción de lo que no dice, le permitirá buscar formas para escud riñar en el subcontexto, en el contexto y así no perder del todo el sentido de lo que dice y de lo escucha. La comunicación en salud , la producción e intercambio de palabras con las que se significa la salud y los mensajes de sa lud , está sujeta a la imposibilidad de sujetar la palabra y con ella la realidad. Sin embargo, a partir de la ilusión de la verdad de las palabras, los trabajadores e instituciones de salud toman decisiones que co nciernen a la vida , la muerte, el nacimiento, la vida cotidiana , el trabajo, la sexualidad , etcétera, de &quot;los otros&quot; frecuentemente invalidando la posibilidad de que la palabra de &quot;los otros&quot;, también es ilusoriamente verdadera (Chapela , 2004).</p><p>Es claro la postura institucional y el ejercicio de poder en este Modelo Médico Hegemónico validado por la misma institución , como lo señala Menéndez, (1979) dicho 186</p></div><div class='page-block'><span class='page-marker'>📄 Página 195 del PDF original (Tesis UACM):</span><p>modelo cumple con &quot;la práctica médica curativo-preventiva, normatizadora, de control y de legitimación; por lo que se da un proceso de organización jerarquizada de la normalización y de control dándose una actitud de atención paternalista fomentando la pasividad de los y las adolescentes y pacientes en general&quot;.</p><p>Así el personal de salud determina la relación dominante y ejerce en los y las adolescentes el clásico discurso &quot;tú , joven no tienes los conocimientos&quot;, sumando el concepto que tienen de la adolescencia que son inmaduros y que no saben lo que quieren, se realiza un comparativo entre las generaciones pasadas y las actuales, las cuales son rebeldes, y no existe disposición y apertura que permita reconocer el conocimiento de los otros, para ofrecer una atención objetiva que resuelva dudas y necesidades de los mismos. Con lo que respecta al discurso institu cio nal éste se encuentra dentro de los tres mecanismos de exclusión del discurso que identifica Foucault (1980), siendo el de exclusión por invalidación , el cual es marginado, no escuchado, no percibido ni existente , dándose el caso del discurso de la mujer, el niño, el ind ígena, los adultos mayores quienes son mirados como incapaces de expresarse coherente , inteligente y significativamente. El trabajador de la salud conti nuamente está excluyendo por este mecanismo la palabra y el discurso del &quot;otro&quot; (paciente) considerado como ignorante , irresponsable e insensible e impone el discurso institucional autoritario sobre el que construye su saber y por ende su discurso.</p><p>El trabajador de la salud frecuentemente se olvida o no comprende el contexto ni el sentido de las palabras que escucha y pierde el control de sus propias palabras al emitirlas fuera de contexto y del sentido que el &quot;otro&quot; le da a las palabras. Se pierde 187</p></div><div class='page-block'><span class='page-marker'>📄 Página 196 del PDF original (Tesis UACM):</span><p>cuando significa al &quot;otro&quot; como usuario, el cliente, el paciente, la población, sin considerar que al significar al otro de estas maneras se está significando a sí mismo.</p><p>&quot;No todo el personal sabe dar información y orientar a toda la gente, muchas veces el médico no explica sobre el medicamento y sus efectos&quot; (Ana).</p><p>Los y las adolescentes mencionan que, en efecto, sienten pena, y esto tanto en mujeres como en hombres, por solicitar información de educación sexual en el campo institucional, e inclusive hicieron mención de los servicios de archivo y trabajo social subcampos importantes del centro de salud, siendo el segundo subcampo mencionado, el eje central de la promoción de la salud y donde en efecto, la gente lo identifica como uno de los filtros resolutivos en sus padecimientos y dudas. Incongruentemente el personal no está sensibilizado, consecuencia de la instrucción académica hegemónica que en consecuencia limita una favorable relación médico/trabajo social-paciente, por lo que el personal argumenta visualizar que la demanda por los servicios los rebasa por lo que el trato es de baja calidad.</p><p>Es claro que la actitud del personal médico y de enfermería , no favorece el ejercicio de las capacidades humanas, como la sapiens, ludens y política de los y las adolescentes. La atención otorgada limita el ejercicio de capacidades de los adolescentes porque no permite que expresen libremente y sin temor a ser juzgado o ridiculizado, dudas y necesidades sobre su cuerpo, salud y sexualidad . En el caso de capacidad política es cuando otorgan atención de planificación familiar a mujeres adolescentes, éstas 188</p></div><div class='page-block'><span class='page-marker'>📄 Página 197 del PDF original (Tesis UACM):</span><p>señalaron no decidir libremente por un método anticonceptivo, sino era el médico quien escogía el anticonceptivo señalando que era el mejor y disponible en ese momento, con su carácter impenetrable y su postura de &quot;yo personal de salud tengo el conocimiento y tú no sabes&quot;, interponen una barrera y una relación de subordinación de los y las adolescentes por tener conocimientos de sexualidad no permitiéndoles que expresen libremente sus ideas, dudas y necesidades sin sentir culpa ; por lo que no se da el acercamiento de igual a igual.</p><p>Algunos</p><p>actores</p><p>de</p><p>salud</p><p>reconocen</p><p>no estar</p><p>completamente</p><p>preparados</p><p>o</p><p>actualizados para brindar información y atención con calidad a los y las adolescentes, sin embargo, el hecho de aceptarlo no justifica una actitud de atención desinteresada . Así se deja ver en el siguiente testimonio de un médico del centro de salud :</p><p>&quot;Nada más les platica uno porque de herramientas y material no tenemos nada absolutamente aquí como médicos, nosotros y el demás personal tienen la misma situación, además algunos yo creo que también les falta mucho que los orienten. Si tan sólo cuando los adolescentes entran y les preguntan dónde hay esto, o para pedir lo otro, dónde va haber platica sobre sexo, la misma gente a la entrada ya sea el policía o personal administrativo no los orienta y les dicen : no sé, vayan y pregunten allá, no sé, vaya con el otro (se refiere a los servicios) entonces esto hace la perdida de interés de los muchachos porque si los mandan para allá y para acá entonces los muchachos dicen esto es puro relajo y sus inquietudes aumentan cada vez y 189</p></div><div class='page-block'><span class='page-marker'>📄 Página 198 del PDF original (Tesis UACM):</span><p>entonces no hay una buena orientación para ellos, el mismo personal de salud no se dan a la tarea de avocarse a la problemática muy grande la sexualidad; por lo que el joven dice: ¿para qué voy al centro de salud? Bueno, aunque aquí los compañeros médicos son buenazos pero no dudo que algunos van perdiendo interés por su mismo carácter, luego no los orientan y les dicen : &quot;no sé, ve a trabajo social y allá te van a sacar de la duda&quot;. Nosotros los médicos nos debemos dar un tiempo ya sean 5 o 1O minutitos de hablarles y tratarlos de orientar como debe de ser&quot; (Médico Sergio).</p><p>Analizando los resultados obtenidos en el grupo de reflexión con los y las adolescentes y visualizando la otra cara de la moneda, en efecto, los adolescentes se asumen renuentes a preguntar por no sentir confianza, tolerancia y disposición a la escucha y resolución de dudas estando presente el temor a romper esa barrera institucional que refuerza el poder pedagógico que limita el ejercicio de las capacidades.</p><p>&quot;Quisiera que me dieran confianza, ser tratada como una persona responsable capaz de tomar decisiones en mi vida&quot; (Judith).</p><p>Es importante rescatar lo señalado por los y las adolescentes. Haciendo hincapié en la importancia de abordar y trabajar sobre la postura del personal de salud que ejerce poder institucional, y hacer un lado la actitud controladora que hace sentir intimidados a los adolescentes quienes visibilizan el ejercicio de poder institucional, las formas de discriminación de las cuales son objeto y la intimidación y el control que ejerce el 190</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Reivindicación de los Derechos Sexuales como Derechos Humanos</h3>\n<blockquote class=\"quote\">«El campo de la salud sexual y los derechos sexuales de los y las adolescentes es todavía un campo marginal... Los adolescentes tienen derecho inalienable a la información laica, científica y oportuna, a la confidencialidad médica y al disfrute placentero y seguro de su sexualidad sin coerción ni violencia» (p. 6, 201).</blockquote>\n\n<h3>2. Derechos Exigibles en Centros de Salud</h3>\n<ol>\n  <li>Derecho a la confidencialidad médica sin revelación a padres.</li>\n  <li>Derecho a recibir métodos anticonceptivos y de barrera gratuitos sin tutor.</li>\n  <li>Derecho al consentimiento informado y libre elección del método (NOM-005).</li>\n  <li>Derecho a una vida libre de violencia y discriminación institucional.</li>\n</ol>\n</div>", "links": ["NOM_005", "SUJETO_ETICO", "ESI_EMANCIPATORIA"]}, {"id": "ESI_EMANCIPATORIA", "title": "Propuesta: Educación Sexual Integral y Emancipatoria", "group": "social", "badge": "Entorno Social", "color": "#a68a56", "pages": "Págs. 209-216", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 209 del PDF original (Tesis UACM):</span><p>Conclusiones</p><p>De acuerdo con los resultados de la investigación realizada con los y las adolescentes y el personal de salud en el centro de salud Dr. Maximiliano Ru íz Castañeda, se concluyó que el personal de salud ejerce poder institucional en los y las adolescentes, lo cual no permite que éstos tomen sus propias decisiones. En primer lugar, algunos médicos no atienden a los y las adolescentes si éstos no van acompañados por un familiar o adulto que se haga responsable de ella o él, argumentando que es por seguridad personal sintiéndose más confiados que otro adulto asuma la responsabilidad del adolescente. Esto viola su derecho de atención de acuerdo con la Norma Oficial Mexicana de los Servicios de Planificación Familiar (NOM-005-SSA2-1993, publicada en su versión actualizada en el Diario Oficial de la Federación el 21 de enero de 2004) que establece que la planificación familiar es un derecho de toda persona , independientemente de su género, edad y estado social o legal. También señala que la consejería en materia de planificación familiar debe dar particular atención a la población adolescente, con absoluto respeto al derecho a decidir sobre su conducta sexual y reproductiva y al consentimiento informado en la prescripción de métodos anticonceptivos (NOM-005SSA2-1993, pág. 4 ). Esto muchas veces limita a los y las adolescentes de no expresar libremente sus dudas y necesidades con respecto a su cuerpo y sexualidad , se sienten intimidados y juzgados por ambas partes; en segundo lugar hay adolescentes que no tienen familia o tutor, algunos pueden encontrarse en situación de ca lle, esto tiene como consecuencia que los adolescentes no se acerquen a los servicios de salud y enfrenten los procesos de enfermedad sin acompañamiento afectando sus niveles de salud . 201</p></div><div class='page-block'><span class='page-marker'>📄 Página 210 del PDF original (Tesis UACM):</span><p>Dejar de prestar a los y las adolescentes información y servicios apropiados y oportunos por temor a legitimar y alentar la actividad sexual no es una opción viable y resulta contraproducente.</p><p>La afectación a su capacidad</p><p>política podemos observarla cuando los y las</p><p>adolescentes asisten a consulta de planificación familiar y en donde la mayoría de las veces no son ellos quienes libremente deciden por el método de anticoncepción, los y las adolescentes expresaron que es el médico (a) quien le &quot;sugiere&quot; el método a usar y no hay una explicación amplia e informada de los efectos en la salud al optar por uno de ellos, violando otro derecho como lo señala la NOM-005-SSA2-1993 de los servicios de planificación familiar en su inciso 4 .1.1: &quot;Los servicios de planificación familiar deberán proporcionar información, orientación , consejería, selección, prescripción, contraindicaciones y aplicación de métodos de control de la fertilidad, identificación y referencia en casos de esterilidad e infertilidad, prevención de infecciones de transmisión sexua l, atención materno-infantil , detección del riesgo preconcepcional, detección oportuna de cá ncer cérvico-uterino y de mama , además del manejo de la perimenopausia y la posmenopausia . La prestación de los servicios deberá de otorgarse de una manera integral con ca lidad y ca lidez a toda la población&quot; (pág. 6). Y esto evidencia de que los y las adolescentes son considerados como objetos por su condición de menores de edad (el 58% son mujeres y el 42 % son hombres) aspecto que viola el derecho a la sa lud cuando las decisiones deben partir del sujeto informado de acuerdo con lo señalado en la observación 14 del Pacto Internacional de Derechos Sociales, Económicos y Culturales.</p><p>202</p></div><div class='page-block'><span class='page-marker'>📄 Página 211 del PDF original (Tesis UACM):</span><p>Respecto de la capacidad erótica no existe posibilidad desde los discursos de la institución a ejercerla de una manera que promueva mejores niveles de salud, el poder del discurso sobre sexo y sexualidad se le transfiere -por parte del metacampo del Estado- de manera exclusiva al personal de salud, que no promueve la aceptación, expresión y ejercicio de manera libre, responsable y plena de su sexualidad, sino parte de un discurso prohibitivo y culpabilizador. Estos discursos son manejados también en la familia y la escuela , agencias de esta reproducción social.</p><p>En otro lado de la moneda existen algunos padres y madres que desean ayudar a sus hijos e hijas establecen una comunicación con tabús en cuestión relativas al sexo. Se sienten incompetentes para enfrentar esa tarea, y por otro lado, los hijos e hijas se muestran a menudo avergonzados para abordar el tema co n sus padres, lo que trae como consecuencia recurrir a otras formas que les den respuestas, no siempre de fuentes confiables , como puede ser la interne!, los amigos, revistas, en la escuela que más de las veces no es la que precisamente se interese por ello. Es imposible apartar a la población infantil y adolescente de las influencias sexuales sin una adecuada u optima educación sexual.</p><p>Al gunos modelos de comportamien to y la influencia de los diferentes medios de comunicación como son la televisión, revistas y los anuncios comerciales bombardean constantemente , pero no se compara con el silencio y las respuestas evasivas de padres y profesores.</p><p>203</p></div><div class='page-block'><span class='page-marker'>📄 Página 212 del PDF original (Tesis UACM):</span><p>Con lo que respecta a la atención médica el cuerpo es visto dentro de la institución como territorio en el cua l se inscribe la hegemonía de mercado y el discurso médico hegemónico construido por percepciones, representaciones , significados y valores propios de la institución médica donde la salud es concebida, practicada y vinculada a la enfermedad en sus tres dimensiones: prevención, curación o rehabilitación .</p><p>Sobre la capacidad sapiens, ésta se ve limitada por el personal de salud al no escuchar los conocimientos , saberes y experiencias de los y las adolescentes cuando se establece la relación médico-paciente, los tratan de ignorantes al hacerles sentir que por su juventud &quot;no saben lo que quieren&quot; y que &quot;a su edad el sexo es malo&quot;, esto nos muestra que el personal impone prejuicios y valores personales en la atención .</p><p>Etiquetan a los y las adolescentes a partir de su condición de clase social , apariencia o edad. La postura que el personal adopta es paternalista siempre manejando el &quot;regaño&quot; porque &quot;tú no lo sabes&quot;, ejercie ndo poder y haciendo uso de los capitales cultural y simbólico, es decir, de los conocimientos, habilidades y autoridad que la educación formal y la propia institución les otorga. El personal no muestra disposición ni apertura de reconocer la palabra del &quot;otro&quot; como &quot;sujeto&quot; que permita ofrecer una atención objetiva , por lo que las palabras de los y las adolescentes no son escuchadas, más aún son inexistentes.</p><p>Respecto a como se concibe la promoción de salud y la forma de estructurar sus prácticas en materia de educación sexual desde la institución por el personal de salud queda clara la visión que se tiene. La operatividad de los programas de promoción de la 204</p></div><div class='page-block'><span class='page-marker'>📄 Página 213 del PDF original (Tesis UACM):</span><p>salud se centra en hacer difusión y entrega de métodos anticonceptivos, volantes, trípticos , folletos , carteles , pulseras alusivas al tema, condones y dar pláticas informativas con un enfoque preventivista que hace alusión a la adquisición de repertorios conductuales o modificación de los mismos en donde colocan a los sujetos como simple usuarios de servicios, que bien utilizados, fomentan la salud de la población.</p><p>Si bien, durante el proceso de investigación se observó como los y las adolescentes al preguntar en archivo clínico en dónde les pueden ofrecer información sobre sexualidad y métodos anticonceptivos el personal de salud los envía a trabajo social , una vez ahí las trabajadoras sociales sólo se concretan a darles algunos folletos , condones y pulseras alusivas al tema los comentarios dirigidos a los y las adolescentes es que deben leer la información , pero no se da una atención personalizada y por ende no se ofrece una consejería detallada tampoco se le sugiere que solicite consulta médica para una atención y un seguimiento personal.</p><p>Así las formas de entender la promoción de la salud en materia de salud sexual, ya sea en el campo escolar y/o en el campo institucional , parten de princi pio paradigmático biologicista , ya sea que se aluda al campo de la medicina o de la psicología , dichas prácticas limitan las capacidades de los y las adolescentes.</p><p>No se atienden las necesidades de los y las adolescentes y no se escuchan las experiencias que permitan construir conocimientos y aprendizajes significativos de manera individual y colectiva. 205</p></div><div class='page-block'><span class='page-marker'>📄 Página 214 del PDF original (Tesis UACM):</span><p>La educación sexual no es tan sólo el hecho de mostrar un condón y decir cómo usarlo; de hablar sobre infecciones de transmisión sexual y del VIH, es fundamental tener dichos conocimientos, sin</p><p>embargo considero que también debe hablarse de</p><p>responsabilidad , de amor y no hacer a un lado las emociones y sentimientos, es importante hablar sobre el placer sexual , el erotismo y las prácticas sexuales de los y las adolescentes para entender sus significados, es decir, poder desentrañar los procesos subjetivos que se desarrollan en sus procesos de construcción de su identidad sexual.</p><p>Un enfoque emancipatorio en la educación sexual para niños y adolescentes desde la promoción de la salud lograría dejar a un lado los tabús y valoraciones personales por parte del personal de salud ya que al interponer sus valores y prejuicios personales no les permite dar una atención objetiva y profesional, el discurso institucional es superficial limitándose a frases como; &quot;cuídate&quot;, &quot;no seas tonto (a)&quot;, &quot;no sa be s a lo que vas&quot;, pero no encontramos frases que permitan a los y las adolescentes ejercer sus derechos sexuales, tener prácticas sexuales con responsabilidad , ejerce r el erotismo, apropiarse del cuerpo, apropiarse de los discursos, ejercer sus capacidades humanas; contrario a esto se fom entan discursos del miedo y la culpa que se in sc riben en los cuerpos y reproducen en la esfera individual y colectiva .</p><p>El médico o médica percibe que los y las adolescentes tienen muchas dudas y reconocen también que como personal de salud no ofrecen una atención significativa para los jóvenes, argumentando que es por falta de tiempo , espacio y por la exigencia de productividad laboral que tienen que cumplir como metas por lo que esta situación 206</p></div><div class='page-block'><span class='page-marker'>📄 Página 215 del PDF original (Tesis UACM):</span><p>se convierte en una barrera institucional que en la mayoría de los casos impide una relación de médico/paciente, es decir de sujeto a sujeto, que busque resolver dudas y den paso a tomas de decisión tanto en lo individual y/o en pareja con respecto a sus necesidades de sexualidad de los y las adolescentes.</p><p>En otros casos, el personal de salud antepone sus prejuicios y valores personales cuando atienden a los y las adolescentes, esto se observó principalmente con las madres adultas, su postura corporal y verbal es de madre protectora y recriminante lo cual la atención brindada no es objetiva ni ética ; dicho comportamiento se da al inicio de la consulta acompañado de el &quot;regaño&qu
