<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red Conceptual Dual: Salud, ITS y Educación Sexual (UACM)</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #131b2e;
            --bg-panel: #182239;
            --border-color: rgba(255, 255, 255, 0.14);
            --primary: #38bdf8;
            --primary-rgb: 56, 189, 248;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-gold: #f59e0b;
            --font-size-base: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* HEADER SUPERIOR CON SWITCH GLOBAL */
        header {
            position: absolute; top: 0; left: 0; right: 0; height: 68px;
            background: rgba(10, 14, 23, 0.96); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .header-title-box { display: flex; flex-direction: column; }
        .header-title { font-size: 14px; font-weight: 800; color: var(--primary); letter-spacing: 0.3px; }
        .header-subtitle { font-size: 11px; font-weight: 400; color: var(--text-muted); }

        /* SELECTOR GLOBAL DE MODO (TODO EL SISTEMA) */
        .global-mode-switcher {
            display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 20px; padding: 2px;
        }
        .global-mode-btn {
            padding: 5px 12px; border-radius: 18px; font-size: 11px; font-weight: 700; cursor: pointer;
            border: none; background: transparent; color: #94a3b8; transition: 0.25s;
        }
        .global-mode-btn.active {
            background: var(--primary); color: #0a0e17; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }

        .search-container { position: relative; }
        .search-input {
            background: var(--bg-card); border: 1px solid #334155; color: #fff;
            padding: 6px 10px 6px 28px; border-radius: 20px; font-size: 12px; width: 120px;
            transition: width 0.3s ease; outline: none;
        }
        .search-input:focus { width: 180px; border-color: var(--primary); }
        .search-icon { position: absolute; left: 9px; top: 7px; color: #64748b; font-size: 11px; }

        /* BARRA DE FILTROS */
        .filter-bar {
            position: absolute; top: 74px; left: 10px; right: 10px;
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; z-index: 90;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .pill {
            padding: 5px 12px; border-radius: 14px; font-size: 11px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--border-color);
            background: var(--bg-card); color: #cbd5e1; white-space: nowrap; transition: 0.2s;
        }
        .pill.active { background: var(--primary); color: #0a0e17; border-color: var(--primary); font-weight: 700; }
        .pill.salud { border-color: #2d6a4f; color: #80ed99; }
        .pill.its { border-color: #9d0208; color: #ffccd5; }
        .pill.medicina { border-color: #0077b6; color: #90e0ef; }
        .pill.ciencia { border-color: #7b2cbf; color: #e0aaff; }
        .pill.social { border-color: #a68a56; color: #ede0d4; }

        /* CANVAS */
        #graphCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

        /* CONTROLES FLOTANTES */
        .controls {
            position: absolute;
            bottom: max(24px, calc(16px + env(safe-area-inset-bottom, 0px)));
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 90;
        }
        .btn-ctrl {
            width: 42px; height: 42px; border-radius: 50%; background: var(--bg-panel); color: #f8fafc;
            border: 1px solid var(--border-color); font-size: 16px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.5); user-select: none;
            transition: transform 0.1s ease, background 0.2s;
        }
        .btn-ctrl:active { transform: scale(0.92); }

        .toggle-links-btn {
            position: absolute;
            bottom: max(24px, calc(16px + env(safe-area-inset-bottom, 0px)));
            left: 18px;
            z-index: 90;
            background: var(--bg-panel); border: 1px solid var(--border-color); color: #cbd5e1;
            font-size: 11.5px; font-weight: 600; padding: 9px 15px; border-radius: 20px;
            cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .toggle-links-btn.active { border-color: var(--primary); color: var(--primary); background: #0f2744; }

        /* DRAWER MODAL DE LECTURA DUAL */
        .drawer {
            position: absolute; bottom: 0; left: 0; right: 0;
            max-height: 86vh;
            max-height: 86dvh;
            background: var(--bg-panel); border-top: 3px solid var(--primary); border-radius: 22px 22px 0 0;
            padding: 20px 20px max(40px, calc(20px + env(safe-area-inset-bottom, 20px)));
            overflow-y: auto; transform: translateY(105%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.85); z-index: 200;
            -webkit-overflow-scrolling: touch;
        }
        .drawer.open { transform: translateY(0); }

        .drawer-top-bar {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        .drawer-meta { display: flex; flex-direction: column; gap: 4px; }
        .drawer-badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700;
            text-transform: uppercase; width: fit-content;
        }
        .drawer-title { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.3; }
        .drawer-source-pages { font-size: 11px; color: var(--accent-gold); font-weight: 600; }

        .drawer-actions { display: flex; align-items: center; gap: 8px; }
        .btn-font {
            background: #0f172a; border: 1px solid #334155; color: #cbd5e1; width: 30px; height: 30px;
            border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .drawer-close {
            background: #0f172a; border: 1px solid #334155; font-size: 22px; color: #94a3b8;
            cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* TABS INDIVIDUALES DENTRO DEL NODO (TRANSCRITO VS RESUMEN) */
        .node-mode-tabs {
            display: flex; gap: 8px; margin: 12px 0 16px; background: #0a0e17; padding: 4px; border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1; padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700;
            cursor: pointer; background: transparent; color: #94a3b8; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active {
            background: #1e293b; color: #fff; border: 1px solid var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .tab-btn.active.transcrito { color: var(--accent-gold); border-color: var(--accent-gold); }
        .tab-btn.active.resumen { color: var(--primary); border-color: var(--primary); }

        /* CONTENIDO DE TEXTO */
        .drawer-content { font-size: var(--font-size-base); line-height: 1.75; color: #e2e8f0; }
        .drawer-content p { margin-bottom: 12px; text-align: justify; }
        .drawer-content h3 { font-size: 15px; color: var(--primary); margin: 18px 0 8px; font-weight: 700; }
        .drawer-content ul, .drawer-content ol { margin-left: 20px; margin-bottom: 14px; }
        .drawer-content li { margin-bottom: 6px; }

        .page-block {
            background: rgba(10, 14, 23, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; padding: 14px; margin-bottom: 16px; position: relative;
        }
        .page-marker {
            display: inline-block; background: #1e293b; color: var(--accent-gold); font-size: 10px; font-weight: 700;
            padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase;
        }

        .quote {
            background: rgba(10, 14, 23, 0.85); border-left: 4px solid var(--primary);
            padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 13px; font-style: italic;
            color: #cbd5e1; margin: 16px 0;
        }

        /* SECCIÓN OCULTA DE NODOS RELACIONADOS */
        .related-toggle-container {
            margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color);
        }
        .btn-toggle-related {
            width: 100%; background: #0a0e17; border: 1px solid #334155; color: var(--primary);
            padding: 11px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s;
        }
        .btn-toggle-related:hover { background: #131b2e; border-color: var(--primary); }

        .related-nodes-panel {
            display: none; margin-top: 12px; flex-wrap: wrap; gap: 8px;
            background: #0a0e17; padding: 14px; border-radius: 12px; border: 1px solid #334155;
        }
        .related-nodes-panel.visible { display: flex; }
        .rel-node-chip {
            padding: 6px 12px; background: var(--bg-card); border: 1px solid #475569; border-radius: 16px;
            font-size: 11px; font-weight: 500; color: #f1f5f9; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .rel-node-chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
        .rel-node-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

        /* RESPONSIVE MÓVIL (PROTECCIÓN CONTRA BOTONES ANDROID / GESTURE BARS) */
        @media (max-width: 768px) {
            header {
                height: auto;
                min-height: 56px;
                padding: 6px 12px;
                gap: 6px;
            }
            .header-title-box {
                max-width: 140px;
            }
            .header-title {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .header-subtitle {
                display: none;
            }
            .global-mode-switcher {
                flex-shrink: 0;
            }
            .global-mode-btn {
                padding: 4px 7px;
                font-size: 10px;
            }
            .search-container {
                flex-shrink: 0;
            }
            .search-input {
                width: 85px;
                padding: 4px 8px 4px 22px;
                font-size: 11px;
            }
            .search-input:focus {
                width: 120px;
            }
            .filter-bar {
                top: 64px;
                padding: 4px 8px;
            }

            /* ELEVACIÓN SEGURA DE CONTROLES: Los botones flotantes quedan por encima de la barra Android de 3 botones */
            .controls {
                bottom: max(78px, calc(32px + env(safe-area-inset-bottom, 24px)));
                right: 12px;
                gap: 6px;
            }
            .btn-ctrl {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .toggle-links-btn {
                bottom: max(78px, calc(32px + env(safe-area-inset-bottom, 24px)));
                left: 12px;
                padding: 8px 12px;
                font-size: 10.5px;
            }

            /* DRAWER EN MÓVIL: Padding generoso para que nada quede tapado al final del scroll */
            .drawer {
                max-height: 80vh;
                max-height: 80dvh;
                padding: 16px 16px max(96px, calc(56px + env(safe-area-inset-bottom, 32px)));
            }
            .drawer-title {
                font-size: 16px;
            }
            .drawer-actions .btn-font {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            .drawer-close {
                width: 30px;
                height: 30px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-box">
            <span class="header-title">Red Conceptual: Salud e ITS</span>

        <!-- SWITCH GLOBAL DE MODO PARA TODO EL MAPA -->

        <div style="background: #090d16; border: 2px solid #38bdf8; border-radius: 14px; padding: 6px; margin: 12px 0 16px; display: flex; gap: 8px;">
            <button id="tabTranscrito" onclick="setNodeMode('transcrito')" style="flex: 1; padding: 12px 8px; border-radius: 10px; border: none; font-size: 13px; font-weight: 800; cursor: pointer; background: #f59e0b; color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; gap: 6px;">
                📖 100% TRANSCRITO (LIBRO)

                <span id="relatedBtnText">🔗 Ver Nodos Relacionados (0)</span>

        <!-- ESPACIO DE SEGURIDAD PARA MÓVILES (BARRA DE NAVEGACIÓN ANDROID) -->
        <div class="drawer-mobile-spacer" style="height: 60px; width: 100%;"></div>

    <script>
        const rawNodes = [{"id": "SALUD_CHAPELA", "title": "Definición de Salud (Luz María Chapela)", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 104-107", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 104 del PDF original (Tesis UACM):</span><p>Estas capacidades humanas son la del razonamiento (sapiens), de imaginar (ludens), de motivación o apasionamiento (erótica), de trabajo (faber), la de toma de decisiones (política), y la de uso de los recursos para el logro de proyectos, la capacidad económica.</p><p>Sin emba rgo, para que el sujeto logre sus aspiraciones de acuerdo con la propuesta de Ottawa es indispensable que todo ser humano o colectividad sea reconocido por sí mismo y cuente con información y elementos que le ayuden a ubicarse y comprender su contexto para así poder mirar su pasado reflexionando sobre ello y trasladarlo al presente para comprenderlo y/o modificarlo (si es necesario) entender y aceptarlo y limitaciones, sin que ello lo lleve a una frustración equivoca.</p><p>De acuerdo a Chapela (2007), la sa lud es la capacidad corporeizada de inventar futuros y alcanzarlos.</p><p>Con la definición anterior se puede entender que la salud no se concibe si no consideramos el cuerpo como base fundamental del sujeto en el cua l y/o con el cual corporeíza todo</p><p>aprendizaje, conocimientos, vivencias, experiencias,</p><p>emociones</p><p>dándoles un significado (simbólico) y que estarán presentes en toda su vida, de los cual es representan y determinarán su trayectoria de vida y más aún manejando situaciones estructurales que no se corporeizaron pero que intervienen en su ciclo de vida , luego entonce s, dependerá de el volver al pasado para modificar y/o entender (si fuera el caso) alguna experiencia que le haya dejado huella profunda (toda experiencia la deja y es importante por sí misma, pero hay una o unas que signifique en mayor 96</p></div><div class='page-block'><span class='page-marker'>📄 Página 105 del PDF original (Tesis UACM):</span><p>grado) aclarando que ésta puede ser tanto favorable o no. Por lo tanto , depende de cada persona en qué medida ejerce una o todas sus capacidades humanas en el presente para imaginar y alcanzar futuros deseados en su contexto.</p><p>Entendiendo la salud como la capacidad corporeizada de inventar futuros y alcanzarlos, considerando con qué capitales se cuenta, entendiendo dichos capitales como los bienes materiales o simbólicos que poseen los agentes (o actores) y que pueden utilizar como recurso en el juego de reproducción de significados (Bourdieu, 1991); ya que tanto los capitales y el ejercicio de las capacidades humanas van a decir cómo y qué está limitando la salud y por ende problemas de salud .</p><p>Cabe aclarar que los obstáculos o impedimentos que se presentan para alcanzar proyectos, pueden ser externos e internos, qué pasa , por ejemplo, si una persona está desnutrida desde su infancia debido a la pobreza de su familia , si no fue atendida adecuadamente de alguna enfermedad y esto claro que repercute en su estado actual , lo que le implicará en gran medida conjugarse para esa mirada al pasado e imaginar y alcanzar los futuros deseados; en medida de esto nombramos cuál es el nivel de salud de un sujeto o colectividad , por el primero entendemos que dichos obstáculos no son controlables no están en las manos de las personas modificarlos o cambiarlos, éstos pueden ser la pobreza , el desempleo violencia , falta de espacios recreativos, educativos, culturales , autoritarismo, etcétera . Los segundos son meramente internos que tienen que ver con las capacidades (sapiens, ludens, faber, erótica, política y económica) con cuántos cuenta y en qué medida los mantiene firmes o bien cómo adquirirlos. 97</p></div><div class='page-block'><span class='page-marker'>📄 Página 106 del PDF original (Tesis UACM):</span><p>Y es precisamente lo que la promoción de la salud emancipatoria propone que todo individuo o colectividad sea un sujeto que ejerza sus capacidades humanas haciendo uso, o bien los obtenga , de todos sus capitales dentro del contexto y de su vida personal con lo que conlleva valores , prejuicios , sueños, etcétera, y realmente imagine futuros deseados y no limitarse a lo que el otro y Otro (discursos institucionales de dominación) le impongan, de sometimiento, por lo que el sujeto debe ser firme, reflexivo , autónomo, critico, analítico y por ende libre que lo que se puede lograr con la promoción de la salud emancipatoria basada en una pedagogía de autoconstrucción y de autocrecimiento (Chapela, 2001 ).</p><p>Hablando del Otro puedo mencionar como ejemplo a la Iglesia , escuela, familia , instituciones de salud y a todo aquello que acompaña y/o res paldado por la globalización , mercadotecnia ,</p><p>acu lturación ,</p><p>consumismo</p><p>que juegan</p><p>un</p><p>papel</p><p>importante en la formación de los individuos, principalmente los niños, adolescentes y jóvenes quienes son invadidos y manipulados en su formación presentándoles estereotipos y estatus a seguir que muchas de las veces caen en superficialidades y egocentrismos.</p><p>Es importante aclarar que la propuesta emancipatoria de promoción de la salud se basa , como ya se mencionó, en diferentes conceptos y planteamientos de autores destacados como Bourdieu y sus capitales. Por otro lado involucra conceptos como son las prácticas pedagógicas que se mencionan en la promoción de salud emancipatoria retomadas de la Educación Popular planteada por Paulo Freire (1970), en su trabajo de Pedagogía del oprimido. El origen de la educación popular se dio a partir del interés que 98</p></div><div class='page-block'><span class='page-marker'>📄 Página 107 del PDF original (Tesis UACM):</span><p>Freire tenia por los adultos en Brasil y urgentemente solicitada, inició en 1947 ya que la forma y el método tradicional de enseñanza-alfabetización le parecen insuficientes, ya que sólo consideraba la educación como una manera de someter y &quot;domesticar&quot; al hombre no permitiéndole ser libre (Barreiro, 1977). Freire trabajó con campesinos de varios lugares de Brasil obteniendo resultados extraordinarios en los grupos formados llamados &quot;Círculos de Cultura&quot;, donde aprendían de manera rápida en menos de 45 días a leer y escribir, lo que asombró a toda la opinión pública los avances verdaderamente revolucionarios; que evidentemente no eran del agrado de las clases dominantes ya que no iban a tolerar la transformación de una sociedad pasiva , manejable y sometida; y ante el asombró se percibía una sociedad fuerte , analítica y crítica que no estaría más dispuesta a ser sometida.</p><p>Freire (1977) argumenta que: &quot;el hombre fue creado para comunicarse con los otros hombres&quot; y debe contar y ejercer &quot;la educación como práctica de la libertad &quot; es así como &quot;la educación es un acto de amor, de coraje ; es una practica de la libertad dirigida hacia la realidad, a la que no teme ; más bien busca transformarla, por solidaridad , por espíritu fraternal &quot;. Por lo que su lucha es por y para los sujetos pasivos para modificar su pensamiento y poder alcanzar y lograr ser sujetos libres que transformen el mundo como sujetos emancipados.</p><p>Este marco metodológico permite construir una propuesta en torno a cómo entender y desarrollar las practicas de promoción de la salud emancipatoria teniendo como base la educación popular donde se pueda expresar, dialogar y compartir vivencias y experiencias</p><p>de manera</p><p>que se</p><p>aprenda 99</p><p>del mismo</p><p>hecho en</p><p>una</p><p>acción</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Concepto y Marco Teórico Central</h3>\n<p>La investigación fundamenta su marco ontológico en la propuesta heterodoxa de la pedagoga e investigadora mexicana <strong>Luz María Chapela (2007)</strong>, rompiendo con el enfoque biomédico positivista que reduce la salud a una simple ausencia de enfermedad o a un estado pasivo:</p>\n<blockquote class=\"quote\">«La salud es la capacidad corporeizada de inventar futuros viables y alcanzables, permitiendo a los seres humanos considerarse como sujetos éticos capaces de construir conocimiento independientemente de los expertos o de las instituciones y, con base en ese conocimiento, dar significado, valor y sentido a su mundo y práctica» (Ramírez Ibarra, 2011, p. 2, 96).</blockquote>\n\n<h3>2. Las 6 Capacidades Humanas Constitutivas</h3>\n<p>Chapela plantea que la salud no se concibe fuera del cuerpo vivo y sintiente, en el cual se articulan seis capacidades humanas indisociables (p. 96-97):</p>\n<ul>\n  <li><strong>Capacidad de Razonamiento (Homo Sapiens):</strong> Discernir críticamente entre el autocuidado y el riesgo sin tutela ciega.</li>\n  <li><strong>Capacidad de Imaginar y Jugar (Homo Ludens):</strong> Idear horizontes viables y proyectar alternativas frente a la adversidad.</li>\n  <li><strong>Dimensión Erótica (Pulsión Afectiva):</strong> El placer, el deseo, la ternura y la afectividad como motores existenciales.</li>\n  <li><strong>Capacidad de Trabajo (Homo Faber):</strong> Transformar el entorno material mediante la acción comunitaria.</li>\n  <li><strong>Capacidad Política:</strong> Deliberar, disentir y ejercer soberanía sobre el propio cuerpo y destino.</li>\n  <li><strong>Capacidad Económica:</strong> Movilizar capitales materiales y simbólicos (Pierre Bourdieu) para alcanzar los proyectos trazados.</li>\n</ul>\n\n<h3>3. Aplicación Crítica y Bioética en el Centro de Salud</h3>\n<p>La autora demuestra que cuando el médico del Centro de Salud T-III regaña a los jóvenes o les exige tutores para darles condones, <strong>anula su capacidad política y erótica</strong>, dejándolos desamparados frente al VPH y al VIH al arrebatarles su condición de sujetos con agencia.</p>\n</div>", "links": ["OTTAWA_1986", "PS_EMANCIPATORIA", "PS_INSTITUCIONAL", "SUJETO_ETICO", "PROYECTO_VIDA"]}, {"id": "OTTAWA_1986", "title": "Carta de Ottawa (1986) y Prerrequisitos de Salud", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 85-89", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 85 del PDF original (Tesis UACM):</span><p>3. 1. Socio histórico</p><p>Hasta antes del siglo XIX el estudio de la enfermedad estaba centrado bajo un paradigma positivista que atendía la evidencia y la experimentación como las únicas posibilidades de explicación de los procesos patógenos en los organismos. No obstante, en el año de 1848 Rudolf Virchow, importante patólogo encabezó en Alemania un movimiento médico que promovía un cambio en la manera de estudiar y tratar las enfermedades con su teoría celular, mientras tanto Salomón Neumman señalaba el papel de la sociedad, la protección de la vida y la sa lud de los ciudadanos. Virchow convencido afirmaba &quot;la medicina es una ciencia social y la política no es más que medicina a gran escala&quot; (Virchow, 1849).</p><p>A principios del siglo XVIII en Europa se visualiza la noción de la medicina como &quot;ciencia social&quot; a partir de las investigaciones de Bernardino Ramazzini en 1700 publicadas en su libro &quot;Discurso sobre las enfermedades de los trabajadores&quot; en el que se aborda el tema de las condiciones del lugar del trabajo y las enfermedades de los trabajadores. Por su parte , en 1794 Johann Peter Frank maneja una visión desde la salud pública sobre el condicionamiento social de las enfermedades con su obra : System einer vollstandigen medicinischen polizey (Sistema de una policía integral) (Sige rist , 1992).</p><p>En Inglaterra, en el año de 1844 Chadwick elabora un informe en el que demuestra la relación de las enfermedades con las condiciones de trabajo &quot;Inquirí into the sanitary cond ition of the labouring population in Great Britain&quot; y en 1845 Federico Engels publica 77</p></div><div class='page-block'><span class='page-marker'>📄 Página 86 del PDF original (Tesis UACM):</span><p>&quot;La situación de la clase obrera en Inglaterra&quot;. En ésta realiza el análisis de la situación del proletariado inglés, en la sociedad burguesa más desarrollada en Europa para aquel entonces, investiga la aparición y desarrollo de la clase obrera con gran abundancia de datos históricos. Mediante la utilización del materialismo histórico y con espíritu creador, Engels (1845) llega a la conclusión de que el proletariado lucha contra el régimen capitalista por la propia situación de explotación y miseria en la que vive. La Revolución Industrial determinó la aparición de dos nuevas clases sociales: la burguesía industrial (los dueños de las fábricas) y el proletariado industrial (los trabajadores). Se los llamaba proletarios porque su única propiedad era su prole, o sea sus hijos, quienes, generalmente a partir de los cinco años, se incorporaban al trabajo.</p><p>A muchos capitalistas no les importaba que sus trabajadores, a veces niños de siete años, trabajaran 12 o 14 horas por día en condiciones insalubres, con graves riesgos físicos . Su única preocupación era aumentar la producción al menor costo posible, es decir, pagando el salario más bajo que se pudiera, aprovechándose de la gran cantidad de desocupados que había. Esta situación de injusticia llevó a la aparición de los primeros sindicatos de trabajadores y de huelgas en demanda de aumentos de sueldo y de mejoras en las condiciones de trabajo. La unión de los trabajadores posibilitó la sanción de las primeras leyes protectoras de sus derechos y, consecuentemente , el mejoramiento progresivo de su calidad de vida .</p><p>Se afianza la burguesía a partir de la restauración en Inglaterra y de la revolución tanto en Francia como en Estados Unidos. La salud en Inglaterra pasa a estar regida por el movimiento vitalista y el asistencialismo, luego esto se transforma en la medicina de la 78</p></div><div class='page-block'><span class='page-marker'>📄 Página 87 del PDF original (Tesis UACM):</span><p>fuerza de trabajo. Estos métodos están parcialmente sustentados por el Estado. En Francia la medicina se denomina medicina urbana , se dedica a aislar los miasmas y las áreas miasmáticas para evita r los contagios. En Alemania y Holanda (Peter Frank) acuñan la Política médica: Medidas de control y vigilancia del enfermo compulsivas bajo responsabilidad del Estado junto con una imposición de reglas de higiene individual para el pueblo (Filho, 1992).</p><p>Louis Alexander en 1825 estudia 1960 casos de Fred erick Engels señala que las condiciones de la clase trabajadora en Inglaterra en 1844 son responsables del desgaste y el deterioro de sus condiciones de salud. Su texto &quot;Las condiciones de la clase trabajadora en Inglaterra en 1844&quot; es tal vez el primer texto analítico de la epidemiología crítica (Filho, 1992).</p><p>Al aumentar el conocimiento de las enfermedades transmisibles se monopoliza el avance del conocimiento epidemiológico dirigido a los procesos de transmisión o control de epidemias prevalentes en ese entonces. La primera epidemiología de la salud pública , la medicina socia l del colonialismo , se preocupaba por la viruela , la malaria y las enfermedades tropicales . El retardo del proceso de la epidemiología como ciencia autónoma se debe a estas derivaciones. La epidemiología retoma más adelante la tradición médico social de lo colectivo como algo más que un conjunto de individuos, a través del aporte que produce un avance independiente de la estadística : la teoría de las probabilidades . La introducción del raciocinio estadístico en la investigación epidemiológica rechaza el carácter fundamentalmente descriptivo de /a epidemiología de /as epidemias (Filho, 1992). 79</p></div><div class='page-block'><span class='page-marker'>📄 Página 88 del PDF original (Tesis UACM):</span><p>BIBLIOTECA UACM Por otro lado, Henry Sigerist (1929) tuvo un papel importante en el movimiento de la &quot;socialized medicine&quot; de los años cuarenta en Estados Unidos, el cual fue opacado por la política de oposición que emprendió el gobierno estadounidense e instituciones como la American Medical Association , la American Hospital Associtation y la American Bar Association, entre otras (Starr, 1882; Derickson, 1997). Hacia el último tercio del siglo XX surgen una serie de trabajos de autores como Thomas McKeowen ( 1962, 1982), Cristina Laurell (1974, 1975, 1979) y Vicente Navarro (1976, 1978) (Mendoza, 2008).</p><p>A finales de la década de 1970 se da una polémica intensa respecto al carácter de la enfermedad . Lo que se discute es si ésta es esencialmente biológica o , por el contrario, social. Hay así un cuestionamiento profundo al paradigma dominante de la enfermedad que la conceptualiza como un fenómeno biológico in dividual. Las razones del surgimiento o, mejor dicho , del resurgimiento actual de esta polémica deben buscarse tanto en el desarrollo de la medicina misma como en la sociedad en la cual se articula (Laurell , 1981).</p><p>A partir del panorama anterior ha surgido el por qué de los procesos sa lud-enfermedad de la colectividad humana , más allá de la visión y explicación médico-patológica analizando los factores y ca usas de enfermedades individuales y desde luego colectivas , es decir se ha planteado la importancia de estudiar el con te xto económico, social y cultural de los individuos, ya que existen grados de vulnerabilidad en diferentes grupos de población, por ejemplo, no es lo mismo una colectividad que vive en una pobreza extrema que con una que cuenta con todos los servicios públicos, pues en gran medida de ello dependerá su salud, la naturaleza social de la enfermedad no se 80</p></div><div class='page-block'><span class='page-marker'>📄 Página 89 del PDF original (Tesis UACM):</span><p>verifica en el caso clínico sino en el modo característico de enfermar y morir de los grupos humanos (Laurel!, 1981).</p><p>Por esto, el estudio del proceso salud-enfermedad ha permitido conocer las condiciones de una colectividad y su relación con su medio específico porque revisa a las mismas pero visto más allá de la visión biologista de las condiciones de salud como un proceso determinado por las condiciones de vida .</p><p>Sin embargo, en la actualidad la práctica y la investigación de la medicina moderna se basan en el modelo biológico de la enfermedad no por ello se ha dejado de estudiar su carácter histórico-social, así desde esta perspectiva la salud-enfermedad (S-E) es un proceso histórico determinado por las condiciones materiales de vida, es decir depende de su adhesión a determinada clase social para poder explicar los procesos de S-E los cuales están ligados dialécticamente , no son elementos aislados o separados.</p><p>Cuando se dice que la S-E se encuentra determinada por sus condiciones de vida se alude necesariamente al papel que los individuos tienen frente a los medios de producción, así unos son los dueños de éstos y otros alquilan su fuerza de trabajo a los . dueños de los medios de producción , esta posición los coloca en una relación de desiguales. Las desigualdades sociales determinan la forma de enfermarse y de morir en una sociedad determinada (aspecto que puede tener una referencia verificable en los perfiles epidemiológicos).</p><p>81</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Marco Internacional y Declaración de Principios</h3>\n<p>La tesis analiza las aportaciones de la <em>Primera Conferencia Internacional sobre la Promoción de la Salud</em> celebrada en Ottawa, Canadá (noviembre de 1986):</p>\n<blockquote class=\"quote\">«La promoción de la salud consiste en proporcionar a los pueblos los medios necesarios para mejorar su salud y ejercer un mayor control sobre la misma. Para alcanzar un estado adecuado de bienestar físico, mental y social, un individuo o grupo debe ser capaz de identificar y realizar sus aspiraciones, de satisfacer sus necesidades y de cambiar o adaptarse al medio ambiente» (Carta de Ottawa, citada en p. 80-81).</blockquote>\n\n<h3>2. Los 7 Prerrequisitos Estructurales Indispensables (p. 81)</h3>\n<p>La investigación resalta que la salud es inconcebible si el Estado no garantiza las condiciones materiales básicas:</p>\n<ul>\n  <li><strong>La Paz:</strong> Ausencia de violencia armada, policial o comunitaria.</li>\n  <li><strong>La Educación:</strong> Formación crítica, laica y con equidad de género.</li>\n  <li><strong>La Vivienda:</strong> Espacios habitacionales dignos con servicios urbanos.</li>\n  <li><strong>La Alimentación:</strong> Seguridad nutricional para el desarrollo biológico.</li>\n  <li><strong>La Renta / Ingreso:</strong> Salarios justos que erradiquen la precariedad extrema.</li>\n  <li><strong>Un Ecosistema Estable:</strong> Sustentabilidad ambiental y agua potable.</li>\n  <li><strong>La Justicia Social y la Equidad:</strong> Distribución justa de la riqueza y los servicios.</li>\n</ul>\n\n<h3>3. Contraste Crítico con la Realidad de Iztapalapa</h3>\n<blockquote class=\"quote\">«Cualquier mejora en la salud ha de basarse necesariamente en estos prerrequisitos fundamentales... Si no se garantizan la equidad y la justicia social, los programas de salud se reducen a dádivas asistenciales» (p. 81).</blockquote>\n<p>En Iztapalapa, donde el 71% de los adolescentes depende económicamente de sus familias y el hacinamiento es severo, el discurso oficial de Ottawa queda convertido en mera retórica vacía.</p>\n</div>", "links": ["SALUD_CHAPELA", "PS_INSTITUCIONAL", "PS_EMANCIPATORIA", "TERRITORIO_IZTAPALAPA"]}, {"id": "PS_EMANCIPATORIA", "title": "Promoción de la Salud Emancipatoria", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 101-106", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 101 del PDF original (Tesis UACM):</span><p>3. 4. Propuesta emancipatoria</p><p>La presentación de la visión emancipatoria de promoción de la salud ha sido planteada desde un paradigma de las ciencias sociales y con una perspectiva humanista. La propuesta emancipatoria busca estudiar e incorporar a la promoción de la salud el actuar reflexivo y por lo tanto llegar a la emancipación de los sujetos; el centro de la misma es el sujeto cognoscente.</p><p>Dicha propuesta se fundamenta en la teoría de Pierre Bourdieu (1991) fue uno de los sociólogos más relevantes de la segunda mitad del sig lo XX. Sus ideas son de gran relevancia tanto en teoría social como en sociología empírica , especialmente en la sociología de la cultura, de la educación y de los estilos de vida . Su teoría destaca por ser un intento de superar la dualidad tradicional en sociología entre las estructuras sociales y el objetivismo (&quot;fisicalismo&quot;) por un lado, frente a la acción social y el subjetivismo (hermeneútica), por otro lado. Para esto, Bourdieu desarrolla dos conceptos, el habitus y el campo, y resignifica uno ya establecido, el capital.</p><p>Bourdieu (1989) establece un puente analítico entre la esfera más abstracta de la cultura.-</p><p>una</p><p>suerte</p><p>de</p><p>código</p><p>referencial</p><p>que</p><p>orienta</p><p>la</p><p>conducta-</p><p>y</p><p>los</p><p>comportamientos individuales. Así , el habitus es:</p><p>&quot;El sistema de disposiciones duraderas y transferibles (que funcionan) como principios generadores y organizadores de prácticas y representaciones que pueden estar objetivamente adaptadas a sufrir sin suponer la búsqueda consciente de fines y el 93</p></div><div class='page-block'><span class='page-marker'>📄 Página 102 del PDF original (Tesis UACM):</span><p>dominio expreso de las operaciones necesarias para alcanzarlos [ ... ] sin ser producto de obediencia a reglas&quot;. (Bourdieu, 1991 ).</p><p>Podemos entonces entender el concepto de habitus como: las formas de obrar, pensar y sentir que están originadas por la posición que una persona ocupa en la estructura social. Otro concepto es el &quot;campo&quot; , es el espacio social que se crea en torno a la valoración de hechos sociales tales como el arte, la ciencia , la religión y la política . Estos capitales, aparte del capital económico, están formados por el capital cultural, el capital social , y por cualquier tipo de capital que sea percibido como &quot;natural&quot; , forma ésta del capital que denomina capital simbólico. Los agentes, con el habitus que es propio dada su posición social, y con los recursos de que disponen , &quot;juegan&quot; en los distintos campos sociales, y en este juego contribuyen a reproducir y transformar la estructura social.</p><p>Es a partir de la observación de las prácticas de salud oficiales y en algunos casos a la opinión que se tiene sobre el desempeño del personal de salud (actores) en sus respectivos espacios (campos) de trabajo en donde hay una lucha de poderes fundamentada principalmente por el &quot;conocimiento&quot; (científico o reconocido) que en este caso lo posee el médico (a), la enfermera (o), trabajador (a) social, y se siente que está por encima (hablando de niveles) del paciente (cata logado muchas veces como &quot;ignorante&quot;) que se caracteriza por ser un objeto pasivo (muchas de las veces) y no un sujeto analítico y reflexivo , lo que le facilita la relación médico-paciente. Y siguiendo este modelo médico hegemónico la promoción de la salud está llena de discursos manipuladores. 94</p></div><div class='page-block'><span class='page-marker'>📄 Página 103 del PDF original (Tesis UACM):</span><p>Continuando con la línea institucional y sobre la definición de salud que tiene cuenta de algunas características del ser humano, aparentemente divididas en dos dimensiones, ambas juegan un papel de interrelación, es decir, una no existe sin la otra. La primera dimensión</p><p>es</p><p>la</p><p>biológica</p><p>constituida</p><p>básicamente por el cuerpo</p><p>físico</p><p>con</p><p>características específicas que hacen posible ciertas capacidades , como el caminar erguidos, elabora herramientas y utilizarlas, el usar su imaginación y raciocinio . La otra dimensión es precisamente la que le permite nombrar las cosas y darles un significado pues tiene conciencia de sí mismo y del mundo que le rodea , lo que le permite guardar experiencias para aprender de ellas reflexionando en su presente y después poder construir futuros viables , es así que ambas dimensiones van de la mano.</p><p>Es precisamente que todo ser humano tenemos la capacidad de soñar e imaginar nuevos escenarios, evidentemente diferentes (y no positivos necesariamente , entra lo subjetivo de cada humano, por ejemplo, quizá el pobre anhele ser rico para mejorar su situación económica , y para el rico tener esa posición represente un problema el serlo y quizá desee no tener dinero) de manera que se vea beneficiado ante un problema, una necesidad o satisfacción de condiciones de vida. Por lo que con o sin conocimiento de causa el ser humano busca adoptar el entorno en el que vive para lograr y/o alcanzar lo anhelado y para llegar a esto hace uso de ciertos recursos personales, éstas son las capacidades humanas basadas en las capacidades de Bourdieu (1991 ). Éstas son precisamente las que hacen posible que todo sujeto individual y colectivo alcance esas metas y deseos en sus futuros previamente planeados y/o construidos , lo que lleva a una completa satisfacción al sujeto y por ende a niveles altos de salud .</p><p>95</p></div><div class='page-block'><span class='page-marker'>📄 Página 104 del PDF original (Tesis UACM):</span><p>Estas capacidades humanas son la del razonamiento (sapiens), de imaginar (ludens), de motivación o apasionamiento (erótica), de trabajo (faber), la de toma de decisiones (política), y la de uso de los recursos para el logro de proyectos, la capacidad económica.</p><p>Sin emba rgo, para que el sujeto logre sus aspiraciones de acuerdo con la propuesta de Ottawa es indispensable que todo ser humano o colectividad sea reconocido por sí mismo y cuente con información y elementos que le ayuden a ubicarse y comprender su contexto para así poder mirar su pasado reflexionando sobre ello y trasladarlo al presente para comprenderlo y/o modificarlo (si es necesario) entender y aceptarlo y limitaciones, sin que ello lo lleve a una frustración equivoca.</p><p>De acuerdo a Chapela (2007), la sa lud es la capacidad corporeizada de inventar futuros y alcanzarlos.</p><p>Con la definición anterior se puede entender que la salud no se concibe si no consideramos el cuerpo como base fundamental del sujeto en el cua l y/o con el cual corporeíza todo</p><p>aprendizaje, conocimientos, vivencias, experiencias,</p><p>emociones</p><p>dándoles un significado (simbólico) y que estarán presentes en toda su vida, de los cual es representan y determinarán su trayectoria de vida y más aún manejando situaciones estructurales que no se corporeizaron pero que intervienen en su ciclo de vida , luego entonce s, dependerá de el volver al pasado para modificar y/o entender (si fuera el caso) alguna experiencia que le haya dejado huella profunda (toda experiencia la deja y es importante por sí misma, pero hay una o unas que signifique en mayor 96</p></div><div class='page-block'><span class='page-marker'>📄 Página 105 del PDF original (Tesis UACM):</span><p>grado) aclarando que ésta puede ser tanto favorable o no. Por lo tanto , depende de cada persona en qué medida ejerce una o todas sus capacidades humanas en el presente para imaginar y alcanzar futuros deseados en su contexto.</p><p>Entendiendo la salud como la capacidad corporeizada de inventar futuros y alcanzarlos, considerando con qué capitales se cuenta, entendiendo dichos capitales como los bienes materiales o simbólicos que poseen los agentes (o actores) y que pueden utilizar como recurso en el juego de reproducción de significados (Bourdieu, 1991); ya que tanto los capitales y el ejercicio de las capacidades humanas van a decir cómo y qué está limitando la salud y por ende problemas de salud .</p><p>Cabe aclarar que los obstáculos o impedimentos que se presentan para alcanzar proyectos, pueden ser externos e internos, qué pasa , por ejemplo, si una persona está desnutrida desde su infancia debido a la pobreza de su familia , si no fue atendida adecuadamente de alguna enfermedad y esto claro que repercute en su estado actual , lo que le implicará en gran medida conjugarse para esa mirada al pasado e imaginar y alcanzar los futuros deseados; en medida de esto nombramos cuál es el nivel de salud de un sujeto o colectividad , por el primero entendemos que dichos obstáculos no son controlables no están en las manos de las personas modificarlos o cambiarlos, éstos pueden ser la pobreza , el desempleo violencia , falta de espacios recreativos, educativos, culturales , autoritarismo, etcétera . Los segundos son meramente internos que tienen que ver con las capacidades (sapiens, ludens, faber, erótica, política y económica) con cuántos cuenta y en qué medida los mantiene firmes o bien cómo adquirirlos. 97</p></div><div class='page-block'><span class='page-marker'>📄 Página 106 del PDF original (Tesis UACM):</span><p>Y es precisamente lo que la promoción de la salud emancipatoria propone que todo individuo o colectividad sea un sujeto que ejerza sus capacidades humanas haciendo uso, o bien los obtenga , de todos sus capitales dentro del contexto y de su vida personal con lo que conlleva valores , prejuicios , sueños, etcétera, y realmente imagine futuros deseados y no limitarse a lo que el otro y Otro (discursos institucionales de dominación) le impongan, de sometimiento, por lo que el sujeto debe ser firme, reflexivo , autónomo, critico, analítico y por ende libre que lo que se puede lograr con la promoción de la salud emancipatoria basada en una pedagogía de autoconstrucción y de autocrecimiento (Chapela, 2001 ).</p><p>Hablando del Otro puedo mencionar como ejemplo a la Iglesia , escuela, familia , instituciones de salud y a todo aquello que acompaña y/o res paldado por la globalización , mercadotecnia ,</p><p>acu lturación ,</p><p>consumismo</p><p>que juegan</p><p>un</p><p>papel</p><p>importante en la formación de los individuos, principalmente los niños, adolescentes y jóvenes quienes son invadidos y manipulados en su formación presentándoles estereotipos y estatus a seguir que muchas de las veces caen en superficialidades y egocentrismos.</p><p>Es importante aclarar que la propuesta emancipatoria de promoción de la salud se basa , como ya se mencionó, en diferentes conceptos y planteamientos de autores destacados como Bourdieu y sus capitales. Por otro lado involucra conceptos como son las prácticas pedagógicas que se mencionan en la promoción de salud emancipatoria retomadas de la Educación Popular planteada por Paulo Freire (1970), en su trabajo de Pedagogía del oprimido. El origen de la educación popular se dio a partir del interés que 98</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. El Paradigma Crítico de la UACM</h3>\n<p>Frente a la medicina vertical tradicional, la autora defiende el enfoque pedagógico y epistemológico impulsado en la Licenciatura en Promoción de la Salud de la UACM:</p>\n<blockquote class=\"quote\">«La propuesta emancipatoria busca incorporar a la promoción de la salud el paradigma comprensivo... recuperando aportaciones de la sociología de la cultura, la educación popular de Paulo Freire y la bioética ciudadana. Su teoría destaca por considerar a los seres humanos como sujetos éticos capaces de construir conocimiento propio independientemente de los expertos o instituciones» (p. 2-4, 93).</blockquote>\n\n<h3>2. Principios de Transformación Pedagógica</h3>\n<ul>\n  <li><strong>Superación de la Educación Bancaria:</strong> Rechaza que el médico deba 'depositar' órdenes técnicas en un paciente pasivo. Se privilegia la pedagogía de la pregunta y el diálogo de saberes.</li>\n  <li><strong>Desmedicalización de la Sexualidad:</strong> La vida sexual no es un mero asunto bacteriológico o de control de natalidad; comprende afectividad, placer, derechos y vínculos éticos.</li>\n  <li><strong>Construcción de Ciudadanía Sanitaria:</strong> Dotar a los adolescentes de herramientas cognitivas y jurídicas para exigir servicios cálidos y confidenciales (NOM-005).</li>\n</ul>\n\n<h3>3. Conclusión de la Investigación</h3>\n<blockquote class=\"quote\">«Considero que mediante prácticas de promoción de la salud emancipatoria se pueden revertir los problemas planteados inicialmente al permitir a los sujetos su autoconstrucción y la defensa de sus derechos en la atención de la salud» (Ramírez Ibarra, Conclusiones p. 201-202).</blockquote>\n</div>", "links": ["SALUD_CHAPELA", "SUJETO_ETICO", "ESI_EMANCIPATORIA", "MMH_MENENDEZ"]}, {"id": "PS_INSTITUCIONAL", "title": "Promoción de la Salud Institucional", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 190-194", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 190 del PDF original (Tesis UACM):</span><p>impositiva, indiferente, de regaño, los adolescentes entrevistados señalaron sentirse juzgados y discriminados y evocan una frase del personal médico &quot;son muy jóvenes para pensar en sexo o para tomar decisiones correctas&quot;, y las preguntas que surgen son: ¿cuáles son esas decisiones correctas? o ¿cuál es la edad indicada para esto o para aquello?. Y qué significado tiene la palabra sexo ¿es sinónimo de sexualidad y por tanto los y las adolescentes debieran ser seres asexuados?</p><p>&quot;Que los doctores o los trabajadores sepan , el chiste es que nos sepa explicar porque luego hay mucha gente que va y habla y nada más hace lo que tiene que decir, pero en realidad no preguntan, no saben de las inquietudes de uno&quot; (Norma).</p><p>Por lo tanto, el trato es violento hacia los actores, la información es limitada y reduccionista , así lo refleja la información obtenida en los diversos instrumentos utilizados, expresaron sentir un trato indiferente y déspota en consultorios y en el servicio de Trabajo Social, principalmente, los y las adolescentes expresan no sentirse tomados en cuenta al tratarlos con indiferencia , este trato logra cohibir aún más a los y las adolescentes y que en un momento dado la actitud los hace sentir incómodos y frustrados al salir del centro de salud sin una atención y resolución de dudas.</p><p>&quot;Bueno al principio cuando vine aquí en trabajo social no, como que se ponían muy payasas las trabajadoras sociales, pero ya después cuando iba a sacar lo del seguro popular ya ahí si ya tuve el seguro popular&quot; (María). 182</p></div><div class='page-block'><span class='page-marker'>📄 Página 191 del PDF original (Tesis UACM):</span><p>No obstante que en la mayoría de los servicios el trato es violento, se encontró que en el archivo clínico el trato es diferente. Los y las adolescentes suelen acudir en pareja un 17% y en otros casos con la madre o el padre en un 50 %, sólo así se animan ir al centro de salud y preguntar abiertamente sobre sexualidad en estos casos al primer lugar que llegan generalmente es al archivo clínico:</p><p>&quot;Bueno es como le digo depende de con quién vengan , si vienen acompañados de la mamá o del papá hay veces que comienza a preguntar la mamá y ya ella le dice pide tú la información y ya nosotros le decimos qué se te ofrece, qué necesitas o de qué es tu trabajo , qué vas hacer y les damos confianza y empezamos a platicar y ya es cuando vienen con la mamá , pero cuando vienen solos o con amigos es lo que le digo vienen a preguntar pero entre dientes cómo hablando y no hablando rumorando o muchas veces uno le dice al otro pregunta tú, y ya nosotros nos acercamos y les decimos qué se te ofrece&quot; (Sra . Virginia).</p><p>Se pudo constatar por medio de la observación no participante y posteriormente mediante las entrevistas que se realizaron al personal de este servicio, que están sensibilizados al atender a los y las adolescentes; no todo el personal de salud tiene una actitud indiferente. Sin embargo, la estructura de la institución funciona como se ha descrito porque se constituye, finalmente , como agencia de poder y control de un metacampo de poder más amplio .</p><p>183</p></div><div class='page-block'><span class='page-marker'>📄 Página 192 del PDF original (Tesis UACM):</span><p>&quot;Ah pero los adolescentes vienen y preguntan sobre la información, algunos vienen directamente y preguntan dónde puedo encontrar información sobre la sexualidad que me piden en la escuela información del uso del condón y ya</p><p>entonces los mandamos allá arriba</p><p>directamente a trabajo social, son pocos los que vienen y digamos que son de los dos, hombres y mujeres los que vienen&quot; (Sr. Alfonso).</p><p>En el caso de la atención médica el personal refiere estar inmerso en sus tareas laborales, reconoce que los adolescentes requieren de una atención dirigida , sin embargo , concluye que el tiempo laboral no les permite brindar una atención con calidad a los y las adolescentes por la excesiva carga de trabajo y por las metas que la institución les pide, en un esquema de eficiencia pragmática lo que se requiere es &quot;despachar&quot; y contabilizar pacientes , un médico señala al respecto:</p><p>&quot;No, yo creo que como somos el primer enfoque la primera relación yo creo que sería muy importante que nosotros le diéramos algo más, más conocimiento , más armas al &quot;jovencito&quot; para que sepa más sobre la sexualidad y ya si a el le interesa saber más o adentrarse a lo que tenga más inquietud y que no sea suficiente lo que le digamos nosotros pues entonces tendría que ir a una temática de grupo&quot; (Médico Sergio}.</p><p>La falta de sensibilidad del personal médico los lleva a una postura paternalista que más allá de proteger o enseñar, más bien el trato es de reprimir y juzgar lo que lleva a regaños y/o a una atención superficial. A partir de este modo de trato los y las 184</p></div><div class='page-block'><span class='page-marker'>📄 Página 193 del PDF original (Tesis UACM):</span><p>adolescentes exigen que en el Centro de Salud haya personal capacitado con interés y compromiso de escucha de necesidades y resolución de dudas.</p><p>El ejercicio institucional trata a los y las adolescentes como sus subordinados, no permitiendo un acercamiento positivo en la atención sobre sexualidad , y aunque los adolescentes lo identifican terminan por aceptarlo.</p><p>Menéndez (1993), señala que esto se debe a los factores económico-políticos que son determinantes en la constitución de las formas de estratificación social dominantes, pero el reconocimiento de esto no debe conducir a considerar como subordinados ni determinados a los procesos ideológicos y culturales que intervienen en el proceso sa !ud/enfermedad/atención.</p><p>Los conceptos de hegemonía/subalternidad , así como otros procedentes de diferentes corrientes teóricas, asumen la existencia de desigualdades estratificadas, pero incluyendo como parte sustantiva de las mismas a los procesos socioculturales que operan favoreci endo la cohesión/integración , opacando las causales que establecen las desigualdades o promoviendo procesos de oposición o de otro tipo de transacciones , que posibilitan el desarrollo autónomo de sectores subalternos.</p><p>185</p></div><div class='page-block'><span class='page-marker'>📄 Página 194 del PDF original (Tesis UACM):</span><p>Limitación de capacidades</p><p>El personal impone prejuicios y valores personales en la atención . Etiquetan a los y las adolescentes a partir de un estereotipo socialmente negativo; por su condición de clase , apariencia o edad.</p><p>&quot;Me regañó el doctor la otra vez pero estuvo bien . Porque, dice que si sabía, que</p><p>me dolían los ovarios y que si sabía dónde estaban los</p><p>ovarios, pero me dijo que tenía una infección urinaria&quot; (Ana).</p><p>El trabajador de la salud cuenta con el recurso de la palabra y a la vez ésta es algunas veces impositiva , por lo que no oye y; lo que dice es sólo una indicción de lo que no dice, le permitirá buscar formas para escud riñar en el subcontexto, en el contexto y así no perder del todo el sentido de lo que dice y de lo escucha. La comunicación en salud , la producción e intercambio de palabras con las que se significa la salud y los mensajes de sa lud , está sujeta a la imposibilidad de sujetar la palabra y con ella la realidad. Sin embargo, a partir de la ilusión de la verdad de las palabras, los trabajadores e instituciones de salud toman decisiones que co nciernen a la vida , la muerte, el nacimiento, la vida cotidiana , el trabajo, la sexualidad , etcétera, de &quot;los otros&quot; frecuentemente invalidando la posibilidad de que la palabra de &quot;los otros&quot;, también es ilusoriamente verdadera (Chapela , 2004).</p><p>Es claro la postura institucional y el ejercicio de poder en este Modelo Médico Hegemónico validado por la misma institución , como lo señala Menéndez, (1979) dicho 186</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Diagnóstico de la Práctica Institucional Real</h3>\n<p>La autora, laboratorista y promotora en los centros de salud del D.F., realiza una disección crítica del quehacer cotidiano en el Centro de Salud T-III:</p>\n<blockquote class=\"quote\">«La educación sexual en el centro de salud se concentra en la entrega de material gráfico, condonería, campañas de higiene, control médico y pláticas informativas, todo con un enfoque de prescribir y controlar comportamientos y prácticas sexuales de los adolescentes... a estas acciones se les llama formalmente 'promoción de la salud', pero no reflejan un impacto positivo en su aprendizaje» (p. 182).</blockquote>\n\n<h3>2. Los Tres Vicios de la Promoción Burocrática</h3>\n<ul>\n  <li><strong>La 'Condonería' como Trámite:</strong> Repartir preservativos para justificar metas estadísticas, sin capacitar en su colocación correcta, caducidad o negociación coital.</li>\n  <li><strong>Saturación de Folletos (41% del material):</strong> El 23% de los adolescentes confiesa que jamás los lee y un 26% indica que nadie se los explicó.</li>\n  <li><strong>Vigilancia Normatizadora:</strong> La institución asume un rol de policía moral que sanciona a las y los jóvenes que solicitan anticonceptivos.</li>\n</ul>\n\n<h3>3. Evidencia Empírica de la Desconexión</h3>\n<blockquote class=\"quote\">«Al indagar sobre si piden información en materia de educación sexual, los resultados muestran un 73% de adolescentes que NO piden información contra un escaso 27% que sí lo hace» (p. 158).</blockquote>\n</div>", "links": ["OTTAWA_1986", "ESTILOS_VIDA", "CONDONERIA_FOLLETOS", "BARRERAS_CENTRO_SALUD"]}, {"id": "ESTILOS_VIDA", "title": "Enfoque de Estilos de Vida y Culpabilización", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 96-100", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 96 del PDF original (Tesis UACM):</span><p>fluya vigorosamente entre individuo y población (al menos en teoría). No obstante, en la práctica las actividades y actitudes del personal de salud no son acordes a lo planteado con el modelo operativo de promoción de la salud. La actividad de los centros de salud se encuentra direccionada a la difusión y repartición de material impreso (carteles, volante , trípticos , ca rtillas, pulseras, etcétera.) proporcionado por la institución , y que sólo se limita al volanteo y control numérico de material entregado.</p><p>Es de hacerse notar por un lado, que la inmensa mayoría de los formalmente reconocidos como &quot;los recursos humanos&quot; para la salud (médicos, enfermeras, técnicos, etcétera .) fun cionan como mano de obra dentro de planes establecidos sin tomar conciencia ni control de lo planeado globalmente, ignorándolo o no cabalmente reflexionando sobre para qué concepción del mundo y de la vida están trabajando.</p><p>3. 3. Estilos de Vida</p><p>&quot;El concepto de estilo de vida es el que ha tenido mayor visibilidad y aplicación en las últimas décadas por parte de los sa lubristas (Bauer, 1980; Berlingue, 1981 ; Blaxter, 1990; Davidson et al. , 1992; Gottlieb y Green , 1984; Pill y Stolt, 1987; Syme , 1978). Este concepto se constituyó a partir corrientes teóricas como el marxismo, el comprensivismo</p><p>weberiano ,</p><p>el</p><p>psicoanálisis</p><p>y</p><p>el</p><p>culturali smo</p><p>antropológico</p><p>estadounidense (Corei l etal. , 1985), aunque debe reconoce rse que las concepciones teóricas que más influyen en la formulación y el desarrollo de esta idea son las historicistas alemanas&quot; (Menéndez, 1998).</p><p>88</p></div><div class='page-block'><span class='page-marker'>📄 Página 97 del PDF original (Tesis UACM):</span><p>Continuando con Menéndez (1998), explica: &quot;el concepto estilo de vida fue aplicado inicialmente por las ciencias sociohistóricas al análisis de las características y los comportamientos</p><p>socioculturales</p><p>de conjuntos como clases sociales o grupos</p><p>nacionales. La aplicación biomédica &quot;extrajo&quot; el padecimiento de los procesos culturales</p><p>y sociales en que se desarrolla, y utilizó el concepto estilo de vida para describir rasgos específicos de comportamientos relacionados primero con determinadas enfermedades crónicas, y mas tardíamente con las violencias y las adicciones. Este concepto sólo fue utilizado para describir rasgos determinados de padecimientos excluyendo</p><p>las</p><p>enfermedades infectocontagiosas o la desnutrición y algunas formas de vida (por ejemplo el beber agua no potable), pese a la relación de las mismas con determinadas formas (estilos) de vida &quot;.</p><p>La epidemiología tradicional utilizó el concepto en otro sentido, suprim iendo el carácter holístico, reduciéndolo a conductas de riesgo, comportamientos individuales de los sujetos, señalando determinados factores de riesgo e invisibilizando las condiciones materiales de vida , los elementos cu lturales e ideológicos y poniendo en el centro del análisis la conducta de riesgo.</p><p>Por otro lado tenemos otras visiones de estilo de vida , según Stone (1979), la salud ya no se conceptualiza como la ausencia de enfermedad , sino que se entiende como un estado positivo de bienestar. Siguiendo esta visión nos situamos en el concepto de &quot;Estilo de Vida Saludable&quot;, es aquel que permite ir introduciendo en la manera de vivir de las personas, pautas de conductas, que tanto individual como colectivamente de forma cotidiana, mejora su calidad de vida . 89</p></div><div class='page-block'><span class='page-marker'>📄 Página 98 del PDF original (Tesis UACM):</span><p>Si partimos de que las enfermedades crónicas difieren de las dolencias infecciosas en al menos tres aspectos. En primer lugar, es probable que aquellas perduren mucho tiempo, mientras que éstas, las infecciosas, con frecuencia se pueden curar con relativa rapidez y de manera total. En segundo lugar, las enfermedades crónicas obedecen en la mayoría de los casos a conductas y estilos de vida que no favorecen a un equilibrio adecuado, mientras que las infecciosas son causadas por bacterias y virus . Por eso, las vacunaciones, las mejoras sanitarias y otras medidas públicas fueron eficaces para combatir las principales causas de mortalidad de com ienzos del siglo . (Brannon y Feist, 1992).</p><p>Desde la perspectiva actual de los estilos de vida las enfermedades crónicas (cáncer, SIDA, Diabetes, Hipertensión) han sustituido a las infecciosas como ca usas principales de muerte. La peculiaridad de tales padecimientos es que se encu entran asociados estrechamente con la conducta humana y el estilo de vida de los sujetos . Por ello, en la actualidad es más adecuado hablar de patógeno s y de inmunógenos conductuales. Por patógenos conductuales entendemos aquellas conductas que incrementan el riesgo de un individuo a enfermar (por ejemplo: fumar, beber alcohol ). Lo contrario , los inmunógenos conductuales son todos aquellos comportamientos que lo ha ce n menos susceptible de contraer enfermedades (Matarazzo, 1984).</p><p>Las prácticas de promoción de la salud desde la visión de estilos de vida impulsan medidas para impedir que enfermen aquellas personas que gozan de &quot;buena salud &quot;. La prevención primaria implica dos estrategias: 1) cambiar los hábitos negativos de salud</p><p>90</p></div><div class='page-block'><span class='page-marker'>📄 Página 99 del PDF original (Tesis UACM):</span><p>de los sujetos (fumar, beber, dieta), y 2) prevenir los hábitos inadecuados mediante la generación de hábitos positivos y el estímulo para que la población los adopte.</p><p>Todo estilo de vida está favorecido por los hábitos, costumbres , modas, valores existentes y dominantes en cada momento en cada comunidad ; estos factores enumerados tienen como característica común que son aprendidos y por tanto modificables a lo largo de toda la vida . Todo depende del contexto y de los factores personales, interpersonales, ambientales, institucionales, de las políticas públicas, ambiente físico y social. Sin embargo, si un individuo adopta (buenas) conductas saludables, pero su ambiente o contexto no es propicio, de poco le servirá su buena disposición, pues esto no le garantiza una salud favorable .</p><p>Como puede observarse el campo biomédico se apropio del concepto estilos de vida utilizado inicialmente por las ciencias sociales pero despojándolo de los procesos sociales o culturales que contemplaba el concepto y utilizó el concepto de estilos de vida</p><p>para</p><p>describir</p><p>rasgos</p><p>específicos</p><p>y</p><p>comportamientos</p><p>relacionados</p><p>con</p><p>determinadas enfermedades crónico-degenerativas, más tarde con las de violencia y adicciones (Menéndez, 1998). Si bien el concepto hablaba de factores de orden humano no considero en aislado el comportamiento personal o atribuir a los individuos la responsabilidad de su salud .</p><p>Si bien este concepto incluye la intencionalidad , no reduce la capacidad de elección sólo al comportamiento personal. La perspectiva biomédica al apropiarse del concepto</p><p>91</p></div><div class='page-block'><span class='page-marker'>📄 Página 100 del PDF original (Tesis UACM):</span><p>tendrá a trabajar explicita o implícitamente con la noción de que el sujeto puede elegir y actuar en términos intencionales y &quot;responsables&quot; (Menéndez, 1998).</p><p>Para que la visión de estilos de vida pueda cumplir con estas tareas es necesario movilizar mayores recursos financieros para impulsar las políticas de salud, programas de salud, de preferencia recursos públicos; modernizar y ampliar la infraestructura sanitaria y dejar a un lado un tipo de política que obedece a lineamentos de los organismos financieros internacionales. La visión de estilos de vida , en promoción de la salud, se ha orientado a la modificación de comportamientos en los individuos, podemos ver que a partir del informe Lalonde se concibe a la salud a partir de cuatro elementos; biología humana, estilos de vida, ambientes saludables y organización de los sistemas de salud , dándole mayor importancia al elemento de estilos de vida .</p><p>Castro (1986) señala que esta visión ha subordinado el bienestar al ámbito de las relaciones de mercado, en donde la salud se ha convertido en una mercancía , fomenta el consumo de estilos de vida saludable, así el estilo de vida se convierte en un objeto de cambio , en donde los individuos tienen que luchar por conseguir una alimentación sana , disfrutar el ejercicio, compra de vestidos especializados. Los estilos de vida han generado una población altamente consumista en servicios de salud , eliminando o disminuyendo con ello la responsabilidad que tiene el Estado para proporcionar los servicios de salud a toda la población.</p><p>92</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. La Cooptación Neoliberal del Concepto (Lalonde, 1974)</h3>\n<p>En el Capítulo 3.3, la autora desenmascara cómo el campo biomédico distorsionó el concepto de estilos de vida:</p>\n<blockquote class=\"quote\">«El campo biomédico se apropió del concepto estilos de vida... convirtiéndolo en un objeto de consumo y culpabilizando a quienes no los adoptan. Las prácticas de promoción desde esta visión impulsan medidas para cambiar hábitos individuales (fumar, comer, beber), omitiendo que si el contexto socio-territorial es precario, la salud seguirá deteriorada» (p. 89-91).</blockquote>\n\n<h3>2. Patógenos e Inmunógenos Conductuales (Matarazzo, 1984)</h3>\n<ul>\n  <li><strong>Patógenos conductuales:</strong> Comportamientos individuales clasificados como de riesgo (inicio sexual temprano, no usar condón, consumo de alcohol).</li>\n  <li><strong>Inmunógenos conductuales:</strong> Conductas protectoras prescritas (abstinencia, uso regular del preservativo, visitas médicas).</li>\n</ul>\n\n<h3>3. La Culpabilización del Adolescente como Coartada Estatal</h3>\n<blockquote class=\"quote\">«Si un individuo adopta conductas saludables, pero su ambiente o contexto no es propicio, de poco le servirá su buena disposición, pues esto no le garantiza una salud favorable» (p. 91).</blockquote>\n<p>Exigir 'conductas responsables' en colonias con desabasto de agua, deserción escolar y violencia territorial exime al Estado de su responsabilidad estructural.</p>\n</div>", "links": ["PS_INSTITUCIONAL", "MMH_MENENDEZ", "TERRITORIO_IZTAPALAPA"]}, {"id": "SUJETO_ETICO", "title": "El Adolescente como Sujeto Ético y Político", "group": "salud", "badge": "Núcleo de la Salud", "color": "#2d6a4f", "pages": "Págs. 104-107", "transcrito_html": "<div class='page-block'><span class='page-marker'>📄 Página 104 del PDF original (Tesis UACM):</span><p>Estas capacidades humanas son la del razonamiento (sapiens), de imaginar (ludens), de motivación o apasionamiento (erótica), de trabajo (faber), la de toma de decisiones (política), y la de uso de los recursos para el logro de proyectos, la capacidad económica.</p><p>Sin emba rgo, para que el sujeto logre sus aspiraciones de acuerdo con la propuesta de Ottawa es indispensable que todo ser humano o colectividad sea reconocido por sí mismo y cuente con información y elementos que le ayuden a ubicarse y comprender su contexto para así poder mirar su pasado reflexionando sobre ello y trasladarlo al presente para comprenderlo y/o modificarlo (si es necesario) entender y aceptarlo y limitaciones, sin que ello lo lleve a una frustración equivoca.</p><p>De acuerdo a Chapela (2007), la sa lud es la capacidad corporeizada de inventar futuros y alcanzarlos.</p><p>Con la definición anterior se puede entender que la salud no se concibe si no consideramos el cuerpo como base fundamental del sujeto en el cua l y/o con el cual corporeíza todo</p><p>aprendizaje, conocimientos, vivencias, experiencias,</p><p>emociones</p><p>dándoles un significado (simbólico) y que estarán presentes en toda su vida, de los cual es representan y determinarán su trayectoria de vida y más aún manejando situaciones estructurales que no se corporeizaron pero que intervienen en su ciclo de vida , luego entonce s, dependerá de el volver al pasado para modificar y/o entender (si fuera el caso) alguna experiencia que le haya dejado huella profunda (toda experiencia la deja y es importante por sí misma, pero hay una o unas que signifique en mayor 96</p></div><div class='page-block'><span class='page-marker'>📄 Página 105 del PDF original (Tesis UACM):</span><p>grado) aclarando que ésta puede ser tanto favorable o no. Por lo tanto , depende de cada persona en qué medida ejerce una o todas sus capacidades humanas en el presente para imaginar y alcanzar futuros deseados en su contexto.</p><p>Entendiendo la salud como la capacidad corporeizada de inventar futuros y alcanzarlos, considerando con qué capitales se cuenta, entendiendo dichos capitales como los bienes materiales o simbólicos que poseen los agentes (o actores) y que pueden utilizar como recurso en el juego de reproducción de significados (Bourdieu, 1991); ya que tanto los capitales y el ejercicio de las capacidades humanas van a decir cómo y qué está limitando la salud y por ende problemas de salud .</p><p>Cabe aclarar que los obstáculos o impedimentos que se presentan para alcanzar proyectos, pueden ser externos e internos, qué pasa , por ejemplo, si una persona está desnutrida desde su infancia debido a la pobreza de su familia , si no fue atendida adecuadamente de alguna enfermedad y esto claro que repercute en su estado actual , lo que le implicará en gran medida conjugarse para esa mirada al pasado e imaginar y alcanzar los futuros deseados; en medida de esto nombramos cuál es el nivel de salud de un sujeto o colectividad , por el primero entendemos que dichos obstáculos no son controlables no están en las manos de las personas modificarlos o cambiarlos, éstos pueden ser la pobreza , el desempleo violencia , falta de espacios recreativos, educativos, culturales , autoritarismo, etcétera . Los segundos son meramente internos que tienen que ver con las capacidades (sapiens, ludens, faber, erótica, política y económica) con cuántos cuenta y en qué medida los mantiene firmes o bien cómo adquirirlos. 97</p></div><div class='page-block'><span class='page-marker'>📄 Página 106 del PDF original (Tesis UACM):</span><p>Y es precisamente lo que la promoción de la salud emancipatoria propone que todo individuo o colectividad sea un sujeto que ejerza sus capacidades humanas haciendo uso, o bien los obtenga , de todos sus capitales dentro del contexto y de su vida personal con lo que conlleva valores , prejuicios , sueños, etcétera, y realmente imagine futuros deseados y no limitarse a lo que el otro y Otro (discursos institucionales de dominación) le impongan, de sometimiento, por lo que el sujeto debe ser firme, reflexivo , autónomo, critico, analítico y por ende libre que lo que se puede lograr con la promoción de la salud emancipatoria basada en una pedagogía de autoconstrucción y de autocrecimiento (Chapela, 2001 ).</p><p>Hablando del Otro puedo mencionar como ejemplo a la Iglesia , escuela, familia , instituciones de salud y a todo aquello que acompaña y/o res paldado por la globalización , mercadotecnia ,</p><p>acu lturación ,</p><p>consumismo</p><p>que juegan</p><p>un</p><p>papel</p><p>importante en la formación de los individuos, principalmente los niños, adolescentes y jóvenes quienes son invadidos y manipulados en su formación presentándoles estereotipos y estatus a seguir que muchas de las veces caen en superficialidades y egocentrismos.</p><p>Es importante aclarar que la propuesta emancipatoria de promoción de la salud se basa , como ya se mencionó, en diferentes conceptos y planteamientos de autores destacados como Bourdieu y sus capitales. Por otro lado involucra conceptos como son las prácticas pedagógicas que se mencionan en la promoción de salud emancipatoria retomadas de la Educación Popular planteada por Paulo Freire (1970), en su trabajo de Pedagogía del oprimido. El origen de la educación popular se dio a partir del interés que 98</p></div><div class='page-block'><span class='page-marker'>📄 Página 107 del PDF original (Tesis UACM):</span><p>Freire tenia por los adultos en Brasil y urgentemente solicitada, inició en 1947 ya que la forma y el método tradicional de enseñanza-alfabetización le parecen insuficientes, ya que sólo consideraba la educación como una manera de someter y &quot;domesticar&quot; al hombre no permitiéndole ser libre (Barreiro, 1977). Freire trabajó con campesinos de varios lugares de Brasil obteniendo resultados extraordinarios en los grupos formados llamados &quot;Círculos de Cultura&quot;, donde aprendían de manera rápida en menos de 45 días a leer y escribir, lo que asombró a toda la opinión pública los avances verdaderamente revolucionarios; que evidentemente no eran del agrado de las clases dominantes ya que no iban a tolerar la transformación de una sociedad pasiva , manejable y sometida; y ante el asombró se percibía una sociedad fuerte , analítica y crítica que no estaría más dispuesta a ser sometida.</p><p>Freire (1977) argumenta que: &quot;el hombre fue creado para comunicarse con los otros hombres&quot; y debe contar y ejercer &quot;la educación como práctica de la libertad &quot; es así como &quot;la educación es un acto de amor, de coraje ; es una practica de la libertad dirigida hacia la realidad, a la que no teme ; más bien busca transformarla, por solidaridad , por espíritu fraternal &quot;. Por lo que su lucha es por y para los sujetos pasivos para modificar su pensamiento y poder alcanzar y lograr ser sujetos libres que transformen el mundo como sujetos emancipados.</p><p>Este marco metodológico permite construir una propuesta en torno a cómo entender y desarrollar las practicas de promoción de la salud emancipatoria teniendo como base la educación popular donde se pueda expresar, dialogar y compartir vivencias y experiencias</p><p>de manera</p><p>que se</p><p>aprenda 99</p><p>del mismo</p><p>hecho en</p><p>una</p><p>acción</p></div>", "resumen_html": "<div class=\"summary-card\">\n<h3>1. Desmontando el Estigma de la 'Inmadurez'</h3>\n<p>La tesis denuncia el adultocentrismo que etiqueta al joven como un ser incompleto y peligroso:</p>\n<blockquote class=\"quote\">«A los y las adolescentes se les asigna o etiqueta con un rol de rebeldes, inmaduros e irresponsables... tanto es la repetición de este mensaje que el adolescente lo adopta. Sin embargo, desde la promoción heterodoxática se considera a los seres humanos como sujetos éticos capaces de construir conocimiento y dar sentido a su mundo» (p. 2, 15).</blockquote>\n\n<h3>2. Pilares de la Condición Ética Juvenil</h3>\n<ul>\n  <li><strong>Autonomía y Consentimiento:</strong> Derecho a decir cuándo, cómo y con quién ejercer su sexualidad libre de coacción.</li>\n  <li><strong>Capacidad Deliberativa:</strong> Poder interpelar al médico, elegir métodos anticonceptivos y recibir información científica veraz.</li>\n
